 "Earth", "Jupiter", "the planet orbiting Proxima Centauri"], "answer": 3, "ex": "Proxima Centauri를 도는 행성을 가리켜요."}]}, "6": {"passage": "When people hear the word “technology,” many think of the newest, most modern robots or electronic gadgets. But technology is defined as the use of science to make new things and solve problems. People have always used technology to solve problems. Take a look at some technologies of the past that really changed how humans live.\nAround 2.6 million years ago\nOur ancestors began using simple stone tools as hammers and knives. This may be considered the earliest use of technology.\nAround 25,000 years ago\nThe sewing needle was invented. It became much easier for people to make and wear clothes, something that they had begun doing about 170,000 years ago.\nAround 5,500 years ago\nThe wheel was invented in Mesopotamia in 3500 *BCE. This technology was originally developed for potters. It took\n300 years for the wheel to be used for transport.\nAround 600 years ago\nIn 1439, Johannes Gutenberg demonstrated the printing press. With this machine, it was possible to create many copies of a paper in little time. The printing press led to the spread of information through books and newspapers.\nAround 150 years ago\nBy the late 1800s, different inventors were working on the automobile. Karl Friedrich Benz created the first automobile powered by gasoline. It looked more like a bike than a car!\nAround 100 years ago\nOn March 25, 1925, John Logie Baird showed the first televised images in motion at a London department store. The invention of the TV set brought the world into people’s homes.\nSince the 1970s\nThe first mobile telephone call took place in 1973, and mobile phones became more common by the mid-1980s. By 1993, the first smartphone was invented. These gadgets have since changed how we do almost everything!", "speaking": "Which invention from the passage do you think changed people's lives the most? Why?", "speakStarters": ["I think hing clearly", "ko": "보여주다"}, {"word": "take place", "form": "took place", "pos": "phr.", "en": "to happen", "ko": "발생하다, 일어나다"}], "vocab": [["gadget", "My dad loves kitchen gadgets like the new egg cutter.", ["a type of game", "a small, useful device or machine", "a large building", "a kind of food"], 1, "gadget = 작은 기기, 장치."], ["define", "Can you define the word \"brave\"?", ["to say something loudly", "to spell something wrong", "to explain the meaning of something", "to forget the meaning of something"], 2, "define = 정의하다."], ["ancestor", "My ancestors came from a small village.", ["someone in your family who lived a long time ago", "a teacher of history", "a person who lives next door", "a friend from school"], 0, "ancestor = 조상."], ["needle", "Grandma used a needle and thread to fix my shirt.", ["a piece of cloth", "a small, very thin object that is used in sewing", "a large pair of scissors", "a box for buttons"], 1, "needle = 바늘."], ["potter", "The potter made a bowl out of clay.", ["someone who makes pots, plates, and other objects out of clay", "someone who grows vegetables", "someone who builds boats", "someone who paints houses"], 0, "potter = 도예가."], ["transport", "Trains are an important form of transport.", ["the act or process of moving people or things from one place to another", "a way of cooking food", "a way of growing plants", "a way of saving money"], 0, "transport = 운송 수단, 이동 방법."], ["printing press", "The printing press made books much cheaper.", ["a machine that washes dishes", "a machine that makes clothes", "a machine that prints books, magazines, newspapers, etc.", "a machine that cuts wood"], 2, "printing press = 인쇄기."], ["automobile", "The automobile changed the way people traveled.", ["a vehicle used for carrying passengers on streets and roads", "a boat for long journeys", "a train under the city", "a plane for short trips"], 0, "automobile = 자동차."], ["televise", "The final game will be televised around the world.", ["to cancel at the ns": ["faster cars", "the spread of information through books and newspapers", "better clothes", "the invention of the TV"], "answer": 1, "ex": "The printing press led to the spread of information …"}, {"type": "추론", "q": "What can we infer about Karl Benz's first automobile?", "options": ["It was very fast.", "It was very different from the cars we have today.", "It could carry many people.", "It was powered by electricity."], "answer": 1, "ex": "It looked more like a bike than a car! 오늘날 자동차와 많이 달랐어요."}]}, "7": {"passage": "Nature can be beautiful, but it can also be dangerous. Take wildfires, for example. More and more wildfires have been burning recently. They’ve burned millions of hectares in the last few years. Wildfires occur most often in the western US, but they can happen anywhere.\n\nNatural causes like lightning and hot sunlight have caused wildfires, but four out of five wildfires are started by humans. Once a wildfire starts, it burns anything in its path, such as trees, bushes, and even buildings. Dry weather and high winds help wildfires spread, and they can move very quickly, up to 23 km an hour.\n\nSo, what should you do to prevent a wildfire? First, always be careful around fire. Follow fire safety rules in parks and public areas, especially when camping. And if you do make a fire outdoors, be sure that you put it out completely. Even if you’re careful, you should be prepared for a wildfire. If one starts in your area, check TV, radio, and smartphone emergency alerts to learn what to do. Pay attention to the fire and communicate with emergency workers. Always follow their instructions.\n\nWildfires can be scary, but did you know they can actually help a forest? Fire kills sick plants and harmful insects that have been living in the forest’s ecosystem. Certain animals do better in the burned-out habitat that fires create. And by burning trees and their leaves, wildfires allow sunlight to reach the forest floor, so light can reach seedlings and help them grow into new plants. Wildfires are dangerous and can cause a lot of damage. But they’re also a part of the natural world, and they can be healthy for a forest. So, we can’t simply view them as destruction: we can also think of them as nature making room for new beginnings.", "speaking": "What should people do to prevent wildfires when they go camping?", "speakStarters": ["When camping, people should …", "They also need to …", "This is important because …"], "prompt": "Wildfires are dangerous, but they can also help a forest. Explain both sides using examples from the passage. Write 6–8 sentences.", "starters": ["Wildfires can be very dangerous because …", "For example, …", "However, wildfires can also …", "For instance, …", "So, I think …"], "cards": [{"word": "burn", "form": "burning", "pos": "", "en": "to be on fire; to damage something by fire", "ko": "불에 타다"}, {"word": "occur", "form": "occur", "pos": "", "en": "to happen", "ko": "발생하다, 일어나다"}, {"word": "cause", "form": "causes", "pos": "", "en": "something or someone that makes something happen or exist", "ko": "원인"}, {"word": "prevent", "form": "prevent", "pos": "", "en": "to stop something from happening or existing", "ko": "방지하다, 예방하다"}, {"word": "public", "form": "public", "pos": "", "en": "able to be used by anyone", "ko": "공공의"}, {"word": "put out", "form": "put it out", "pos": "phr.", "en": "to make a fire stop burning", "ko": "(불을) 끄다"}, {"word": "alert", "form": "alerts", "pos": "", "en": "an alarm or signal of danger", "ko": "경계경보"}, {"word": "harmful", "form": "harmful", "pos": "", "en": "causing damage or harm", "ko": "해로운, 유해한"}, {"word": "habitat", "form": "habitat", "pos": "", "en": "the natural place where a plant or animal lives or grows", "ko": "서식지"}, {"word": "destruction", "form": "destruction", "pos": "", "en": "the act of destroying something", "ko": "파괴"}, {"word": "wildfire", "form": "wildfires", "pos": "", "en": "a very big fire that spreads quickly over a large area", "ko": "들불, 산불"}, {"word": "lightning", "form": "lightning", "pos": "", "en": "the flashes of light that are produced in the sky during a storm", "ko": "번개"}, {"word": "instruction", "form": "instructions", "pos": "", "en": "something that someone tells you to do", "ko": "지시, 설명"}, {"word": "seedling", "form": "seedlings", "pos": "", "en": "a young plant grown from seed", "ko": "묘목"}], "vocab": [["burn", "The candle burned all night.", ["to be on fire; to damage something by fire", "to fall over", "to melt in water", "to freeze"], 0, "burn = (불에) 타다."], ["occur", "Earthquakes often occur in this area.", ["to disappear", "to grow", "to happen", "to stop"], 2, "occur = 발생하다."], ["cause", "The cause of the accident was ice on the road.", ["a place where something happens", "a result of something", "something or someone that makes something happen or exist", "a time when something happens"], 2, "cause = 원인."], ["prevent", "Washing your hands can prevent colds.", ["to share something with others", "to make something worse", "to make something happen", "to stop something from happening or existing"], 3, "prevent = 막다, 예방하다."], ["public", "You can use the public library for free.", ["owned by one family", "able to be used by anyone", "closed to everyone", "only for teachers"], 1, "public = 공공의."], ["put out", "The firefighters put out the fire quickly.", ["to start a fire", "to make a fire stop burning", "to make a fire bigger", "to watch a fire"], 1, "put out = (불을) 끄다."], ["alert", "We got a phone alert about the heavy rain.", ["a birthday message", "a kind of game", "a weather map", "an alarm or signal of danger"], 3, "alert = 경보."], ["harmful", "Smoking is harmful to your health.", ["causing damage or harm", "helpful", "very popular", "very cheap"], 0, "harmful = 해로운."], ["habitat", "The forest is the natural habitat of many birds.", ["a type of food", "the natural place where a plant or animal lives or grows", "a cage in a zoo", "a kind of bird song"], 1, "habitat = 서식지."], ["destruction", "The storm caused a lot of destruction in the town.", ["the act of building something", "the act of saving something", "the act of cleaning something", "the act of destroying something"], 3, "destruction = 파괴."], ["wildfire", "The wildfire spread quickly across the dry hills.", ["a fire in a fireplace", "a small fire for cooking", "a very big fire that spreads quickly over a large area", "a fire used in a show"], 2, "wildfire = 산불."], ["lightning", "We saw lightning flash across the dark sky.", ["a strong wind", "the sound of a storm", "the flashes of light that are produced in the sky during a storm", "heavy rain"], 2, "lightning = 번개."], ["instruction", "Read the instructions before you start the test.", ["something that someone tells you to do", "a mistake you make", "a gift you give", "a question you ask"], 0, "instruction = 지시, 설명."], ["seedling", "We planted tomato seedlings in the garden.", ["a young plant grown from seed", "an old tree", "a dead leaf", "a kind of flower"], 0, "seedling = 묘목, 어린 식물."]], "comp": [{"type": "주제", "q": "What is the main idea of the passage?", "options": ["Wildfires only happen in the western US.", "People should never go camping.", "Wildfires are dangerous, but they can also be healthy for forests.", "Only lightning causes wildfires."], "answer": 2, "ex": "산불은 위험하지만 숲에 도움이 되기도 한다는 내용이에요."}, {"type": "세부 내용", "q": "How many wildfires are started by humans?", "options": ["one out of five", "four out of five", "two out of five", "all of them"], "answer": 1, "ex": "four out of five wildfires are started by humans."}, {"type": "세부 내용", "q": "What helps wildfires spread?", "options": ["sick plants and insects", "emergency alerts", "cold weather and rain", "dry weather and high winds"], "answer": 3, "ex": "Dry weather and high winds help wildfires spread …"}, {"type": "어휘", "q": "In paragraph 3, the phrase \"put it out\" is closest in meaning to ______.", "options": ["watch it", "take it outside", "stop it from burning", "start it"], "answer": 2, "ex": "put out = (불을) 끄다."}, {"type": "추론", "q": "How can wildfires help seedlings?", "options": ["by killing all the animals", "by letting sunlight reach the forest floor", "by making the soil wet", "by bringing rain"], "answer": 1, "ex": "나무와 잎이 타면 햇빛이 숲 바닥까지 닿아 어린 식물이 자라요."}]}, "8": {"passage": "You’ve probably already learned a lot about animals, but you probably haven’t been studying animals as unusual as these. Here are three unusual creatures found in nature.\n\nDuck-Billed Platypus\nThis unusual Australian animal seems to have parts from other more common species: a duck’s bill, a body covered with fur, and a beaver-like tail. The platypus is a good swimmer, but it also lives on land. Its webbed feet change when it’s on land to help it run. The platypus is a mammal—mothers nurse their babies for about four months. But what’s unusual about this mammal is that it lays eggs!\n\nShort-Horned Lizard\nThe short-horned lizard lives in North America. It has horns on its head and back, and a body covered in scales. What makes the short-horned lizard different from other reptiles is how it defends itself. It can blow its body up so it looks like a spiked balloon. If that doesn’t work, it shoots blood from its eyes to trick predators. It can shoot the blood from 1 m away.\n\nKing Vulture\nDon’t judge this bird by its colorful appearance. Although it looks bright and cheerful, the king vulture has a pretty disgusting job: it eats dead animals. By eating these bodies, the king vulture cleans up the forest floor in Central and South America, where it lives. This helps prevent the spread of disease. The vulture’s brightly colored head is bald, and this lack of feathers helps it stay clean while it eats. Plus, it has a very strong beak and claws, which are also useful at mealtimes.\n\n\nGuess What!\nThe duck-billed platypus might look very cute, but be careful! The male platypus is poisonous, and its sting can be deadly.", "speaking": "Which of the three creatures do you think is the most unusual? Why?", "speakStarters": ["I think the … is the most unusual.", "This is because …", "I was surprised that …"], "prompt": "Choose two creatures from the passage. Compare what makes each of them unusual. Write 6–8 sentences.", "starters": ["The … and the … are both unusual animals.", "The … is unusual because …", "On the other hand, the …", "Both animals …", "I think …"], "cards": [{"word": "unusual", "form": "unusual", "pos": "", "en": "not normal or usual", "ko": "특이한, 흔치 않은"}, {"word": "nurse", "form": "nurse", "pos": "", "en": "to feed a baby or young animal with milk from the mother’s body", "ko": "젖을 먹이다, 돌보다"}, {"word": "scale", "form": "scales", "pos": "", "en": "one of many small, thin pieces that cover the bodies of fish or snakes", "ko": "비늘"}, {"word": "reptile", "form": "reptiles", "pos": "", "en": "an animal that lays eggs and has cold blood", "ko": "파충류"}, {"word": "defend", "form": "defends", "pos": "", "en": "to fight to keep someone or something safe", "ko": "방어하다"}, {"word": "predator", "form": "predators", "pos": "", "en": "an animal that hunts, kills, and eats other animals", "ko": "포식자"}, {"word": "appearance", "form": "appearance", "pos": "", "en": "the way that someone or something looks", "ko": "겉모습, 외모"}, {"word": "disgusting", "form": "disgusting", "pos": "", "en": "extremely unpleasant", "ko": "혐오스러운"}, {"word": "disease", "form": "disease", "pos": "", "en": "an illness of people, animals, or plants", "ko": "질병, 병"}, {"word": "lack", "form": "lack", "pos": "", "en": "the state or condition of not having any or enough of something", "ko": "부족, 결여"}, {"word": "species", "form": "species", "pos": "", "en": "a group of living things that are similar", "ko": "종"}, {"word": "webbed", "form": "webbed", "pos": "", "en": "having pieces of skin that connect all the toes on a foot", "ko": "물갈퀴가 달린"}, {"word": "mammal", "form": "mammal", "pos": "", "en": "any animal that feeds milk to its young", "ko": " o much of something", "the smell of something"], 1, "lack = 부족."], ["species", "There are thousands of species of ants.", ["a scientist who studies animals", "a single animal", "a place where animals live", "a group of living things that are similar"], 3, "species = 종."], ["webbed", "Ducks have webbed feet for swimming.", ["having no toes at all", "covered with feathers", "having long, sharp claws", "having pieces of skin that connect all the toes on a foot"], 3, "webbed = 물갈퀴가 달린."], ["mammal", "Whales are mammals, not fish.", ["any animal that feeds milk to its young", "animals with feathers", "animals with six legs", "animals that lay eggs in water"], 0, "mammal = 포유동물."], ["beak", "The bird held a worm in its beak.", ["the hard, pointed part of a bird’s mouth", "the long tail of a bird", "the wing of a bird", "the nest of a bird"], 0, "beak = 부리."]], "comp": [{"type": "주제", "q": "What is the passage mainly about?", "options": ["three creatures with unusual features", "how animals defend themselves", "why birds eat dead animals", "animals that live in Australia"], "answer": 0, "ex": "특이한 특징을 가진 동물 세 가지를 소개해요."}, {"type": "세부 내용", "q": "What is unusual about the platypus as a mammal?", "options": ["It swims well.", "It nurses its babies.", "It has fur.", "It lays eggs."], "answer": 3, "ex": "what's unusual about this mammal is that it lays eggs!"}, {"type": "세부 내용", "q": "What does the short-horned lizard do if blowing up its body doesn't work?", "options": ["It changes color.", "It runs into the water.", "It shoots blood from its eyes.", "It plays dead."], "answer": 2, "ex": "it shoots blood from its eyes to trick predators."}, {"type": "어휘", "q": "In the King Vulture section, the word \"disgusting\" is closest in meaning to ______.", "options": ["exciting", "very unpleasant", "difficult", "important"], "answer": 1, "ex": "disgusting = 몹시 불쾌한."}, {"type": "추론", "q": "Why is the king vulture's bald head useful?", "options": ["It keeps the bird warm.", "It helps the bird stay clean while it eats.", "It scares away predators.", "It helps the bird fly faster."], "answer": 1, "ex": "깃털이 없어서 먹이를 먹을 때 깨끗하게 지낼 수 있어요."}]}, "9": {"passage": "January 2\nI’m so excited to be in Iceland this weekend. This morning, we got on a bus to the southern coast to see some of Iceland’s natural beauty. We’re going to try to see the Northern Lights tomorrow night. Even if we don’t see them, we’ve already seen some of the most amazing sights on the journey.\n\nWe stopped in a national park today and explored an ice cave. They call it the “Crystal Cave” because the ice is as clear as crystal. Exploring ice caves can be dangerous, so we went with a guide. We had to wear special boots—the least comfortable boots I’ve ever worn—but it was worth it.\n\nJanuary 3\nToday we explored the Jökulsárlón Glacier Lagoon. It’s a large lake made from melted glaciers, and the coldest lake I’ve ever visited! I did NOT want to go swimming. We also saw waterfalls and a black sand beach. It was nothing like the beaches near us. The guide said it was called “Diamond Beach” because the black sand shines like diamonds.\n\nAt night, we went out to look for the Northern Lights. They occur when the Sun meets certain gases in Earth’s atmosphere. It’s hard to know when they’ll appear. But we got lucky and saw them the first night. They were green and purple. It was incredible—a light show put on by nature. I’ve never seen anything more amazing in my life!\n\nSadly, we’re leaving tomorrow. It went too fast, but I’ll remember this weekend better than any other. It was amazing!", "speaking": "Would you like to see the Northern Lights someday? Where else would you like to see natural beauty?", "speakStarters": ["I would like to see the Northern Lights because …", "I would also like to visit …", "There, I could …"], "prompt": "Write a diary entry about an amazing day you had (real or imagined). Describe what you saw and how you felt. Use at least one comparison like \"the coldest …\" or \"better than …\". Write 6–8 sentences.", "starters": ["Today, I …", "First, we …", "It was the … I've ever …", "After that, …", "I'll remember this day because …"], "cards": [{"word": "coast", "form": "coast", "pos": "", "en": "the land next to or close to the sea", "ko": "해안"}, {"word": "clear", "form": "clear", "pos": "", "en": "easily seen through", "ko": "투명한, 맑은"}, {"word": "comfortable", "form": "comfortable", "pos": "", "en": "making you feel physically relaxed", "ko": "편한, 편안한"}, {"word": "worth", "form": "worth", "pos": "", "en": "good, valuable, or important enough for something", "ko": "~의 가치가 있는"}, {"word": "lagoon", "form": "Lagoon", "pos": "", "en": "an area of sea water separated from the ocean by rocks or sand", "ko": "석호"}, {"word": "melt", "form": "melted", "pos": "", "en": "to cause something to change from a solid to a liquid", "ko": "녹다, 녹이다"}, {"word": "glacier", "form": "Glacier", "pos": "", "en": "a very large area of ice that moves slowly", "ko": "빙하"}, {"word": "atmosphere", "form": "atmosphere", "pos": "", "en": "the whole mass of air around the Earth", "ko": "대기"}, {"word": "appear", "form": "appear", "pos": "", "en": "to begin to be seen", "ko": "나타나다, 발생하다"}, {"word": "incredible", "form": "incredible", "pos": "", "en": "extremely good, great, or large", "ko": "굉장한, 놀라운"}, {"word": "sight", "form": "sights", "pos": "", "en": "a famous or interesting place in an area", "ko": "명소, 관광지"}, {"word": "guide", "form": "guide", "pos": "", "en": "someone who shows other people the way to a place", "ko": "안내인, 가이드"}, {"word": "waterfall", "form": "waterfalls", "pos": "", "en": "a stream of water that falls from a high place", "ko": "폭포"}, {"word": "shine", "form": "shines", "pos": "", "en": "to produce bright light", "ko": "빛나다, 반짝이다"}], "vocab": [["coast", "We drove along the coast and saw the ocean.", ["the center of a city", "the top of a mountain", "the land next to or close to the sea", "the middle of a desert"], 2, "coast = 해안."], ["c  had called the area the “Bermuda Triangle.” The name stuck, and so did the mystery.\n\nIn 1945, five US Navy planes, called “Flight 19,” took off from Florida and never came back. After they disappeared into the Bermuda Triangle, theories had begun to spread that the area was a danger zone. Even before this famous flight, several ships had disappeared in these waters. People had many different ideas about why this happened. Some people even believed that a giant octopus was responsible!\n\nHowever, scientists believe that weather is part of the problem. Unusually shaped clouds above the area create strong winds that go down into the water, creating huge tsunami waves that can take down boats or low-flying planes. And many researchers believe that there’s no mystery at all. Shipwrecks and plane crashes happen all over the world. It just seems to happen more in the Bermuda Triangle because there’s more traffic.\n\nThe Bermuda Triangle is also one of the deepest areas of the Atlantic, with some areas being 8 km deep. So, remains are hard to find, which makes the disappearances seem even more mysterious. In 2011, the Flight 19 planes were found, proving that they didn’t completely disappear. But no matter how much evidence there is that the Bermuda Triangle is no more dangerous than any other part of the ocean, many still believe that you should avoid the area.", "speaking": "Do you think the Bermuda Triangle is really dangerous? Why or why not?", "speakStarters": ["I think the Bermuda Triangle is / isn't dangerous because …", "Some people believe …", "However, …"], "prompt": "Explain the different ideas about why ships and planes disappear in the Bermuda Triangle. Then give your own opinion. Write 6–8 sentences.", "starters": ["The Bermuda Triangle is an area …", "Some people believe …", "However, scientists think …", "Other researchers say …", "In my opinion, …"], "cards": [{"word": "disappear", "form": "disappear", "pos": "", "en": "to become lost; to stop existing" hart (no relation) made a record-breaking flight. She became the youngest woman to fly 39,000 km around the world in a single-engine plane.", "speaking": "What do you think happened to Amelia Earhart? Explain your reason.", "speakStarters": ["I think Amelia …", "The reason is …", "However, it's also possible that …"], "prompt": "Write a short biography of Amelia Earhart. Include how she started flying, what she achieved, and what happened on her last flight. Write 6–8 sentences.", "starters": ["Amelia Earhart was a famous pilot who …", "When she was about 20, …", "In 1932, she …", "In 1937, she tried to …", "Today, she is remembered as …"], "cards": [{"word": "land", "form": "land", "pos": "", "en": "to control a plane and bring it down to the ground", "ko": "착륙하다"}, {"word": "rusty", "form": "rusty", "pos": "", "en": "covered with rust", "ko": "녹슨, 녹투성이의"}, {"word": "passenger", "form": "passenger", "pos": "", "en": "someone who is traveling from one place to another in a vehicle", "ko": "승객"}, {"word": "record", "form": "record", "pos": "", "en": "a performance or achievement that is the best of its kind", "ko": "기록"}, {"word": "navigator", "form": "navigator", "pos": "", "en": "someone who sets the course of a ship, airplane, etc.", "ko": "조종사, 항해사"}, {"word": "continue", "form": "continued", "pos": "", "en": "to do something without stopping", "ko": "계속하다"}, {"word": "head for", "form": "headed for", "pos": "phr.", "en": "to go towards", "ko": "~으로 향하다"}, {"word": "search", "form": "searched", "pos": "", "en": "to carefully look for someone or something", "ko": "찾아보다, 수색하다"}, {"word": "fuel", "form": "fuel", "pos": "", "en": "a material that is burned to produce heat or power", "ko": "연료"}, {"word": "legend", "form": "legend", "pos": "", "en": "a very famous and admirable person in a particular field", "ko": "전설, 전설적인 인물"}, {"word": "due", "form": "due", "pos": "", "en": "expected to happen", "ko": "~하기로 되어 있는, 예정된"}, {"word": "wire", "form": "wire", "pos": "",  You?", "2": "A Student's Sensible Solution", "3": "What Does Your Future Look Like?", "4": "Charles Darwin", "5": "Simone Biles", "6": "The Amazing Kids Competition", "7": "How to Control Your Stress", "8": "Exercise for Your Body and Mind", "9": "Ask Aisha", "10": "Colorful Street Art", "11": "Recycled Rhythms", "12": "Designing People"}, "fields": {}, "units": {"1": {"passage": "Each spring, school career counselors meet with students to talk about their goals for the future.\n\nThey talk about students’ interests, qualifications, and what the students will do after finishing school. Next, the career counselor gives students a quiz to learn more about them and their preferences. Here’s an example of the type of quiz a career counselor might give.\n\n[Quiz] What type of career is best for you?\n1 Are you going to want to spend time with people at work?\na. Yes, all the time\nb. Yes, some of the time\nc. No, I like working alone\n2 How important is it to be well paid?\na. Very important\nb. Somewhat important\nc. The least important part of the job\n3 How experienced are you with technology?\na. Very experienced\nb. Not very experienced, but willing to learn\nc. I don’t like working with technology\n4 Are you a leader?\na. Yes\nb. Sometimes, but I also like to learn from others\nc. No\n5 How creative are you?\na. Somewhat creative\nb. Very creative\nc. It depends on my interest \nIf you got mostly a’s, you are ambitious and want to make money. But you want to help others, too. You’re going to spend a lot of time working, too. You might be a doctor, for example. \nIf you got mostly b’s, you will have a career doing something creative. You’re going to be a teacher or a writer, for example.\nIf you got mostly c’s, you will work with your hands in some way. For example, think about becoming a mechanic or a gardener.", "speaking": "Based on the quiz, which type of career do you think suits you best? Explain with examples of your interests.", "speakStarters": ["I think a … career suits me because …", "For example, I enjoy …", "In the future, I might …"], "prompt": "Take the career quiz in the passage. Write about your result and explain whether you agree with it. Give reasons and examples. Write 7–9 sentences.", "starters": ["When I took the quiz, I got mostly …", "This means that …", "I agree / partly agree because …", "For example, …", "However, …", "In the future, I hope to …"], "cards": [{"word": "career", "form": "career", "pos": "", "en": "a job that someone does for a long time", "ko": "직업"}, {"word": "goal", "form": "goals", "pos": "", "en": "something that you are trying to do", "ko": "목표"}, {"word": "interest", "form": "interests", "pos": "", "en": "something that someone enjoys learning about or doing", "ko": "관심사"}, {"word": "qualification", "form": "qualifications", "pos": "", "en": "a skill or experience that someone needs for a particular job or activity", "ko": "자격, 자질"}, {"word": "preference", "form": "preferences", "pos": "", "en": "someone or something that is liked better", "ko": "선호, 기호"}, {"word": "experienced", "form": "experienced", "pos": "", "en": "knowing a lot about something from doing it", "ko": "숙련된, 경력이 있는"}, {"word": "leader", "form": "leader", "pos": "", "en": "someone who guides other people", "ko": "지도자"}, {"word": "creative", "form": "creative", "pos": "", "en": "able to make new things or think of new ideas", "ko": "창의적인"}, {"word": "ambitious", "form": "ambitious", "pos": "", "en": "having a strong wish to be successful, powerful, rich, etc.", "ko": "야심 있는"}, {"word": "mechanic", "form": "mechanic", "pos": "", "en": "someone who repairs machines", "ko": "기계공, 정비사"}, {"word": "well paid", "form": "well paid", "pos": "phr.", "en": "receiving a lot of money for work", "ko": "보수를 많이 받는"}, {"word": "somewhat", "form": "Somewhat", "pos": "", "en": "more than a little but not very", "ko": "약간, 다소"}, {"word": "willing", "form": "willing", "pos": "", "en": "wanting to do something", "ko": "기꺼이 하는, 자발적인"}, {"word": "gardener", "form": "gardener", "pos": "", "en": "someone whose job is to work in gardens", "ko": "정원사, 원예사"}], "vocab": [["career", "She wants a career in science.", ["a test you take at school", "a hobby you do on weekends", "a job that someone does for a long time", "a short trip with friends"], 2, "career = (평생의) 직업, 경력."], ["goal", "My goal this year is to read 30 books.", ["something you are afraid of", "something you already finished", "something that you are trying to do", "something you forgot to do"], 2, "goal = 목표."], ["interest", "Music is one of my biggest interests.", ["something that someone enjoys learning about or doing", "something that makes you bored", "something that costs a lot of money", "something you have to do every day"], 0, "interest = 관심사."], ["qualification", "A teaching license is an important qualification for teachers.", ["a skill or experience that someone needs for a particular job or activity", "a holiday from work", "a reason to leave a job", "a mistake made at work"], 0, "qualification = 자격, 자질."], ["preference", "Do you have a preference between the beach and the mountains?", ["something that you dislike the most", "someone or something that is liked better", "a plan for the future", "a rule that you must follow"], 1, "preference = 선호."], ["experienced", "We need an experienced driver for this long trip.", ["tired of doing the same thing", "new to a job and not skilled", "afraid of trying something", "knowing a lot about something from doing it"], 3, "experienced = 숙련된, 경험이 많은."], ["leader", "He was the leader of the school band.", ["someone who watches a game", "someone who follows others", "someone who works alone", "someone who guides other people"], 3, "leader = 지도자, 리더."], ["creative", "The creative student made a robot out of boxes.", ["always copying other people", "only good at sports", "unable to think of anything new", "able to make new things or think of new ideas"], 3, "creative = 창의적인."], ["ambitious", "The ambitious young chef wants to open ten restaurants.", ["happy with very little", "lazy and slow", "having a strong wish to be successful, powerful, rich, etc.", "shy and quiet"], 2, "ambitious = 야심 있는."], ["mechanic", "The mechanic fixed our car's engine.", ["someone who cooks food", "someone who designs clothes", "someone who teaches music", "someone who repairs machines"], 3, "mechanic = 정비사."], ["well paid", "Doctors are usually well paid.", ["receiving a lot of money for work", "working far from home", "working only on weekends", "working without any money"], 0, "well paid = 보수를 많이 받는."], ["somewhat", "The test was somewhat difficult, but I passed.", ["extremely or completely", "always and forever", "not at all", "more than a little but not very"], 3, "somewhat = 약간, 다소."], ["willing", "He is willing to help with the cleaning.", ["refusing to do something", "unable to do something", "forgetting to do something", "wanting to do something"], 3, "willing = 기꺼이 하는."], ["gardener", "The gardener planted roses along the fence.", ["someone whose job is to work in gardens", "someone who flies planes", "someone who fixes computers", "someone who sells cars"], 0, "gardener = 정원사."]], "comp": [{"type": "요지", "q": "What is the main purpose of the passage?", "options": ["to show how career counselors help students find a suitable career", "to explain how to become a doctor", "to tell students which job pays the most", "to give a test about technology"], "answer": 0, "ex": "진로 상담 교사가 학생에게 맞는 직업을 찾도록 돕는 방식과 퀴즈를 소개해요."}, {"type": "세부 내용", "q": "What do career counselors talk about with students first?", "options": ["their favorite movies", "their interests, qualifications, and plans after school", "their test scores and grades", "their parents' jobs"], "answer": 1, "ex": "They talk about students' interests, qualifications, and what the students will do after finishing school."}, {"type": "세부 내용", "q": "According to the quiz, what kind of person gets mostly a's?", "options": ["someone who works with their hands", "someone who is ambitious and wants to make money but also help others", "someone who likes working alone", "someone who is very creative"], "answer": 1, "ex": "If you got mostly a's, you are ambitious and want to make money. But you want to help others, too."}, {"type": "추론", "q": "A student likes working alone and doesn't care much about money. Which career might the quiz suggest?", "options": ["writer", "gardener", "teacher", "doctor"], "answer": 1, "ex": "혼자 일하기를 좋아하고(c) 보수가 가장 덜 중요하다면(c) 대부분 c → 손으로 하는 일(정비사, 정원사)."}, {"type": "어휘", "q": "In question 2 of the quiz, the word \"somewhat\" is closest in meaning to ______.", "options": ["extremely", "never", "not at all", "a little"], "answer": 3, "ex": "somewhat = 약간, 다소."}]}, "2": {"passage": "In 2016, South Africa had a terrible drought. As a result, crops were destroyed and farm animals died. It’s difficult to prevent these losses during a drought, but there’s a solution: a special substance for the soil called a superabsorbent polymer, or SAP. The purpose of an SAP is to help soil absorb water and keep it in the ground. During a drought, SAPs can slowly let water out to keep the crops alive. However, SAPs have their own problems. Some have chemicals which are bad for the environment. Also, they’re very expensive at $2,000–$3,000 per *metric ton, which makes it tough for many farmers to buy and use them.\n\nSouth African student Kiara Nirghin understands these problems and has found a sensible solution. She discovered that orange and avocado peels work well as a natural SAP. She created a powder from these peels that absorbs water and keeps it in the ground, just like any other SAP. But her powder doesn’t add chemicals, and it costs less money because it’s made from orange peels thrown away at juice factories. Kiara’s solution can sell for $30-$60 per metric ton. And it isn’t just cheaper—it’s more effective! In 2016, 16-year-old Kiara won the top prize at the Google Science Fair for this discovery.\n\nKiara is an ambitious student. For her, the Google Science Fair prize is just the beginning. “I might look into health sciences or engineering,” she says when asked about her goals. “Something so I can improve the world.” In the future, Kiara will probably be working in agriculture sciences, doing work to help farmers. She will also be testing her orange peel SAP for other uses, including improving water quality. Kiara is determined to use science to make a difference.\n\n\nGuess What!\nStudents between the ages of 13 and 18 can enter the Google Science Fair. The top prize for winning the competition is $50,000 in scholarship money.", "speaking": "If you could use science to solve one problem in the world, what would it be? Why?", "speakStarters": ["I would like to solve the problem of …", "This problem is serious because …", "My idea would be to …"], "prompt": "Explain why Kiara's orange peel SAP is a better solution than ordinary SAPs. Compare cost, effect on the environment, and effectiveness. Write 7–9 sentences.", "starters": ["During a drought, farmers face …", "Ordinary SAPs help, but …", "Kiara's solution is better because …", "First, …", "Second, …", "In conclusion, …"], "cards": [{"word": "drought", "form": "drought", "pos": "", "en": "a long period with very little or no rain", "ko": "가뭄"}, {"word": "crop", "form": "crops", "pos": "", "en": "a plant that is grown by farmers and used as food", "ko": "작물"}, {"word": "destroy", "form": "destroyed", "pos": "", "en": "to damage something so badly that it cannot be used", "ko": "파괴하다"}, {"word": "substance", "form": "substance", "pos": "", "en": "a particular type of solid, liquid, or gas", "ko": "물질"}, {"word": "purpose", "form": "purpose", "pos": "", "en": "the reason why something is done or used", "ko": "목적"}, {"word": "tough", "form": "tough", "pos": "", "en": "very difficult to do", "ko": "힘든, 어려운"}, {"word": "sensible", "form": "sensible", "pos": "", "en": "having or showing good sense", "ko": "합리적인, 현명한"}, {"word": "effective", "form": "effective", "pos": "", "en": "producing a result that is wanted", "ko": "효과적인"}, {"word": "improve", "form": "improve", "pos": "", "en": "to make something better", "ko": "개선하다"}, {"word": "determined", "form": "determined", "pos": "", "en": "wanting to do something very much", "ko": "굳게 결심한"}, {"word": "loss", "form": "losses", "pos": "", "en": "the situation of no longer having something", "ko": "손실, 상실"}, {"word": "solution", "form": "solution", "pos": "", "en": "an answer to a problem", "ko": "해결책"}, {"word": "peel", "form": "peels", "pos": "", "en": "the skin of a fruit", "ko": "껍질"}, {"word": "agriculture", "form": "agriculture", "pos": "", "en": "farming", "ko": "농업, 농사"}], "vocab": [["drought", "The drought lasted for months, and the rivers dried up.", ["a time of strong winds", "a period with heavy snow", "a season with many floods", "a long period with very little or no rain"], 3, "drought = 가뭄."], ["crop", "Rice is the main crop in this area.", ["a plant that is grown by farmers and used as food", "a machine used on farms", "a building for storing tools", "a wild animal that lives on farms"], 0, "crop = 농작물."], ["destroy", "The fire destroyed the old house.", ["to fix something carefully", "to paint something brightly", "to build something new", "to damage something so badly that it cannot be used"], 3, "destroy = 파괴하다."], ["substance", "Water is a common substance on Earth.", ["a particular type of solid, liquid, or gas", "a story about the past", "a kind of feeling or emotion", "a way of thinking"], 0, "substance = 물질."], ["purpose", "The purpose of this meeting is to plan the festival.", ["the place where something happens", "the result of a mistake", "the reason why something is done or used", "the time when something ends"], 2, "purpose = 목적."], ["tough", "It was a tough decision, but I chose to move.", ["very easy to do", "very funny to watch", "very cheap to buy", "very difficult to do"], 3, "tough = 힘든, 어려운."], ["sensible", "Wearing a helmet is a sensible thing to do.", ["having or showing good sense", "difficult to understand", "silly and careless", "very expensive"], 0, "sensible = 합리적인, 현명한."], ["effective", "This medicine is very effective for headaches.", ["producing no result at all", "making things worse", "producing a result that is wanted", "taking a very long time"], 2, "effective = 효과적인."], ["improve", "Practice will improve your writing.", ["to make something worse", "to keep something the same", "to stop something completely", "to make something better"], 3, "improve = 개선하다."], ["determined", "She was determined to finish the race.", ["too tired to try", "ready to give up easily", "not sure what to do", "wanting to do something very much"], 3, "determined = 굳게 결심한."], ["loss", "The loss of his wallet made him upset.", ["the situation of no longer having something", "a large amount of money earned", "a gift from a friend", "the act of finding something"], 0, "loss = 손실, 상실."], ["solution", "We need a solution to the traffic problem.", ["a story about a problem", "an answer to a problem", "a reason for a problem", "a question about a problem"], 1, "solution = 해결책."], ["peel", "Don't throw away the banana peel on the street.", ["the skin of a fruit", "the tree a fruit grows on", "the juice of a fruit", "the seed inside a fruit"], 0, "peel = (과일) 껍질."], ["agriculture", "Agriculture is important in rural areas.", ["the study of stars", "farming", "the art of painting", "the business of selling cars"], 1, "agriculture = 농업."]], "comp": [{"type": "요지", "q": "What is the main idea of the passage?", "options": ["Orange juice is good for farmers.", "Droughts cannot be stopped.", "A student found a cheap, natural way to help soil keep water during droughts.", "The Google Science Fair is difficult to enter."], "answer": 2, "ex": "학생 Kiara가 저렴하고 친환경적인 SAP를 만든 이야기예요."}, {"type": "세부 내용", "q": "What is the purpose of an SAP?", "options": ["to kill harmful insects", "to add chemicals to the soil", "to make crops grow faster", "to help soil absorb water and keep it in the ground"], "answer": 3, "ex": "The purpose of an SAP is to help soil absorb water and keep it in the ground."}, {"type": "세부 내용", "q": "Why is Kiara's SAP cheaper?", "options": ["The government pays for it.", "It uses less water.", "It is made in small amounts.", "It is made from orange peels thrown away at juice factories."], "answer": 3, "ex": "it's made from orange peels thrown away at juice factories."}, {"type": "어휘", "q": "In paragraph 1, the word \"tough\" is closest in meaning to ______.", "options": ["exciting", "difficult", "strong", "cheap"], "answer": 1, "ex": "tough = 힘든, 어려운."}, {"type": "추론", "q": "What can we infer about Kiara from the last paragraph?", "options": ["She only cares about winning prizes.", "She wants to stop studying science.", "She plans to open a juice factory.", "She wants to keep using science to help the world."], "answer": 3, "ex": "\"Something so I can improve the world.\" 과학으로 세상을 바꾸려는 의지가 있어요."}]}, "3": {"passage": "Laura, 15\nI’m about to apply to university for courses in computer science. After university, I’m not going to get a job. I’m going to start my own company and be my own boss! There are so many young people running online companies. I think anyone with an original idea can succeed. By the age of 25, I probably won’t have become a millionaire, but maybe I’ll have enough money to buy my own home.\n\nTomás, 17\nI play the guitar in a band called Nobody’s Heroes. We’ve played a few times at local music festivals, and people say we’ve got talent. By the time I’m 25, I hope we will have become famous. Maybe we will have even been on a world tour! My parents are worried that I’m wasting my time, and they complain about the noise I make when I’m practicing. They hope that I’ll give up music and try to get some qualifications for a career in business or medicine.\n\nChiyo, 16\nI’m not interested in being rich or famous, but I really love traveling and photography! First, I want to study for a degree in languages. I’m determined to travel around the world taking amazing photos of people and places. By the time I’m 25, I hope I will have visited lots of interesting places and had some amazing experiences. Who knows? Maybe I will have sold my photos to magazines! Maybe I will have moved to another country!", "speaking": "Where do you hope to be by the time you are 25? Explain your plans.", "speakStarters": ["By the time I'm 25, I hope I will have …", "To get there, I'm going to …", "The hardest part might be …"], "prompt": "Which of the three students' plans do you think is the most realistic? Explain your opinion with reasons, and compare it with another student's plan. Write 7–9 sentences.", "starters": ["In my opinion, …'s plan is the most realistic.", "First, …", "In addition, …", "On the other hand, …'s plan …", "Therefore, …"], "cards": [{"word": "apply", "form": "apply", "pos": "", "en": "to ask formally for something such as a job, a place at a university, etc.", "ko": "지원하다"}, {"word": "succeed", "form": "succeed", "pos": "", "en": "to do what you tried or wanted to do", "ko": "성공하다"}, {"word": "millionaire", "form": "millionaire", "pos": "", "en": "someone who is very rich and has at least a million dollars", "ko": "백만장자, 부호"}, {"word": "local", "form": "local", "pos": "", "en": "located or living nearby", "ko": "지역의, 현지의"}, {"word": "talent", "form": "talent", "pos": "", "en": "a natural ability to do something well", "ko": "재능, 재주"}, {"word": "waste", "form": "wasting", "pos": "", "en": "to use more of something than is necessary", "ko": "낭비하다"}, {"word": "complain", "form": "complain", "pos": "", "en": "to say or write that you do not like something", "ko": "불평하다, 투덜거리다"}, {"word": "give up", "form": "give up", "pos": "phr.", "en": "to stop trying to do something", "ko": "포기하다"}, {"word": "medicine", "form": "medicine", "pos": "", "en": "the stu ed Emma Wedgwood, with whom he had 10 children. To him, family life was always more important than his research. In spite of having many health problems throughout his life, Darwin lived to be 73.\n\nDarwin is best known for his theory of natural selection, which says that animals adapt over time in order for their species to survive. His most famous book, On the Origin of Species, came out in 1859. Many people objected to the ideas in this book at the time. But most people can agree that Darwin has helped us better understand many species of plants and animals in our world.", "speaking": "Darwin found his true interest while studying something else. Have you ever discovered an interest by chance? Explain.", "speakStarters": ["I discovered my interest in … when …", "At first, I …", "Now, I …"], "prompt": "Write about the turning points in Charles Darwin's life. Explain how each event led him to become a great scientist. Write 7–9 sentences.", "starters": ["Charles Darwin is known as …", "As a child, he …", "At first, he studied …, but …", "The most important turning point was …", "Because of this, …", "Today, …"], "cards": [{"word": "biology", "form": "biology", "pos": "", "en": "a science that studies living things", "ko": "생물학"}, {"word": "observe", "form": "observing", "pos": "", "en": "to watch someone or something carefully", "ko": "관찰하다"}, {"word": "ordinary", "form": "ordinary", "pos": "", "en": "not different or special", "ko": "평범한"}, {"word": "athlete", "form": "athlete", "pos": "", "en": "someone who is good at sports", "ko": "운동을 잘 하는 사람,"}, {"word": "experiment", "form": "experiments", "pos": "", "en": "a scientific test to learn about something", "ko": "실험"}, {"word": "religion", "form": "religion", "pos": "", "en": "the belief in a god or gods", "ko": "종교"}, {"word": "expedition", "form": "expedition", "pos": "", "en": "a journey for a particular purpose", "ko": "탐험, 원정"}, {"word": "object to", "form": "objected to", "pos": "phr.", "en": "to disagree dals that year: two gold, a silver, and a bronze. She won the title again in 2014 and 2015, making her a three-time world champion gymnast. Simone then headed for the 2016 Summer Olympics in Rio de Janeiro, Brazil. There, she won five medals, four of them gold. In total, by the end of 2016, Simone had earned an amazing 19 medals, 14 of them gold.\n\nToday, Simone is more than a gymnast. She has appeared on popular TV programs. She’s even written a book about her achievements. Simone has also collected clothes, school supplies, and toys for children who must move from their parents’ home because their parents cannot care for them. Simone knows how difficult this can be, but she also doesn’t want it to stop children from achieving their goals. To these children she says, “It doesn’t matter where you come from. It matters where you’re going.”\n\n\nGuess What!\nSimone has her own emoji app, Simoji, where anyone can download gymnastics emojis.", "speaking": "Simone says, \"It doesn't matter where you come from. It matters where you're going.\" What do you think this means?", "speakStarters": ["I think this means …", "For example, …", "This is important because …"], "prompt": "Why do people admire Simone Biles? Explain her achievements and her character, using examples from the passage. Write 7–9 sentences.", "starters": ["People admire Simone Biles because …", "Although her early life …", "Thanks to her hard work, …", "In addition, she …", "What I admire most is …"], "cards": [{"word": "admire", "form": "admire", "pos": "", "en": "to respect someone or their behavior", "ko": "존경하다, 칭찬하다"}, {"word": "extraordinary", "form": "extraordinary", "pos": "", "en": "extremely good; greater than usual", "ko": "비범한, 대단한 "}, {"word": "gymnast", "form": "gymnast", "pos": "", "en": "someone who performs physical exercises on a mat or on special equipment", "ko": "체조 선수"}, {"word": "manage", "form": "managed", "pos": "", "en": "to succeed in doing something difficult", "ko": "간신히 해내다"} ily. Just upload a photo of this person doing something amazing, describe this person, and add the hashtag #amazingkidscompetition. Kids must be between the ages of 8 and 18 to take part. We can’t wait to see what amazing things are happening out there!\n\nsofialoletti \nMy cousin Gina, who is 14 years old, got first prize in the “Young Cook of the Year” competition. Hundreds of teenage chefs across Italy took part in the competition, and Gina won! She learned to cook by observing her father, who’s also a great chef. Now, Gina is writing her own recipe book for kids. Gina wants her book to be fun to read but easy enough for children to use. She wants to encourage other children to cook because, as she says, “Everyone needs to eat, so it’s a skill that will always be useful!” Gina’s food is really amazing, which makes her an amazing kid!\n#amazingkidscompetition\nView 12 comments\n\ncoolrunner871 \nMy brother, Brendan, has always loved running. In fact, we used to run together a lot. But three years ago, he was involved in a serious car accident. He lost part of one leg and didn’t even expect to walk again. He wanted to give up, but he didn’t. Now, at only 17 years old, he’s an athlete who has recently completed a half-marathon. He says, “I’m happy to be alive and able to continue running.” His attitude and strength make him an amazing kid!\n#amazingkidscompetition\nView 9 comments", "speaking": "Who would you nominate for the Amazing Kids Competition? Explain why they are amazing.", "speakStarters": ["I would nominate … because …", "For example, …", "This makes him/her amazing because …"], "prompt": "Write a post nominating someone you know for the Amazing Kids Competition. Describe what they did and why it is amazing. Write 7–9 sentences.", "starters": ["My … is an amazing kid.", "He/She …", "What makes him/her special is …", "For example, …", "He/She says, \"…\"", "That's why …"], "cards": [{"word": "treat", "form": "treat", "pos": "", "en": "to behave toward someone or something in a particular way", "ko": "대하다"}, {"word": "nominate", "form": "nominate", "pos": "", "en": "to officially suggest someone for a prize", "ko": "추천하다, 지명하다"}, {"word": "upload", "form": "upload", "pos": "", "en": "to move information to a larger computer or computer network", "ko": "업로드하다"}, {"word": "describe", "form": "describe", "pos": "", "en": "to say or write what someone or something is like", "ko": "묘사하다"}, {"word": "hashtag", "form": "hashtag", "pos": "", "en": "a word or phrase that starts with the symbol #", "ko": "해시태그"}, {"word": "take part", "form": "take part", "pos": "phr.", "en": "to participate in something", "ko": "~에 참가하다"}, {"word": "recipe", "form": "recipe", "pos": "", "en": "a set of instructions for making food", "ko": "조리법, 요리법"}, {"word": "encourage", "form": "encourage", "pos": "", "en": "to make someone more likely to do something", "ko": "권장하다, 격려하다"}, {"word": "complete", "form": "completed", "pos": "", "en": "to finish doing something", "ko": "끝마치다, 완료하다"}, {"word": "attitude", "form": "attitude", "pos": "", "en": "a way of feeling or thinking about someone or something", "ko": "태도, 사고방식"}, {"word": "organization", "form": "Organization", "pos": "", "en": "a company, business, club, etc., that is formed for a particular purpose", "ko": "단체, 기구"}, {"word": "talented", "form": "talented", "pos": "", "en": "having a natural ability to do something well", "ko": "(타고난) 재능이 있는"}, {"word": "involved", "form": "involved", "pos": "", "en": "being a part of something", "ko": "관련된, 연루된"}, {"word": "alive", "form": "alive", "pos": "", "en": "living; not dead", "ko": "살아 있는"}], "vocab": [["treat", "You should treat others the way you want to be treated.", ["to forget someone", "to follow someone", "to call someone", "to behave toward someone or something in a particular way"], 3, "treat = 대하다."], ["nominate", "The class nominated Mina for student president.", ["to forget someone's name", "to stop someone from joining", "to make f ere are many things that cause stress in our lives. Stress can cause us physical and emotional harm. Physically, stress can make our bodies tense, possibly causing stomachaches, headaches, and sore muscles. Emotionally, stress can cause anger or sadness and can make us feel less energetic.\n\nWhen we’re stressed, our bodies and minds don’t work the way they’re supposed to. It’s very important to know how to control our stress. One method to do so is by using our five senses. If you follow the following suggestions, you could be feeling better in no time.\n\nTaste\nYou can use your sense of taste, like having a cup of warm tea to relax. Have a small piece of chocolate or your favorite healthy snack, like a piece of fruit or some nuts.\n\nTouch\nYou can put on soft, comfortable clothes or take a warm bath to de-stress. Pet a dog, cat, or any other furry animal. Use a stuffed toy if you don’t have a pet.\n\nSight\nPut a vase of flowers on your desk, or look at your favorite pictures. Try spending some time in a room painted in a relaxing color, like blue or green.\n\nSmell\nYou can go outside and get some sunlight and fresh air. Light a scented candle, or visit a nearby garden and smell the flowers.\n\nSound\nFinally, your sense of hearing can reduce stress as well. Listen to music that makes you feel good. Hum or sing along with your favorite songs. Sit near a stream or a fountain and listen to the sound of the water moving.", "speaking": "What usually causes you stress, and what do you do to feel better?", "speakStarters": ["I usually feel stressed when …", "To feel better, I …", "I'd like to try … from the passage because …"], "prompt": "Explain how stress affects us and suggest a plan to control stress using at least three of the five senses. Write 7–9 sentences.", "starters": ["Stress can harm us both physically and emotionally.", "For example, …", "One way to control stress is …", "Another way is …", "Finally, …", "If we try these methods, …"], "cards": [{"word": "physical", "form": "physical", "pos": "", "en": "relating to the body", "ko": "신체의"}, {"word": "emotional", "form": "emotional", "pos": "", "en": "relating to feelings", "ko": "정서의, 감정의"}, {"word": "tense", "form": "tense", "pos": "", "en": "not relaxed but hard and tight", "ko": "긴장한"}, {"word": "sore", "form": "sore", "pos": "", "en": "painful and uncomfortable", "ko": "아픈"}, {"word": "muscle", "form": "muscles", "pos": "", "en": "a body tissue that moves parts of the body", "ko": "근육"}, {"word": "energetic", "form": "energetic", "pos": "", "en": "having a lot of energy; active", "ko": "활동적인"}, {"word": "method", "form": "method", "pos": "", "en": "a way of doing something", "ko": "방법"}, {"word": "suggestion", "form": "suggestions", "pos": "", "en": "an idea or plan for someone to think about", "ko": "제안"}, {"word": "de-stress", "form": "de-stress", "pos": "", "en": "to relax your body or mind", "ko": "스트레스를 풀다"}, {"word": "scented", "form": "scented", "pos": "", "en": "having a pleasing smell", "ko": "향기로운"}, {"word": "sense", "form": "senses", "pos": "", "en": "one of the five abilities to see, hear, smell, taste, and feel", "ko": "감각"}, {"word": "pet", "form": "Pet", "pos": "", "en": "to touch gently and kindly with your hands", "ko": "쓰다듬다"}, {"word": "hum", "form": "Hum", "pos": "", "en": "to make the sound of a song with your lips closed", "ko": "흥얼거리다,  콧노래를 부르다"}, {"word": "stream", "form": "stream", "pos": "", "en": "a natural flow of water that is smaller than a river", "ko": "개울, 시내"}], "vocab": [["physical", "Physical exercise keeps your body healthy.", ["relating to the body", "relating to feelings", "relating to money", "relating to the weather"], 0, "physical = 신체의."], ["emotional", "The movie had a very emotional ending.", ["relating to machines", "relating to feelings", "relating to numbers", "relating to the body"], 1, "emotional = 감정의, 정서의."], ["tense", "My shoulders felt tense after the long test.", ["warm and soft", "not relaxed but hard and tight", "relaxed and loose", "light and happy"], 1, "tense = 긴장한."], ["sore", "My legs were sore after the hike.", ["very clean", "cold and wet", "strong and healthy", "painful and uncomfortable"], 3, "sore = 아픈."], ["muscle", "Lifting weights builds muscle.", ["a type of bone", "a body tissue that moves parts of the body", "a kind of hair", "a liquid in the body"], 1, "muscle = 근육."], ["energetic", "The energetic puppy ran around all day.", ["tired and slow", "sad and quiet", "sick and weak", "having a lot of energy; active"], 3, "energetic = 활동적인, 활기찬."], ["method", "This is a new method of teaching math.", ["a place for doing something", "a result of doing something", "a way of doing something", "a reason for doing something"], 2, "method = 방법."], ["suggestion", "Do you have any suggestions for the class trip?", ["a final decision", "a complaint about something", "a strict rule", "an idea or plan for someone to think about"], 3, "suggestion = 제안."], ["de-stress", "I go for a walk to de-stress after school.", ["to work harder", "to make yourself more worried", "to stay awake all night", "to relax your body or mind"], 3, "de-stress = 스트레스를 풀다."], ["scented", "She lit a scented candle that smelled like roses.", ["having a pleasing smell", "having no smell at all", "having a bad smell", "having a bright color"], 0, "scented = 향기로운."], ["sense", "Dogs have a strong sense of smell.", ["a kind of feeling of sadness", "a type of medicine", "a part of the brain", "one of the five abilities to see, hear, smell, taste, and feel"], 3, "sense = 감각."], ["pet", "The child gently petted the rabbit.", ["to touch gently and kindly with your hands", "to hit hard", "to feed with a spoon", "to call loudly"], 0, "pet = 쓰다듬다."], ["hum", "He hummed a song while cooking.", ["to whisper words", "to shout loudly", "to stay completely silent", "to make the sound of a song with your lips closed"], 3, "hum = 콧노래를 부르다."], ["stream", "We crossed a small stream in the forest.", ["a tall waterfall", "a natural flow of water that is smaller than a river", "a large ocean", "a deep lake"], 1, "stream = 개울, 시내."]], "comp": [{"type": "요지", "q": "What is the main idea of the passage?", "options": ["Stress can harm us, but we can control it by using our five senses.", "Pets help people sleep better.", "Chocolate is the best way to relax.", "Homework is the biggest cause of stress."], "answer": 0, "ex": "스트레스의 해로움과 오감을 이용한 해소법을 소개해요."}, {"type": "세부 내용", "q": "Which is a physical effect of stress mentioned in the passage?", "options": ["feeling less energetic", "feeling sad", "feeling angry", "sore muscles"], "answer": 3, "ex": "Physically, stress can … causing stomachaches, headaches, and sore muscles."}, {"type": "세부 내용", "q": "What does the passage suggest if you don't have a pet?", "options": ["Visit a garden.", "Take a warm bath.", "Buy a new pet.", "Use a stuffed toy."], "answer": 3, "ex": "Use a stuffed toy if you don't have a pet."}, {"type": "세부 내용", "q": "Which colors does the passage say are relaxing?", "options": ["blue and green", "black and white", "red and orange", "yellow and pink"], "answer": 0, "ex": "a room painted in a relaxing color, like blue or green."}, {"type": "추론", "q": "Listening to the sound of a fountain is an example of using which sense?", "options": ["smell", "touch", "sound", "sight"], "answer": 2, "ex": "물 흐르는 소리를 듣는 것은 청각(sound)이에요."}]}, "8": {"passage": "People between the ages of 6 and 17 need 60 minutes of exercise each day. Do you get that much exercise? How about changing your daily routine so that you get more? You must know that exercise is good for your body. The physical benefits include making you stronger and more energetic. But there are also many emotional benefits to exercising.\n\nExercise improves confidence. When you exercise, you’re doing something good for your body. If you’re getting fit, chances are you’ll feel good about yourself. This makes you happier and more self-confident.\n\nExercise helps stop you from feeling depressed or anxious. Doing some exercise immediately improves your mood. Going for a run or a hike before a difficult task will make you less anxious about it. But scientists are learning that exercise is great for people who feel depressed over a long period of time, too. Research shows that people who are less active are 75 percent more likely to suffer depression.\n\nExercise helps you sleep. Studies show that people who exercise fall asleep more easily and wake up less during the night than people who don’t exercise at all. For the best sleep, exercise about six hours before going to bed.\n\nExercise affects the chemicals in your body. Exercise helps your body produce more of the chemicals that make you feel happy. It also produces chemicals that improve your ability to learn and your memory.\n\nExercise affects your mind. Scientists have found that people think most creatively right after exercising. Additionally, researchers discovered that exercise actually helps your brain produce new cells. More brain cells? That can’t be a bad thing!\n\nExercising with others is best. Playing on a team or running with a friend is the best way of exercising. You feel like you belong when you’re on a team. Being part of a group makes you feel more satisfied.\n\n\nGuess What!\nAstronauts living at the International Space Station exercise for over two hours each day to keep their mood up and their bodies strong.", "speaking": "How much exercise do you get each day? How could you change your routine to get more?", "speakStarters": ["I usually exercise for about … each day.", "To get more exercise, I could …", "This would help me because …"], "prompt": "Exercise has many emotional benefits. Choose the three benefits you think are the most important and explain why. Write 7–9 sentences.", "starters": ["Many people know that exercise is good for the body, but …", "First, exercise …", "Second, …", "Third, …", "For these reasons, …"], "cards": [{"word": "routine", "form" iend that she hurt my feelings?\n– Claire in L.A.\n\nClaire,\nDon’t listen to this “friend.” There’s nothing wrong with wearing old clothes to the gym. The most important thing about going to the gym is that you’re doing something positive for your body and mind. It’s not a fashion show.\n– Aisha\n\nDear Aisha,\nRecently, I haven’t been feeling very well. I’m always exhausted. I go to bed early, but sometimes I can’t sleep because I’m so stressed. Please help!\n– Lara in Washington\n\nLara,\nFirst of all, you must stop worrying! Try to relax at bedtime by having a warm bath before bed. Think about your diet, too. Are you getting enough vitamins? Doing exercise will also make you feel more energetic. Walking for 20 minutes three times a week will help.\n– Aisha\n\nDear Aisha,\nMy parents are always telling me that I spend too much time online and that I should exercise more. The problem is, I don’t really like sports.\n– Timothy in NYC\n\nTimothy,\nIt’s not healthy to spend so many hours online. Why don’t you take a walk so that you get some extra exercise? This way your parents will see that you’re making an effort to exercise more.\n– Aisha", "speaking": "Which of Aisha's answers do you think gives the best advice? Why?", "speakStarters": ["I think Aisha's advice to … is the best.", "This is because …", "I would also add …"], "prompt": "Write a letter to Aisha asking for advice about a problem, and then write Aisha's reply. The reply should give at least two pieces of advice. Write 7–9 sentences in total.", "starters": ["Dear Aisha,", "I need your advice. Recently, …", "Should I …?", "Dear …,", "First of all, …", "You could also …"], "cards": [{"word": "advice", "form": "advice", "pos": "", "en": "an idea or opinion about what someone should do", "ko": "조언, 충고"}, {"word": "recently", "form": "recently", "pos": "", "en": "not long ago", "ko": "최근에"}, {"word": "helpful", "form": "helpful", "pos": "", "en": "providing useful help", "ko": "도움이 되는"}, {"word": "hurt", "f the gym with her."], "answer": 1, "ex": "She said that my exercise clothes looked terrible …"}, {"type": "세부 내용", "q": "What does Aisha suggest Lara do before bed?", "options": ["eat vitamins", "have a warm bath", "exercise for 20 minutes", "go online"], "answer": 1, "ex": "Try to relax at bedtime by having a warm bath before bed."}, {"type": "태도", "q": "How does Aisha feel about Claire's friend's comment?", "options": ["She thinks Claire should buy new clothes.", "She thinks it is funny.", "She thinks the friend is wrong.", "She agrees with it."], "answer": 2, "ex": "Don't listen to this \"friend.\" 친구의 말이 틀렸다고 생각해요."}, {"type": "추론", "q": "Why does Aisha suggest that Timothy take a walk?", "options": ["Walking helps him sleep.", "Walking is the best sport.", "It's an easy way to exercise even if he doesn't like sports.", "His parents like walking."], "answer": 2, "ex": "운동을 싫어해도 걷기로 쉽게 운동량을 늘릴 수 있어요."}]}, "10": {"passage": "People have been creating art since the earliest humans began painting in caves over 40,000 years ago. But for centuries, most art was limited to museums and galleries. Today, more and more art is being created by the people within a community. They aren’t usually paid, and they often aren’t even asked to create the art. Rather, individuals and community groups willingly bring their own ideas into public spaces.\n\nYarn Bombing\nIn some cities, monuments, bridges, and even forms of transportation have been “yarn bombed.” In this art form, people create colorful wool cloths. Then they put the cloths on dull objects, such as pipes and park benches. Yarn bombing adds a warm feeling to the cold, hard objects found in cities.\n\nGuerrilla Gardening\nPeople also beautify urban areas by making gardens in abandoned areas. Some “guerrilla gardeners” just plant flowers, while others think it’s best to plant crops for food. Guerrilla gardening began in the UK in 2004. It is now happening in cities around the world. Guerrilla gardeners don’t own the land they work on, but they often take care of it as though they do.\n\nGraffiti\nYarn bombers and guerrilla gardeners don’t always ask permission to create their art. As a result, some people in the community get angry. The same is true for graffiti artists. Many people don’t like it when people paint on walls without asking. But as graffiti has become more sophisticated over the years, more and more people have begun to see it as art, not just as damage. Some building owners have been inspired to invite artists to create colorful murals on and around their buildings. These designs add interest and often tell the story of the people who live in the community.\n\nStreet art, such as yarn bombing, guerrilla gardening, and graffiti, aims to make cities more colorful, enjoyable places to live.", "speaking": "Do you think street art makes a city better, or should people always ask permission first? Explain.", "speakStarters": ["I think street art …", "On the other hand, …", "In my opinion, people should …"], "prompt": "Should graffiti and other street art be allowed in cities? Give your opinion with at least two reasons and mention the other side. Write 7–9 sentences.", "starters": ["In my opinion, street art should / should not be allowed because …", "First, …", "Second, …", "Some people think …", "However, …", "In conclusion, …"], "cards": [{"word": "limit", "form": "limited", "pos": "", "en": "to exist or happen only in a particular place", "ko": "한정하다, 제한하다"}, {"word": "community", "form": "community", "pos": "", "en": "a group of people who live in the same area or have the same interests", "ko": "주민, 지역 사회"}, {"word": "individual", "form": "individuals", "pos": "", "en": "a single person", "ko": "개인"}, {"word": "dull", "form": "dull", "pos": "", "en": "not exciting or interesting", "ko": "따분한, 칙칙한"}, {"word": "beautify", "form": "beautify", "pos": "", "en": "to make something beautiful", "ko": "아름답게 꾸미다"}, {"word": "abandoned", "form": "abandoned", "pos": "", "en": "left and no longer wanted, used, or needed", "ko": "버려진"}, {"word": "permission", "form": "permission", "pos": "", "en": "the act of allowing someone to do something", "ko": "허락, 허가"}, {"word": "sophisticated", "form": "sophisticated", "pos": "", "en": "highly developed and complex", "ko": "정교한, 복잡한"}, {"word": "inspire", "form": "inspired", "pos": "", "en": "to give someone an idea for something", "ko": "영감을 주다"}, {"word": "mural", "form": "murals", "pos": "", "en": "a large picture painted on a wall", "ko": "벽화"}, {"word": "century", "form": "centuries", "pos": "", "en": "a hundred of years", "ko": "세기, 100년"}, {"word": "transportation", "form": "transportation", "pos": "", "en": "a way of traveling from one place to another place", "ko": "수송 수단, 교통 기관"}, {"word": "cloth", "form": "cloths", "pos": "", "en": "material used for making clothes, sheets, etc.", "ko": "옷감, 천"}, {"word": "own", "form": "own", "pos": "", "en": "to have something that belongs to you", "ko": "소유하다"}], "vocab": [["limit", "The event is limited to students only.", ["to exist or happen only in a particular place", "to become bigger", "to be open to everyone", "to be canceled"], 0, "limit = 제한하다."], ["community", "Our community planted trees in the park.", ["a group of people who live in the same area or have the same interests", "a type of government", "a kind of building", "a single person"], 0, "community = 지역 사회, 주민."], ["individual", "Each individual has different talents.", ["a kind of animal", "a single person", "a famous place", "a large group of people"], 1, "individual = 개인."], ["dull", "The gray walls made the room look dull.", ["bright and exciting", "very expensive", "not exciting or interesting", "full of life"], 2, "dull = 따분한, 칙칙한."], ["beautify", "Volunteers beautified the park with flowers.", ["to destroy something", "to make something ugly", "to make something beautiful", "to hide something"], 2, "beautify = 아름답게 꾸미다."], ["abandoned", "We found an abandoned house in the woods.", ["very expensive", "left and no longer wanted, used, or needed", "newly built", "full of people"], 1, "abandoned = 버려진."], ["permission", "You need permission to leave class early.", ["a kind of punishment", "a reason to complain", "the act of allowing someone to do something", "a type of homework"], 2, "permission = 허락."], ["sophisticated", "This phone has sophisticated technology.", ["very simple and basic", "old and broken", "highly developed and complex", "cheap and weak"], 2, "sophisticated = 정교한."], ["inspire", "Her story inspired me to start writing.", ["to give someone an idea for something", "to make someone bored", "to make someone angry", "to make someone stop"], 0, "inspire = 영감을 주다."], ["mural", "The children painted a mural on the school wall.", ["a large picture painted on a wall", "a small photo in a frame", "a statue in a park", "a poem in a book"], 0, "mural = 벽화."], ["century", "This castle was built in the 15th century.", ["a hundred of years", "a period of ten years", "a period of one year", "a period of a thousand years"], 0, "century = 세기, 100년."], ["transportation", "Buses are the main transportation in this town.", ["a place to live", "a way of traveling from one place to another place", "a kind of sport", "a way to cook food"], 1, "transportation = 교통수단."], ["cloth", "She covered the table with a white cloth.", ["a sheet of metal", "a block of wood", "material used for making clothes, sheets, etc.", "a piece of glass"], 2, "cloth = 천, 옷감."], ["own", "My family owns a small farm.", ["to borrow from someone", "to have something that belongs to you", "to sell to someone", "to rent from someone"], 1, "own = 소유하다."]], "comp": [{"type": "요지", "q": "What is the main idea of the passage?", "options": ["Graffiti is always illegal.", "Guerrilla gardening began in the US.", "Community members are using street art to make cities more colorful.", "Art should only be shown in museums."], "answer": 2, "ex": "지역 사회 사람들이 거리 예술로 도시를 꾸미는 이야기예요."}, {"type": "세부 내용", "q": "What do yarn bombers do?", "options": ["build new bridges", "plant flowers in empty lots", "paint pictures on walls", "put colorful wool cloths on dull objects"], "answer": 3, "ex": "people create colorful wool cloths. Then they put the cloths on dull objects …"}, {"type": "세부 내용", "q": "Where and when did guerrilla gardening begin?", "options": ["in the UK in 2004", "in Italy in 2000", "in the US in 2014", "in France 40,000 years ago"], "answer": 0, "ex": "Guerrilla gardening began in the UK in 2004."}, {"type": "어휘", "q": "In the Graffiti section, the word \"sophisticated\" is closest in meaning to ______.", "options": ["simple", "dirty", "highly developed", "angry"], "answer": 2, "ex": "sophisticated = 정교한, 세련된."}, {"type": "추론", "q": "Why do some people get angry about street art?", "options": ["It makes cities less colorful.", "It is only in museums.", "It is too expensive.", "Artists often don't ask permission."], "answer": 3, "ex": "거리 예술가들이 허락 없이 작업하는 경우가 많기 때문이에요."}]}, "11": {"passage": "Cateura, Paraguay, isn’t an ordinary community. It’s next to a landfill where more than 1.3 million kilograms of trash get dumped every day. Cateura doesn’t have much to offer its residents, and there’s very little opportunity for the children who live here.\n\nFavio Chávez wanted to change that. Chávez, who moved there to work as an engineer, wanted to bring music to the community’s children. He began giving lessons with donated instruments. So many children were interested that he quickly ran out. So, he decided to create new ones using the neighborhood’s only resource: trash. Violins were made from cans, wooden spoons, and forks. Cellos were made from large oil drums. Trumpets and saxophones were made from bottle tops and old pipes. Everything came from the landfill. And so, the Recycled Orchestra was born. The orchestra’s first concert was held for the proud parents of its members. But word spread about these talented musicians. Soon, they performed around Paraguay, and later, they traveled to Brazil for a concert. Before long, their music was being played around the world.\n\nThe orchestra has changed some members’ lives. Says violinist Ada Rios, “When I play the violin, I feel like I am somewhere else. I feel transported to a beautiful place.” Rios now teaches other children how to play, and she hopes to be a professional violin teacher when she’s an adult.\n\nChávez doesn’t think that music is the answer to all the problems facing Cateura’s young people. But he knows that music lets the children experience something extraordinary. It’s motivating them to imagine life beyond Cateura. It’s also teaching them life skills to achieve their goals: responsibility, hard work, and creativity. There’s a saying that “one person’s trash is another’s treasure,” and the Recycled Orchestra proves that it’s true.\n\n\nGuess What!\nIn 2015, a documentary called Landfill Harmonic was made about the Recycled Orchestra. It won awards at many different film festivals.", "speaking": "\"One person's trash is another's treasure.\" Can you think of an example from your own life?", "speakStarters": ["One example is …", "Someone else thought it was …, but …", "This shows that …"], "prompt": "How did the Recycled Orchestra change the lives of children in Cateura? Explain with examples, and give your opinion about what music can teach young people. Write 7–9 sentences.", "starters": ["Cateura is a community next to …", "Favio Chávez wanted to …", "Because there were not enough instruments, …", "The orchestra changed the children's lives by …", "I believe music can teach …"], "cards": [{"word": "landfill", "form": "landfill", "pos": "", "en": "a place where waste is buried under the ground", "ko": "쓰레기 매립지"}, {"word": "offer", "form": "offer", "pos": "", "en": "to provide or supply something", "ko": "제공하다, 내놓다"}, {"word": "resident", "form": "residents", "pos": "", "en": "someone who lives in a particular place", "ko": "거주자, 주민"}, {"word": "op o called me, and that’s when I started working on film costumes.\nAM You’ve done some great films, including several historical films. How do you design costumes for these films?\nKiki Well, I do lots of research, using old photographs from the period, as well as old articles from newspapers and \nfashion magazines of the time. Every detail matters when you want to represent a certain period.\nAM Do you always find old clothes to use as costumes?\nKiki When we can, we use the clothing people wore at that time, after we repair it, of course. Normally, I create the \ncostumes, though.\nAM What is involved in that process?\nKiki After thorough research, I draw and plan each costume. I then have to meet with the film’s director and the \nactors to talk about their requirements. Then, I work on finding the materials to make them. Once I have \neverything, I get my team together, and we begin to sew.\nAM Do you have a lot of people on your team?\nKiki For a large film, I usually work with about 50 people.\nAM What’s your favorite thing about working on films?\nKiki I really enjoy meeting the actors, so that’s very exciting.\nAM I bet it is. And what do you find most difficult about this job?\nKiki Knowing where everything is. There are so many pieces, and when the director calls for something, it must be \nthere right away.\nAM Interesting! Thanks again for your time, Kiki.\nKiki My pleasure.", "speaking": "Would you like to work as a costume designer? What part of the job would you enjoy or find difficult?", "speakStarters": ["I would / wouldn't like to be a costume designer because …", "The part I would enjoy most is …", "The hardest part would be …"], "prompt": "Describe the process Kiki follows to create costumes for a historical film. Use sequence words such as first, then, and finally. Write 7–9 sentences.", "starters": ["Creating costumes for a historical film takes many steps.", "First, Kiki …", "Then, she …", "After that, …", "Finally, …", "I think this job requi

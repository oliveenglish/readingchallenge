<title>Olive Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one calm reading desk — app bar on top, a single centered column (max 1080px), cards only for working surfaces */
:root{
  --bg:#F5F1E7; --surface:#FFFFFF; --sunk:#FBF8F1; --ink:#20365A; --muted:#66708A; --line:#E3DCCC;
  --accent:#3E8C63; --accent-ink:#FFFFFF; --accent-soft:#E3EFE6; --primary:#20365A; --on-primary:#FFFFFF;
  --warn:#C2452D; --warn-soft:#FBE7E2; --gold:#9A7410; --gold-soft:#FAF1D6; --navy-soft:#E7ECF4; --hl:#FCE7E2; --hl-ink:#B33A24;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121821; --surface:#1A2230; --sunk:#161D29; --ink:#E6EBF2; --muted:#9CA6B8; --line:#2B3546;
  --accent:#5CBB8A; --accent-ink:#0E1A13; --accent-soft:#1D3327; --primary:#E6EBF2; --on-primary:#121821;
  --warn:#EF8A73; --warn-soft:#3A221D; --gold:#E3C35E; --gold-soft:#352D18; --navy-soft:#212C3D; --hl:#3B2420; --hl-ink:#F2A08C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --surface:#1A2230; --sunk:#161D29; --ink:#E6EBF2; --muted:#9CA6B8; --line:#2B3546;
  --accent:#5CBB8A; --accent-ink:#0E1A13; --accent-soft:#1D3327; --primary:#E6EBF2; --on-primary:#121821;
  --warn:#EF8A73; --warn-soft:#3A221D; --gold:#E3C35E; --gold-soft:#352D18; --navy-soft:#212C3D; --hl:#3B2420; --hl-ink:#F2A08C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
.brand{font-weight:900;font-size:16px;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.navy{background:var(--primary);color:var(--on-primary)}
.sp{flex:1}
.link{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
main{max-width:1080px;transition:max-width .2s;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
h1{font-size:clamp(24px,3.4vw,32px);font-weight:900;line-height:1.25;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:20px;font-weight:900;margin:0;text-wrap:balance}
h3{font-size:17px;font-weight:700;margin:0}
.sub{color:var(--muted);margin:0}
.small{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:700;font-size:14px;background:var(--primary);color:var(--on-primary)}
.btn.g{background:var(--accent);color:var(--accent-ink)}
.btn.o{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.w{background:var(--warn);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.stat .v i{font-style:normal;font-size:13px;color:var(--muted);font-weight:500}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.meter div{height:100%;background:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-ok{background:var(--accent-soft);color:var(--accent)}.t-wait{background:var(--gold-soft);color:var(--gold)}.t-no{background:var(--navy-soft);color:var(--muted)}.t-red{background:var(--warn-soft);color:var(--warn)}
.unit{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px 20px}
.unit.locked{background:var(--sunk);color:var(--muted)}
.unit .ttl{font-size:17px;font-weight:900;color:var(--ink)}
.unit.locked .ttl{color:var(--muted)}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.tbl .btn,.tbl .tag{white-space:nowrap}
.ugrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.ugrid{grid-template-columns:1fr}}
.lvsum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}.lvsum b{color:var(--ink);font-weight:700}
.pgap{display:block;height:12px}
body.wide main,body.wide .bar-in{max-width:1360px}
.ulay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.ulay .pcol{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.ulay .pcol .passage{font-size:17px;line-height:1.85;max-width:none}
.ulay .tabs .tab{min-width:0;font-size:14px;padding:14px 4px}
@media (max-width:900px){.ulay{grid-template-columns:1fr}.ulay .pcol{position:static;max-height:none}}
.fc .acts .btn.ok{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.need{font-size:12.5px;color:var(--muted);text-align:center}
.fc{border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:250px;justify-content:center}
.fc .w{font-family:var(--f-read);font-size:40px;font-weight:600;line-height:1.1}
.fc .pos{font-size:13px;color:var(--muted);font-style:italic}
.fc .en{font-family:var(--f-read);font-size:19px;line-height:1.5;max-width:46ch}
.fc .ko{font-size:18px;font-weight:700;color:var(--accent)}
.fc.back{background:var(--accent-soft);border-color:var(--accent)}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.wlist button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;font-size:14px}
.wlist button b{font-family:var(--f-read);font-size:16px}
.wlist button.d{border-color:var(--accent);background:var(--accent-soft)}
.st{border:1px solid var(--line);border-radius:9px;padding:6px 4px;text-align:center;font-size:11.5px;background:var(--sunk);color:var(--muted)}
.st b{display:block;font-size:12px}
.st.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.zoom{display:flex;gap:14px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:16px 20px}
.zoom .ic{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;flex:none}
.passage{font-family:var(--f-read);font-size:18px;line-height:1.9;margin:10px 0 0;max-width:72ch}
.tw{border-radius:4px;transition:background .12s;cursor:pointer}
.tw.ts{background:var(--accent-soft)}
.tw.tc{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold);color:var(--ink)}
.vw{background:var(--hl);color:var(--hl-ink);font-weight:600;padding:0 4px;border-radius:5px}
.mis{color:var(--warn);text-decoration:underline wavy var(--warn);text-underline-offset:5px;font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:-22px -24px 22px;overflow-x:auto}
.tab{flex:1;min-width:120px;background:none;border:0;border-bottom:3px solid transparent;padding:15px 8px;font-weight:700;color:var(--muted)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab span{font-size:11px;font-weight:500;background:var(--navy-soft);border-radius:5px;padding:2px 6px;margin-left:5px}
.q{font-size:19px;font-weight:700;margin:6px 0 14px}
.qsent{font-family:var(--f-read);font-size:20px;line-height:1.6;margin:6px 0 16px}
.qsent u{text-decoration:none;border-bottom:3px solid var(--gold);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:15px}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--sunk);border:1px solid var(--line)}
.opt.sel{border-color:var(--primary);background:var(--navy-soft)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;background:var(--accent-soft);font-size:14px}
.fb.bad{background:var(--warn-soft)}
.dots{display:flex;gap:5px}.dots i{width:20px;height:6px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--accent)}.dots i.x{background:var(--warn)}.dots i.c{background:var(--primary)}
.prompt{background:var(--gold-soft);border-radius:var(--r);padding:16px 20px}
.prompt ul{margin:10px 0 0;padding-left:16px;border-left:3px solid var(--gold);list-style:none}
.prompt li{font-style:italic;font-family:var(--f-read);color:var(--gold)}
textarea,input[type=text],input[type=password],select{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px}
textarea{min-height:180px;font-family:var(--f-read);font-size:17px;line-height:1.8;resize:vertical}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.rec{border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--sunk);display:flex;flex-direction:column;gap:10px}
.rec.done{background:var(--surface);border-color:var(--accent)}
.qbox{border-left:4px solid var(--gold);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:700;font-family:var(--f-read);font-size:17px}
.note{background:var(--navy-soft);border-radius:12px;padding:12px 16px;font-size:13.5px}
.sent-w{background:var(--warn-soft);border-radius:12px;padding:12px 16px}
.sent-f{background:var(--accent-soft);border-radius:12px;padding:12px 16px}
.lab{font-size:11.5px;font-weight:700;margin-bottom:2px}
.sent-w .lab{color:var(--warn)}.sent-f .lab{color:var(--accent)}
.s{font-family:var(--f-read);font-size:18px;line-height:1.7}
.del{color:var(--warn);text-decoration:underline wavy var(--warn);text-underline-offset:4px;font-weight:600}
.add{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 3px;font-weight:600}
.why{margin-top:8px;font-size:13.5px;background:var(--surface);border-radius:8px;padding:8px 12px}
.preview{border:1.5px dashed var(--line);border-radius:12px;padding:14px 18px;font-family:var(--f-read);font-size:16px;line-height:1.8;background:var(--sunk)}
.preview .pend{color:var(--muted)}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.ladder span{font-size:12px;font-weight:700;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums}
.ladder .d{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.ladder .c{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ladder .x{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.short{font-family:var(--f-read);font-size:18px;line-height:1.85;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.badge{width:150px;height:150px;border-radius:28px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;text-align:center;padding:10px}
.badge small{font-size:11px;font-weight:700;letter-spacing:.08em}
.badge b{font-size:24px;font-weight:900;line-height:1.15}
.bars{display:grid;gap:10px}
.br{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;font-size:14px}
.br .tr{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.br .tr div{height:100%;border-radius:5px;background:var(--accent)}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;font-size:12.5px}
.rule span{border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:center;color:var(--muted)}
.rule span.on{border:2px solid var(--accent);color:var(--accent);font-weight:700}
.tside{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:start}
.tside>*{min-width:0}
.tnav{display:flex;flex-direction:column;gap:4px;position:sticky;top:80px}
.tnav button{text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:700;color:var(--muted)}
.tnav button.on{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--sunk)}
.sq{display:flex;gap:4px}.sq i{width:13px;height:13px;border-radius:4px;background:var(--line)}.sq i.d{background:var(--accent)}.sq i.p{background:var(--gold)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:var(--f-read);font-size:15.5px;line-height:1.85}
.col h5{font-family:var(--f-ui);font-size:12px;margin:0 0 6px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:9}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.door{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:22px}
.door h3{font-size:19px;font-weight:900}
.pin{letter-spacing:.4em;font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:760px){.tside{grid-template-columns:1fr}.tnav{flex-direction:row;overflow-x:auto;position:static}.tnav button{white-space:nowrap}.steps{grid-template-columns:repeat(2,1fr)}.br{grid-template-columns:90px 1fr 44px}.passage{font-size:17px}}

/* ---------- landing (home) ---------- */
body.home main{max-width:none;padding:0}
body.home .bar-in{max-width:1160px}
.lw{max-width:1160px;margin:0 auto;padding-inline:20px}
.lnav{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.lnav button{background:none;border:0;padding:8px 10px;font-size:14px;font-weight:500;color:var(--muted);border-radius:8px}
.lnav button:hover{color:var(--ink);background:var(--sunk)}
.lhero{background:linear-gradient(180deg,var(--surface) 0%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.lhero .lw{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,420px);gap:48px;align-items:center;padding-block:72px 80px}
.lhero h1{font-size:clamp(32px,5vw,52px);line-height:1.15;margin:12px 0 18px;letter-spacing:-.03em}
.lhero .lead{font-size:17px;color:var(--muted);max-width:52ch;margin:0 0 26px;line-height:1.7}
.lkicker{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px}
.lfacts{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.lfacts div b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lfacts div span{font-size:13px;color:var(--muted)}
.lbtn{padding:14px 24px;font-size:15px;border-radius:12px}
.login{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 18px 50px -24px rgba(32,54,90,.35);display:flex;flex-direction:column;gap:12px}
.login h3{font-size:22px;font-weight:900}
.lsec{padding-block:88px}
.lsec.alt{background:var(--surface);border-block:1px solid var(--line)}
.lhead{max-width:640px;margin-bottom:40px}
.lhead h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.02em;line-height:1.25;margin:10px 0 12px}
.lhead p{color:var(--muted);margin:0;font-size:16px;line-height:1.7}
.lsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.lstep{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.lsec.alt .lstep{background:var(--bg)}
.lstep.coach{background:var(--accent-soft)!important;border-color:var(--accent)}
.lstep .no{font-family:var(--f-read);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.lstep h4{margin:4px 0 0;font-size:16px;font-weight:900}
.lstep p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.65}
.lfeat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.lfeat .f{padding:26px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.lfeat .f .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft);margin-bottom:14px}
.lfeat .f h4{margin:0 0 6px;font-size:17px;font-weight:900}
.lfeat .f p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.lunits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lu{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.lu .n{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.lu b{font-family:var(--f-read);font-size:17px;font-weight:600;line-height:1.35}
.lu.open{border-color:var(--accent)}

: {"passage": "Many animals hide from danger. They use their color and shape. We call this camouflage.\n\nA polar bear has white fur. It lives in a snowy land. In the white snow, it is hard to see.\n\nA stick insect has a long, thin body. It looks like a small brown stick. Birds fly right past it!\n\nA frog can have green skin. It sits on a green leaf. Its color matches the leaf.\n\nSome animals can change color. An octopus can turn red, brown, or gray. It matches the rocks on the sea floor.\n\nA flatfish has a flat body. It lies on the sandy bottom of the sea. Its spotted skin looks like sand.\n\nHiding keeps these animals safe. It also helps them catch food.", "speaking": "Which animal do you want to be when you hide? Why? (15–20 seconds)", "speakStarters": ["I want to be a … .", "It has … (color) … (body).", "It can hide in … ."], "prompt": "Pick one animal that is good at hiding. Write 3–4 sentences about it.", "starters": ["A … is good at hiding.", "It has … .", "It hides in / on … .", "It is safe there."], "cards": [{"word": "hide", "form": "hide", "pos": "v.", "en": "to go where others cannot see you", "ko": "숨다"}, {"word": "danger", "form": "danger", "pos": "n.", "en": "something that can hurt you", "ko": "위험"}, {"word": "shape", "form": "shape", "pos": "n.", "en": "the outside form of something, like round or long", "ko": "모양"}, {"word": "fur", "form": "fur", "pos": "n.", "en": "the thick, soft hair on an animal", "ko": "털"}, {"word": "thin", "form": "thin", "pos": "adj.", "en": "not thick or fat", "ko": "가는, 얇은"}, {"word": "match", "form": "matches", "pos": "v.", "en": "to look the same as something", "ko": "~와 어울리다, 같아 보이다"}, {"word": "flat", "form": "flat", "pos": "adj.", "en": "smooth and not high", "ko": "납작한, 평평한"}, {"word": "catch", "form": "catch", "pos": "v.", "en": "to get and hold something", "ko": "잡다"}], "vocab": [["hide", "The cat likes to hide under the bed.", ["to eat lunch", "to go where others cannot see you", "to jump up high", "to talk loudly"], 1, "hide = 숨다."], ["danger", "A red light means danger.", ["a happy song", "something that can hurt you", "a nice gift", "a soft bed"], 1, "danger = 위험."], ["shape", "A ball has a round shape.", ["the name of a city", "the outside form of something, like round or long", "the sound of music", "the smell of food"], 1, "shape = 모양."], ["fur", "My dog has soft brown fur.", ["the wings of a bird", "the thick, soft hair on an animal", "the hard shell of a turtle", "the fins of a fish"], 1, "fur = (동물의) 털."], ["thin", "The pencil is long and thin.", ["very short and fat", "not thick or fat", "very big and round", "very heavy"], 1, "thin = 가는, 얇은."], ["match", "My socks match my shirt.", ["to break into pieces", "to look very different", "to look the same as something", "to run away"], 2, "match = 같아 보이다, 어울리다."], ["flat", "A pancake is flat.", ["very tall", "smooth and not high", "full of holes", "very round like a ball"], 1, "flat = 납작한."], ["catch", "The cat can catch a mouse.", ["to get and hold something", "to let something go", "to throw something away", "to forget something"], 0, "catch = 잡다."]], "comp": [{"type": "사실 확인", "q": "What color is a polar bear's fur?", "options": ["It is green.", "It is brown.", "It is gray.", "It is white."], "answer": 3, "ex": "2문단: A polar bear has white fur."}, {"type": "세부 내용", "q": "What does a stick insect look like?", "options": ["It looks like sand.", "It looks like a green leaf.", "It looks like a rock.", "It looks like a small brown stick."], "answer": 3, "ex": "3문단: It looks like a small brown stick."}, {"type": "사실 확인", "q": "Where does the flatfish lie?", "options": ["It lies on a green leaf.", "It lies in the snow.", "It lies in a tree.", "It lies on the sandy bottom of the sea."], "answer": 3, "ex": "6문단: It lies on the sandy bottom of the sea."}, {"type": "순서", "q": "Which animal comes right AFTER the frog in the passage?", "options": ["The polar bear comes after the frog.", "The octopus comes after the frog.", "The flatfish comes after the frog.", "The stick insect comes after the frog."], "answer": 1, "ex": "개구리(4문단) 다음은 문어(5문단)예요."}, {"type": "문맥 속 어휘", "q": "\"Its color matches the leaf.\" What does \"matches\" mean?", "options": ["It means the color is very different.", "It means the color looks the same.", "It means the frog is eating the leaf.", "It means the leaf is hiding."], "answer": 1, "ex": "match = 같아 보이다. 그래서 잘 안 보여요."}, {"type": "문법 · 형용사 + 명사 (color, shape)", "q": "A polar bear has ______ .", "options": ["whites fur", "fur white", "fur whites", "white fur"], "answer": 3, "ex": "형용사(white)는 명사(fur) 앞에 → white fur."}, {"type": "문법 · 형용사 + 명사 (color, shape)", "q": "Which sentence is correct?", "options": ["It has a long, thin body.", "It has long a thin body.", "It has a longs thin body.", "It has a body long, thin."], "answer": 0, "ex": "a + 형용사 + 형용사 + 명사 → a long, thin body."}, {"type": "문법 · 형용사 + 명사 (color, shape)", "q": "The frog sits on a ______ leaf.", "options": ["greens", "a green", "green", "greenly"], "answer": 2, "ex": "명사 leaf 앞에는 형용사 green. 형용사에는 -s를 붙이지 않아요."}]}, "5": {"passage": "Hello! I am Bee, a little honeybee. Come and see my busy day!\n\nIt is morning. The sun is shining. First, I am leaving my hive. My sisters are flying with me.\n\nThen, I am visiting a garden. I am landing on a yellow flower. I am drinking sweet nectar. Yellow pollen is sticking to my legs.\n\nNext, I am flying to a red flower. The pollen from the yellow flower falls off there. This helps new seeds grow.\n\nNow it is afternoon. I am carrying the nectar home. Other bees are making honey in the hive.\n\nFinally, it is night. The hive is dark and warm. My sisters and I are resting.\n\nBees are small, but we do big jobs. We help plants grow, and we make honey for you!", "speaking": "Why are bees important? Say one thing bees do. (15–20 seconds)", "speakStarters": ["Bees are important.", "They help … .", "They make … ."], "prompt": "Write about a bee's day in order. Use First, Then, and Finally. Write 3–4 sentences.", "starters": ["First, the bee is … .", "Then, it is … .", "Next, it is … .", "Finally, it is … ."], "cards": [{"word": "honeybee", "form": "honeybee", "pos": "n.", "en": "a small flying insect that makes honey", "ko": "꿀벌"}, {"word": "busy", "form": "busy", "pos": "adj.", "en": "having a lot of things to do", "ko": "바쁜"}, {"word": "hive", "form": "hive", "pos": "n.", "en": "the home where bees live", "ko": "벌집"}, {"word": "land", "form": "landing", "pos": "v.", "en": "to come down from the air onto something", "ko": "내려앉다, 착륙하다"}, {"word": "nectar", "form": "nectar", "pos": "n.", "en": "the sweet liquid inside flowers", "ko": "꿀물, 화밀"}, {"word": "pollen", "form": "pollen", "pos": "n.", "en": "the yellow powder inside flowers", "ko": "꽃가루"}, {"word": "seed", "form": "seeds", "pos": "n.", "en": "a small thing that grows into a new plant", "ko": "씨앗"}, {"word": "rest", "form": "resting", "pos": "v.", "en": "to stop working and relax or sleep", "ko": "쉬다"}], "vocab": [["honeybee", "A honeybee is sitting on the flower.", ["a small dog", "a big bird", "a kind of fish", "a small flying insect that makes honey"], 3, "honeybee = 꿀벌."], ["busy", "My mom is busy today.", ["very cold", "very sleepy", "having nothing to do", "having a lot of things to do"], 3, "busy = 바쁜."], ["hive", "Many bees live in one hive.", ["the home where bees live", "a pond for fish", "a nest for birds", "a hole for rabbits"], 0, "hive = 벌집."], ["land", "The plane will land soon.", ["to come down from the air onto something", "to swim in the sea", "to dig a hole", "to fly up very high"], 0, "land = 내려앉다."], ["nectar", "Bees drink nectar from flowers.", ["the sweet liquid inside flowers", "hard seeds in fruit", "green leaves on a tree", "dry sand on a beach"], 0, "nectar = 꽃 속의 달콤한 즙."], ["pollen", "Pollen makes me sneeze.", ["a kind of water", "a type of stone", "a piece of paper", "the yellow powder inside flowers"], 3, "pollen = 꽃가루."], ["seed", "I planted a seed in the pot.", ["a small thing that grows into a new plant", "a kind of insect", "a drop of rain", "a dead leaf"], 0, "seed = 씨앗."], ["rest", "Let's rest under the tree.", ["to run a race", "to fly to a flower", "to work very hard", "to stop working and relax or sleep"], 3, "rest = 쉬다."]], "comp": [{"type": "사실 확인", "q": "Where does Bee live?", "options": ["Bee lives in a tree.", "Bee lives in a garden.", "Bee lives in a red flower.", "Bee lives in a hive."], "answer": 3, "ex": "2문단: First, I am leaving my hive. 벌의 집은 hive예요."}, {"type": "사실 확인", "q": "What sticks to Bee's legs?", "options": ["Water sticks to her legs.", "Yellow pollen sticks to her legs.", "Red leaves stick to her legs.", "Sweet honey sticks to her legs."], "answer": 1, "ex": "3문단: Yellow pollen is sticking to my legs."}, {"type": "사실 확인", "q": "What are the other bees doing in the hive?", "options": ["They are eating flowers.", "They are making honey.", "They are visiting a garden.", "They are sleeping all day."], "answer": 1, "ex": "5문단: Other bees are making honey in the hive."}, {"type": "순서", "q": "What does Bee do FIRST?", "options": ["She leaves her hive.", "She drinks nectar.", "She flies to a red flower.", "She rests in the hive."], "answer": 0, "ex": "2문단: First, I am leaving my hive."}, {"type": "문맥 속 어휘", "q": "\"My sisters and I are resting.\" What does \"resting\" mean?", "options": ["They are working hard.", "They are making honey.", "They are flying fast.", "They are stopping to relax and sleep."], "answer": 3, "ex": "rest = 쉬다. 밤이 되어 쉬고 있어요."}, {"type": "문법 · 현재진행형 (am / is / are + -ing)", "q": "Look! The bee ______ on a flower.", "options": ["is landing", "landing", "is land", "are landing"], "answer": 0, "ex": "The bee(하나) → is + landing."}, {"type": "문법 · 현재진행형 (am / is / are + -ing)", "q": "My sisters ______ with me.", "options": ["am flying", "flying", "is flying", "are flying"], "answer": 3, "ex": "My sisters(여럿) → are + flying."}, {"type": "문법 · 현재진행형 (am / is / are + -ing)", "q": "Which sentence is correct?", "options": ["I drinking juice.", "I am drink juice.", "I is drinking juice.", "I am drinking juice."], "answer": 3, "ex": "I → am + 동사-ing."}]}, "6": {"passage": "Once there was a rabbit. He ran very fast across the green fields. He was proud of his long legs.\n\nOne day, he saw a slow turtle. \"You are so slow!\" he said. The turtle smiled. \"Let's have a race,\" she said.\n\nThe race began, and the rabbit ran far ahead. Soon, he could not see the turtle. \"I have lots of time,\" he thought. So he sat under a tree and fell asleep.\n\nThe turtle did not stop. She went step by step. She passed the sleeping rabbit.\n\nThe rabbit woke up late. He ran and ran. But the turtle was already at the finish line! All the animals cheered for her.\n\nThe rabbit felt silly. He learned an important lesson. Slow and steady wins the race.", "speaking": "What do you want to say to the rabbit? (15–20 seconds)", "speakStarters": ["Rabbit, you were … .", "Next time, don't … .", "Be like the turtle!"], "prompt": "What is the lesson of the story? What do you think? Write 3–4 sentences.", "starters": ["The lesson is … .", "The rabbit was … .", "The turtle did not … .", "I think … ."], "cards": [{"word": "proud", "form": "proud", "pos": "adj.", "en": "feeling that you are very good at something", "ko": "자랑스러워하는, 뽐내는"}, {"word": "slow", "form": "slow", "pos": "adj.", "en": "not fast", "ko": "느린"}, {"word": "race", "form": "race", "pos": "n.", "en": "a game to see who is the fastest", "ko": "경주, 달리기 시합"}, {"word": "ahead", "form": "ahead", "pos": "adv.", "en": "in front of others", "ko": "앞에, 앞서"}, {"word": "asleep", "form": "asleep", "pos": "adj.", "en": "sleeping", "ko": "잠든"}, {"word": "pass", "form": "passed", "pos": "v.", "en": "to go by something or someone", "ko": "지나가다, 앞지르다"}, {"word": "cheer", "form": "cheered", "pos": "v.", "en": "to shout to show you are happy for someone", "ko": "환호하다, 응원하다"}, {"word": "lesson", "form": "lesson", "pos": "n.", "en": "something you learn", "ko": "교훈, 배울 점"}], "vocab": [["proud", "She is proud of her drawing.", ["feeling that you are very good at something", "feeling very scared", "feeling very hungry", "feeling very sleepy"], 0, "proud = 자랑스러워하는. 너무 뽐내면 좋지 않아요."], ["slow", "A snail is very slow.", ["very fast", "very loud", "very tall", "not fast"], 3, "slow = 느린."], ["race", "I won the race at school.", ["a game to see who is the fastest", "a quiet book", "a big lunch", "a long nap"], 0, "race = 경주."], ["ahead", "My dog ran ahead of me.", ["in front of others", "inside the house", "far behind", "under the ground"], 0, "ahead = 앞서."], ["asleep", "The baby is asleep in bed.", ["very angry", "running fast", "wide awake", "sleeping"], 3, "asleep = 잠든. fall asleep = 잠들다."], ["pass", "The car passed our bus.", ["to stop and wait", "to sit down", "to go back home", "to go by something or someone"], 3, "pass = 지나가다, 앞지르다."], ["cheer", "We cheer for our team.", ["to sleep all day", "to shout to show you are happy for someone", "to cry quietly", "to say bad words"], 1, "cheer = 환호하다."], ["lesson", "The story has a good lesson.", ["something you learn", "a fast car", "a kind of food", "a type of tree"], 0, "lesson = 교훈 (수업이라는 뜻도 있어요)."]], "comp": [{"type": "사실 확인", "q": "Why was the rabbit proud?", "options": ["He was proud of his big house.", "He was proud of his soft fur.", "He was proud of his friends.", "He was proud of his long legs."], "answer": 3, "ex": "1문단: He was proud of his long legs."}, {"type": "사실 확인", "q": "What did the rabbit do under the tree?", "options": ["He fell asleep.", "He read a book.", "He waited for the turtle.", "He ate a carrot."], "answer": 0, "ex": "3문단: So he sat under a tree and fell asleep."}, {"type": "교훈 찾기", "q": "What is the lesson of the story?", "options": ["Fast animals always win.", "Slow and steady wins the race.", "Rabbits are better than turtles.", "You should sleep under a tree."], "answer": 1, "ex": "마지막 문장: Slow and steady wins the race. 천천히 꾸준히 하면 이겨요."}, {"type": "순서", "q": "What happened right AFTER the turtle passed the rabbit?", "options": ["The rabbit saw the turtle.", "The rabbit woke up late.", "The rabbit fell asleep.", "The race began."], "answer": 1, "ex": "4문단: She passed the sleeping rabbit. → 5문단: The rabbit woke up late."}, {"type": "문맥 속 어휘", "q": "\"All the animals cheered for her.\" What does \"cheered\" mean?", "options": ["They ran away from the turtle.", "They shouted happily for the turtle.", "They laughed at the turtle.", "They slept next to the turtle."], "answer": 1, "ex": "cheer = 기뻐하며 환호하다."}, {"type": "문법 · 과거시제 (불규칙 동사 기초)", "q": "The rabbit ______ under a tree.", "options": ["sits", "sitted", "sat", "sated"], "answer": 2, "ex": "sit의 과거형은 불규칙 → sat."}, {"type": "문법 · 과거시제 (불규칙 동사 기초)", "q": "Yesterday, I ______ my friend at the park.", "options": ["saw", "see", "seen", "seed"], "answer": 0, "ex": "see의 과거형은 불규칙 → saw."}, {"type": "문법 · 과거시제 (불규칙 동사 기초)", "q": "Which sentence is correct?", "options": ["The turtle goed step by step.", "The turtle went step by step.", "The turtle go step by step yesterday.", "The turtle wented step by step."], "answer": 1, "ex": "go의 과거형은 불규칙 → went."}]}, "7": {"passage": "We have four seasons. They are spring, summer, fall, and winter. Why do they change? It is because of the Earth and the Sun.\n\nThe Earth moves around the Sun. One trip takes one year. The Earth is also tilted. It leans a little to one side.\n\nIn summer, our part of the Earth leans toward the Sun. We get more sunlight, so it is hot. The days are long.\n\nIn winter, our part leans away from the Sun. We get less sunlight, so it is cold. The days are short.\n\nSpring and fall are in between. They are not too hot. They are not too cold.\n\nIs it summer in December? In some countries, yes! This is because they are on the other side of the Earth.", "speaking": "What is your favorite season? Why? (15–20 seconds)", "speakStarters": ["My favorite season is … .", "I like it because … .", "In …, I can … ."], "prompt": "Write about your favorite season. Use because or so. Write 3–4 sentences.", "starters": ["My favorite season is … .", "I like it because … .", "It is …, so I … .", "In …, I … ."], "cards": [{"word": "season", "form": "seasons", "pos": "n.", "en": "one of the four parts of the year", "ko": "계절"}, {"word": "change", "form": "change", "pos": "v.", "en": "to become different", "ko": "바뀌다, 변하다"}, {"word": "trip", "form": "trip", "pos": "n.", "en": "a time when you go somewhere and come back", "ko": "여행, 한 바퀴"}, {"word": "tilt", "form": "tilted", "pos": "v.", "en": "to lean to one side, not straight", "ko": "기울다, 기울이다"}, {"word": "lean", "form": "leans", "pos": "v.", "en": "to bend to one side", "ko": "기울다, 기대다"}, {"word": "toward", "form": "toward", "pos": "prep.", "en": "in the direction of", "ko": "~쪽으로"}, {"word": "sunlight", "form": "sunlight", "pos": "n.", "en": "the light from the sun", "ko": "햇빛"}, {"word": "between", "form": "between", "pos": "prep.", "en": "in the middle of two things", "ko": "~ 사이에"}], "vocab": [["season", "Summer is my favorite season.", ["one day of the week", "one of the four parts of the year", "one hour of the day", "one kind of fruit"], 1, "season = 계절."], ["change", "The leaves change color in fall.", ["to become different", "to fall asleep", "to stay the same", "to stop moving"], 0, "change = 바뀌다."], ["trip", "We took a trip to the beach.", ["a time when you go somewhere and come back", "a quiet room", "a small bag", "a cold drink"], 0, "trip = 여행. 여기서는 해를 한 바퀴 도는 것이에요."], ["tilt", "The picture on the wall is tilted.", ["to become very hot", "to stand very straight", "to lean to one side, not straight", "to spin very fast"], 2, "tilt = 기울다. tilted = 기울어진."], ["lean", "The tree leans to the left.", ["to stand up straight", "to lie on the floor", "to jump up and down", "to bend to one side"], 3, "lean = 한쪽으로 기울다."], ["toward", "The dog ran toward me.", ["away from", "under", "inside", "i Monday will be the warmest.", "Tuesday will be the warmest.", "Friday will be the warmest."], "answer": 1, "ex": "표: Monday 25°C가 가장 높아요."}, {"type": "순서", "q": "What will happen right AFTER the two rainy days?", "options": ["The sun will come back on Friday.", "It will snow on Friday.", "It will be cloudy.", "It will be windy on Tuesday."], "answer": 0, "ex": "수·목 비 → 금요일: the sun will come back."}, {"type": "문맥 속 어휘", "q": "\"Hold on to your hat!\" Why does the reporter say this?", "options": ["It will be dark.", "Hats are on sale.", "It will be very hot.", "The wind can blow your hat away."], "answer": 3, "ex": "windy(바람이 많이 부는) 날이라 모자가 날아갈 수 있어요."}, {"type": "문법 · will (날씨 예측)", "q": "Tomorrow, it ______ rainy.", "options": ["will be", "is be", "wills be", "will"], "answer": 0, "ex": "앞으로의 날씨 → will + be."}, {"type": "문법 · will (날씨 예측)", "q": "It will ______ windy on Saturday.", "options": ["to be", "be", "being", "is"], "answer": 1, "ex": "will 뒤에는 동사원형 → be."}, {"type": "문법 · will (날씨 예측)", "q": "Which sentence is correct?", "options": ["It wills snow tomorrow.", "It will snowing tomorrow.", "It will snow tomorrow.", "It will snows tomorrow."], "answer": 2, "ex": "will + 동사원형(snow)."}]}, "9": {"passage": "It was Saturday. Mia looked out the window. It was raining hard.\n\n\"Oh no,\" Mia said. \"We can't go to the park today.\" She felt sad.\n\nHer brother Sam had an idea. \"Let's build a fort!\" he said.\n\nThey took blankets and pillows. They put them over two chairs. The fort was dark and cozy.\n\n\"How about a picnic in the fort?\" Mia asked. Sam smiled. \"Great idea!\"\n\nMom made sandwiches. Mia brought some apples. They ate lunch inside the fort.\n\nThen Sam got a flashlight. \"Let's read a story,\" he said. They read a book about pirates.\n\nAt night, the rain stopped. Mia was not sad anymore. \"That was the best rainy day ever,\" she said. \"Let's do it again next time!\"", "speaking": "What can you do with a friend on a rainy day? (15–20 seconds)", "s d wet", "dark and scary", "warm and comfortable", "big and noisy"], 2, "cozy = 따뜻하고 아늑한."], ["inside", "The cat is inside the box.", ["far away", "in a room, box, or place", "outside", "on top"], 1, "inside = 안에."], ["flashlight", "I need a flashlight in the dark.", ["a big window", "a red apple", "a small light you hold in your hand", "a sunny day"], 2, "flashlight = 손전등."]], "comp": [{"type": "사실 확인", "q": "Why couldn't Mia go to the park?", "options": ["She was sick.", "It was raining hard.", "It was too hot.", "The park was closed."], "answer": 1, "ex": "1–2문단: It was raining hard. We can't go to the park today."}, {"type": "인물의 마음", "q": "How did Mia feel at the start of the story?", "options": ["She felt angry.", "She felt sleepy.", "She felt sad.", "She felt happy."], "answer": 2, "ex": "2문단: She felt sad."}, {"type": "사실 확인", "q": "What did they put over two chairs?", "options": ["They put sandwiches over two chairs.", "They put books over two chairs.", "They put blankets and pillows over two chairs.", "They put apples over two chairs."], "answer": 2, "ex": "4문단: They took blankets and pillows. They put them over two chairs."}, {"type": "순서", "q": "What did they do right AFTER lunch?", "options": ["They looked out the window.", "They built a fort.", "They went to the park.", "They read a story with a flashlight."], "answer": 3, "ex": "6문단 점심 → 7문단: Then Sam got a flashlight. Let's read a story."}, {"type": "문맥 속 어휘", "q": "\"The fort was dark and cozy.\" What does \"cozy\" mean?", "options": ["It means warm and comfortable.", "It means cold and wet.", "It means very big.", "It means very scary."], "answer": 0, "ex": "cozy = 따뜻하고 아늑한."}, {"type": "문법 · Let's … / How about …?", "q": "Let's ______ a fort!", "options": ["to build", "build", "builds", "building"], "answer": 1, "ex": "Let's + 동사원형 → Let's build."}, {"type": "문법 · Let's … / How about …?", "q": "How about ______ a story?", "options": ["reads", "reading", "read", "to read"], "answer": 1, "ex": "How about 뒤에는 명사나 동사-ing → reading."}, {"type": "문법 · Let's … / How about …?", "q": "Which sentence is correct?", "options": ["Let's plays a game.", "Let's to play a game.", "Let's play a game.", "Let's playing a game."], "answer": 2, "ex": "Let's + 동사원형(play)."}]}, "10": {"passage": "Do you like bread? Bread comes from a plant called wheat. Here is how it happens.\n\nFirst, farmers grow wheat in big fields. When it turns gold, they cut it.\n\nNext, a machine takes out the seeds. The seeds go to a mill. At the mill, they become soft white flour.\n\nNow, you can make bread at home! Ask an adult to help you.\n1. Mix flour, water, salt, and yeast in a bowl.\n2. Push and fold the dough for ten minutes.\n3. Cover the bowl. Wait for one hour. The dough will get bigger.\n4. Shape the dough into a loaf.\n5. Bake it in a hot oven for thirty minutes. Don't touch the hot oven!\n\nLet it cool a little. Then cut a slice and enjoy your warm bread!", "speaking": "What is your favorite breakfast? (15–20 seconds)", "speakStarters": ["My favorite breakfast is … .", "I eat it with … .", "It is … ."], "prompt": "How do you make your favorite snack? Write the steps. Write 3–4 sentences.", "starters": ["First, … .", "Next, … .", "Then, … .", "Finally, … ."], "cards": [{"word": "wheat", "form": "wheat", "pos": "n.", "en": "a plant that farmers grow to make flour", "ko": "밀"}, {"word": "field", "form": "fields", "pos": "n.", "en": "a big, open area of land for growing plants", "ko": "들판, 밭"}, {"word": "mill", "form": "mill", "pos": "n.", "en": "a building where seeds are made into flour", "ko": "방앗간, 제분소"}, {"word": "flour", "form": "flour", "pos": "n.", "en": "a white powder used to make bread and cake", "ko": "밀가루"}, {"word": "mix", "form": "Mix", "pos": "v.", "en": "to put things together and stir them", "ko": "섞다"}, {"word": "dough", "form": "dough", "pos": "n.", "en": "a soft mix of flour and water for bread", "ko": "반죽"}, {"word": "bake", "form": "Bake", "pos": "v.", "en": "to cook someth y become soft white flour."}, {"type": "사실 확인", "q": "How long do you bake the bread?", "options": ["You bake it for thirty minutes.", "You bake it for one day.", "You bake it for one hour.", "You bake it for ten minutes."], "answer": 0, "ex": "5번 단계: Bake it in a hot oven for thirty minutes."}, {"type": "순서", "q": "What do you do right AFTER you mix everything in a bowl?", "options": ["You shape it into a loaf.", "You bake it in the oven.", "You cut a slice.", "You push and fold the dough."], "answer": 3, "ex": "1번 Mix → 2번 Push and fold the dough."}, {"type": "문맥 속 어휘", "q": "\"Cut a slice and enjoy your warm bread!\" What is a \"slice\"?", "options": ["It is a big bowl.", "It is a thin, flat piece.", "It is a hot oven.", "It is a bag of flour."], "answer": 1, "ex": "slice = 얇게 자른 한 조각."}, {"type": "문법 · 명령문 (Mix… / Don't…)", "q": "______ the dough into a loaf.", "options": ["Shaping", "Shapes", "To shapes", "Shape"], "answer": 3, "ex": "명령문은 동사원형으로 시작 → Shape."}, {"type": "문법 · 명령문 (Mix… / Don't…)", "q": "Which sentence is a command (명령문)?", "options": ["They are washing their hands.", "I wash my hands.", "She washes her hands.", "Wash your hands."], "answer": 3, "ex": "주어 없이 동사원형으로 시작 → 명령문."}, {"type": "문법 · 명령문 (Mix… / Don't…)", "q": "______ touch the hot oven!", "options": ["Don't", "No", "Not", "Doesn't"], "answer": 0, "ex": "하지 말라는 명령 → Don't + 동사원형."}]}, "11": {"passage": "What do kids eat for lunch? It is different around the world.\n\nIn Korea, many kids eat lunch at school. They have rice, soup, and kimchi. They also eat some meat or fish. They use a spoon and chopsticks.\n\nIn the United States, some kids bring a lunch box from home. They often eat a sandwich. They also have fruit and a carton of milk.\n\nA school lunch in Korea is usually warm. A sandwich is cold. A Korean lunch has more dishes. A sandwich lunch is smaller and faster to eat.\n\nBut the two lunches are the same in some ways. Both have healthy food. Both give kids energy to learn and play.\n\nWhich lunch do you think is healthier? Which one is bigger? There is no right answer. Every country has its own yummy lunch!", "speaking": "Which lunch do you want to try? Why? (15–20 seconds)", "speakStarters": ["I want to try … .", "It looks … .", "I like … ."], "prompt": "Compare two lunches. How are they different? Write 3–4 sentences.", "starters": ["In …, kids eat … .", "In …, kids eat … .", "… is bigger / warmer than … .", "I like … better."], "cards": [{"word": "different", "form": "different", "pos": "adj.", "en": "not the same", "ko": "다른"}, {"word": "chopsticks", "form": "chopsticks", "pos": "n.", "en": "two thin sticks you use to eat food", "ko": "젓가락"}, {"word": "carton", "form": "carton", "pos": "n.", "en": "a small paper box for milk or juice", "ko": "(우유·주스) 팩"}, {"word": "usually", "form": "usually", "pos": "adv.", "en": "most of the time", "ko": "보통, 대개"}, {"word": "dish", "form": "dishes", "pos": "n.", "en": "food that is made in one way, or a plate", "ko": "요리, 접시"}, {"word": "same", "form": "same", "pos": "adj.", "en": "not different", "ko": "같은"}, {"word": "healthy", "form": "healthy", "pos": "adj.", "en": "good for your body", "ko": "건강에 좋은, 건강한"}, {"word": "energy", "form": "energy", "pos": "n.", "en": "the power to move, work, and play", "ko": "힘, 에너지"}], "vocab": [["different", "My shoes are different from yours.", ["very small", "very old", "exactly the same", "not the same"], 3, "different = 다른."], ["chopsticks", "I eat noodles with chopsticks.", ["a big plate", "a kind of soup", "a cup for water", "two thin sticks you use to eat food"], 3, "chopsticks = 젓가락."], ["carton", "I drink a carton of juice every day.", ["a small paper box for milk or juice", "a metal can", "a plastic plate", "a big glass bottle"], 0, "carton = 종이팩."], ["usually", "I usually walk to school.", ["late at night", "most of the time", "only one time", "never"], 1, "usually = 보통."], ["dish", "Kimchi is a Korean dish.", ["a school bag", "food that is made in one ": "Build a Paper Bridge", "6": "Mina's Messy Machine", "7": "Kindness Is Contagious", "8": "Dear Advice Owl", "9": "The New Kid", "10": "From Seed to Sunflower", "11": "Our Class Garden Journal", "12": "The Pumpkin That Wouldn't Stop"}, "fields": {}, "units": {"1": {"passage": "A desert is a place that gets very little rain. Some deserts are hot, like the Sahara in Africa. Others are cold, like the Gobi in Asia. Even Antarctica is a desert because almost no rain or snow falls there.\n\nLife in a desert is hard. But many plants and animals live there. A cactus stores water inside its thick stem. Its sharp spines keep thirsty animals away. A camel can walk for days without drinking. It stores fat in its hump, not water! Many small animals sleep under the sand during the hot day. They come out at night when it is cool.\n\nThe Sahara was not always a desert. Thousands of years ago, there was a lot of rain. There were green grasslands and big lakes. There were even hippos and crocodiles! Then the weather slowly changed, and the land dried up.\n\nToday, people still live in deserts. They find water in oases and deep wells. They wear long, loose clothes to stay cool.", "speaking": "You are going to a desert. Choose three things to bring. Give one reason. (20–30 seconds)", "speakStarters": ["I will bring …, …, and … .", "The most important thing is … .", "I need it because … ."], "prompt": "How can you stay safe in a desert? Write 4–5 sentences.", "starters": ["A desert is a hard place to live.", "First, I will … .", "Also, I will … .", "I will not … .", "Then I can stay safe."], "cards": [{"word": "desert", "form": "desert", "pos": "n.", "en": "a dry place that gets very little rain", "ko": "사막"}, {"word": "cactus", "form": "cactus", "pos": "n.", "en": "a desert plant with a thick stem and sharp spines", "ko": "선인장"}, {"word": "store", "form": "stores", "pos": "v.", "en": "to keep something to use later", "ko": "저장하다"}, {"word": "sharp", "form": "sharp", "pos": "adj.", "e {"type": "문법 · There was / There were", "q": "Which sentence is correct?", "options": ["There was green grasslands.", "There were green grasslands.", "There were a big lake.", "There is green grasslands long ago."], "answer": 1, "ex": "grasslands(여럿) + 과거 → There were."}]}, "2": {"passage": "Dear Grandpa,\n\nGreetings from the Amazon rainforest in Brazil! We arrived here four days ago. It is hot and wet every day.\n\nLast week, we were in the city. Now we are in a small lodge by the river. Yesterday, we took a boat trip. Our guide showed us pink river dolphins! They swam right next to our boat. Mom took lots of pictures.\n\nThe rainforest is very loud. I hear birds, frogs, and insects all day and all night. Two days ago, I saw a sloth. It moved so slowly! It hung upside down from a branch and did not care about us.\n\nWe also tried a purple fruit called acai. It tasted sweet and a little sour.\n\nThis morning, it rained for three hours. The guide said it rains almost every day here. That is why the trees are so tall and green.\n\nI miss you. I will show you my photos next month.\n\nLove,\nJun", "speaking": "What nature place do you want to visit? Choose one and give a reason. (20–30 seconds)", "speakStarters": ["I want to visit … .", "I want to see … there.", "I want to go there because … ."], "prompt": "You are on a trip to a nature place. Write a postcard to a friend. Write 4–5 sentences.", "starters": ["Dear …,", "Greetings from … !", "Yesterday, I … .", "Two days ago, … .", "I miss you. Love, …"], "cards": [{"word": "arrive", "form": "arrived", "pos": "v.", "en": "to get to a place", "ko": "도착하다"}, {"word": "wet", "form": "wet", "pos": "adj.", "en": "covered with water", "ko": "젖은, 습한"}, {"word": "lodge", "form": "lodge", "pos": "n.", "en": "a small house for visitors in nature", "ko": "산장, 숙소"}, {"word": "guide", "form": "guide", "pos": "n.", "en": "a person who shows people around a place", "ko": "가이드, 안내인"}, {"word": "dolphin", "form": "dolphins", "pos": "n.", "en": "a smart sea or river animal that looks like a small whale", "ko": "돌고래"}, {"word": "loud", "form": "loud", "pos": "adj.", "en": "making a lot of noise", "ko": "시끄러운, 큰 소리의"}, {"word": "sloth", "form": "sloth", "pos": "n.", "en": "a very slow animal that hangs in trees", "ko": "나무늘보"}, {"word": "branch", "form": "branch", "pos": "n.", "en": "a part of a tree that grows out from the trunk", "ko": "나뭇가지"}, {"word": "miss", "form": "miss", "pos": "v.", "en": "to feel sad because someone is not with you", "ko": "그리워하다"}], "vocab": [["arrive", "The train will arrive at noon.", ["to get lost", "to get to a place", "to stay at home", "to leave a place"], 1, "arrive = 도착하다."], ["wet", "My shoes are wet from the rain.", ["very clean", "very old", "very dry", "covered with water"], 3, "wet = 젖은, 습한."], ["lodge", "We stayed in a lodge in the mountains.", ["a large city building", "a school bus", "a small house for visitors in nature", "a fast boat"], 2, "lodge = 자연 속 작은 숙소."], ["guide", "Our guide told us about the old castle.", ["a person who sells tickets", "a person who shows people around a place", "a person who fixes cars", "a person who cooks food"], 1, "guide = 안내인."], ["dolphin", "The dolphin jumped out of the water.", ["a smart sea or river animal that looks like a small whale", "a big cat in the jungle", "a bird with long legs", "a small insect"], 0, "dolphin = 돌고래."], ["loud", "The music is too loud!", ["very slow", "making a lot of noise", "very soft", "very quiet"], 1, "loud = 시끄러운."], ["sloth", "A sloth sleeps a lot in the trees.", ["a fish with sharp teeth", "a fast cat", "a very slow animal that hangs in trees", "a bird that can talk"], 2, "sloth = 나무늘보."], ["branch", "A bird is sitting on the branch.", ["a seed in a fruit", "a part of a tree that grows out from the trunk", "a leaf on the ground", "the root under the ground"], 1, "branch = 나뭇가지."], ["miss", "I miss my friends from my old school.", ["to be angry at someone", "to meet someone new", "to feel sad because someone is not with you", "to forget about someone"], 2, "miss = 그리워하다."]], "comp": [{"type": "중심 내용", "q": "Why did Jun write this postcard?", "options": ["He wanted to explain how to catch a dolphin.", "He wanted to say he was sick.", "He wanted to tell Grandpa about his trip to the rainforest.", "He wanted to ask Grandpa for money."], "answer": 2, "ex": "할아버지께 아마존 여행 이야기를 전하는 엽서예요."}, {"type": "세부 내용", "q": "What did Jun see on the boat trip?", "options": ["He saw a crocodile.", "He saw a big city.", "He saw a sloth.", "He saw pink river dolphins."], "answer": 3, "ex": "2문단: Yesterday, we took a boat trip… pink river dolphins!"}, {"type": "세부 내용", "q": "When did Jun see the sloth?", "options": ["He saw it two days ago.", "He saw it this morning.", "He saw it last week.", "He saw it yesterday."], "answer": 0, "ex": "3문단: Two days ago, I saw a sloth."}, {"type": "인물의 마음", "q": "How does Jun feel about his trip?", "options": ["He is scared of the animals.", "He is angry because it rains a lot.", "He is bored and wants to go home now.", "He is excited and enjoying it."], "answer": 3, "ex": "느낌표(!)가 많고 본 것을 신나게 이야기해요. 할아버지도 그리워해요."}, {"type": "문맥 속 어휘", "q": "\"Now we are in a small lodge by the river.\" What is a \"lodge\"?", "options": ["It is a kind of boat.", "It is a city park.", "It is a big tree.", "It is a small house for visitors."], "answer": 3, "ex": "lodge = 자연 속 여행자 숙소."}, {"type": "문법 · 과거 시간 표현 (ago, last week, yesterday)", "q": "We arrived here four days ______.", "options": ["yesterday", "ago", "before week", "last"], "answer": 1, "ex": "시간 + ago → four days ago (4일 전에)."}, {"type": "문법 · 과거 시간 표현 (ago, last week, yesterday)", "q": "______ week, we were in the city.", "options": ["Last", "Before", "Yesterday", "Ago"], "answer": 0, "ex": "Last week = 지난주."}, {"type": "문법 · 과거 시간 표현 (ago, last week, yesterday)", "q": "Which sentence is correct?", "options": ["I see a sloth yesterday.", "I saw a sloth ago two days.", "I saw a sloth last day.", "I saw a sloth yesterday."], "answer": 3, "ex": "yesterday는 과거 → saw. ago는 시간 뒤에 와요."}]}, "3": {"passage": "Long ago, a girl named Amira lived in a small village. It was at the edge of the desert. Every morning, she walked a long way to a well to get water for her family.\n\nOne hot summer, the well dried up. The villagers were worried. \"We will have to leave our homes,\" they said. Amira felt scared and sad.\n\nThat night, Amira had a dream. An old woman in the dream said, \"Look under the tallest palm tree.\"\n\nWhen she woke up, Amira ran to the palm tree. She dug and dug in the sand. Her hands hurt, but she did not stop. When the sun was high, the sand felt wet. Then, water bubbled up!\n\nWhen the villagers saw the water, they cheered. They built a new well around it. Amira felt proud and happy.\n\nFrom that day, the people called the well \"Amira's Gift.\" They always shared the water with travelers who passed by.", "speaking": "Could you keep digging like Amira? Choose yes or no and give one reason. (20–30 seconds)", "speakStarters": ["Yes, I could. / No, I couldn't.", "That is because … .", "When I feel tired, I … ."], "prompt": "Write a different ending for the story. What if there was no water under the palm tree? Write 4–5 sentences.", "starters": ["When Amira dug, she found … .", "She felt … .", "Then, … .", "When the villagers saw it, … .", "In the end, … ."], "cards": [{"word": "village", "form": "village", "pos": "n.", "en": "a very small town", "ko": "마을"}, {"word": "edge", "form": "edge", "pos": "n.", "en": "the outside end of a place or thing", "ko": "가장자리, 끝"}, {"word": "worried", "form": "worried", "pos": "adj.", "en": "feeling that something bad may happen", "ko": "걱정하는"}, {"word": "scared", "form": "scared", "pos": "adj.", "en": "afraid", "ko": "무서워하는, 겁먹은"}, {"word": "dream", "form": "dream", "pos": "n.", "en": "pictures and stories in your mind while you sleep", "ko": "꿈"}, {"word": "palm", "form": "palm", "pos": "n.", "en": "a tall tree with big leaves at the top, found in hot places", "ko": "야자나무"}, {"word": "bubble", "form": "bubbled", "pos": "v.", "en": "to come up with small balls of air", "ko": "(거품이) 부글부글 솟아오르다"}, {"word": "share", "form": "shared", "pos": "v.", "en": "to give part of something to others", "ko": "나누다, 함께 쓰다"}, {"word": "traveler", "form": "travelers", "pos": "n.", "en": "a person who goes on a trip", "ko": "여행자, 나그네"}], "vocab": [["village", "My grandma lives in a quiet village.", ["a very big city", "a kind of boat", "a tall building", "a very small town"], 3, "village = 마을."], ["edge", "Don't stand at the edge of the cliff.", ["the top of a tree", "the bottom of a lake", "the middle of something", "the outside end of a place or thing"], 3, "edge = 가장자리."], ["worried", "Mom was worried when I came home late.", ["feeling very sleepy", "feeling very calm", "feeling very full", "feeling that something bad may happen"], 3, "worried = 걱정하는."], ["scared", "The little boy was scared of the dark.", ["very brave", "afraid", "very happy", "very bored"], 1, "scared = 무서운, 겁먹은."], ["dream", "I had a funny dream last night.", ["a song you sing", "a meal you eat", "a game you play", "pictures and stories in your mind while you sleep"], 3, "dream = 꿈."], ["palm", "We sat under a palm tree on the beach.", ["a tall tree with big leaves at the top, found in hot places", "a pine tree in the snow", "a small flower", "a kind of grass"], 0, "palm (tree) = 야자나무 (손바닥이라는 뜻도 있어요)."], ["bubble", "The soup bubbled in the pot.", ["to freeze into ice", "to stay very still", "to come up with small balls of air", "to fall like rain"], 2, "bubble up = 부글부글 솟아오르다."], ["share", "Let's share the pizza.", ["to give part of something to others", "to keep everything for yourself", "to hide something", "to throw something away"], 0, "share = 나누다."], ["traveler", "The traveler was tired after the long walk.", ["a person who sells water", "a person who stays at home", "a person who goes on a trip", "a person who builds wells"], 2, "traveler = 여행자."]], "comp": [{"type": "중심 내용", "q": "What is the story mainly about?", "options": ["A girl travels to a big city.", "An old woman builds a well.", "Villagers plant palm trees.", "A girl finds water for her village."], "answer": 3, "ex": "마을의 우물이 마르자 아미라가 물을 찾아내는 이야기예요."}, {"type": "세부 내용", "q": "Why were the villagers worried?", "options": ["Amira was lost.", "The palm tree fell down.", "The well dried up.", "A storm came."], "answer": 2, "ex": "2문단: the well dried up. The villagers were worried."}, {"type": "세부 내용", "q": "Where did Amira dig?", "options": ["She dug in the old well.", "She dug under the tallest palm tree.", "She dug next to her house.", "She dug near the river."], "answer": 1, "ex": "3–4문단: Look under the tallest palm tree. → Amira ran to the palm tree."}, {"type": "인물의 마음 변화", "q": "How did Amira's feelings change in the story?", "options": ["She was scared and sad at first, but later she was proud and happy.", "She felt the same the whole time.", "She was angry at first, but later she was sleepy.", "She was happy at first, but later she was sad."], "answer": 0, "ex": "2문단 scared and sad → 5문단 proud and happy."}, {"type": "문맥 속 어휘", "q": "\"Then, water bubbled up!\" What does \"bubbled up\" mean?", "options": ["The water came up from the ground.", "The water turned into ice.", "The water dried up.", "The water fell from the sky."], "answer": 0, "ex": "bubble up = 땅속에서 물이 부글부글 솟아오르다."}, {"type": "문법 · when + 과거 (When she saw…)", "q": "When she ______ up, Amira ran to the palm tree.", "options": ["wake", "woke", "wakes", "waking"], "answer": 1, "ex": "이야기는 과거 → When + 과거(woke)."}, {"type": "문법 · when + 과거 (When she saw…)", "q": "______ the villagers saw the water, they cheered.", "options": ["Where", "When", "What", "Who"], "answer": 1, "ex": "~했을 때 → When."}, {"type": "문법 · when + 과거 (When she saw…)", "q": "Which sentence is correct?", "options": ["When saw I the rain, I was happy.", "When I saw the rain, I am happy yesterday.", "When I saw the rain, I was happy.", "When I see the rain yesterday, I was happy."], "answer": 2, "ex": "When + 주어 + 과거동사, 주어 + 과거동사."}]}, "4": {"passage": "What did people write with before pencils? Long ago, people used to write with feathers. They dipped the feathers in ink. It was slow and messy.\n\nIn the 1500s, people in England found a soft, black rock in the ground. People called it graphite. It made dark marks on paper. At first, people used to wrap the graphite in string or sheepskin. That way, their hands stayed clean.\n\nLater, people put the graphite inside wood. This made the pencil strong and easy to hold.\n\nIn 1795, a French man had a new idea. His name was Nicolas-Jacques Conté. He mixed graphite with clay. With more clay, the pencil was harder and its lines were lighter. With less clay, it was softer and its lines were darker. We still make pencils this way today!\n\nIn 1858, an American man put an eraser on the end of a pencil. Now people could fix mistakes easily.\n\nToday, the pencil is cheap and simple. But it is still one of the most useful tools in the world.", "speaking": "Which invention are you most thankful for? Choose one and give a reason. (20–30 seconds)", "speakStarters": ["I am most thankful for … .", "I use it every day to … .", "Without it, … ."], "prompt": "Write about an invention you can't live without. Write 4–5 sentences.", "starters": ["I can't live without … .", "People used to … .", "Now, we … .", "It is useful because … .", "I am thankful for it."], "cards": [{"word": "feather", "form": "feathers", "pos": "n.", "en": "one of the soft, light things that cover a bird's body", "ko": "깃털"}, {"word": "dip", "form": "dipped", "pos": "v.", "en": "to put something into a liquid quickly", "ko": "살짝 담그다"}, {"word": "ink", "form": "ink", "pos": "n.", "en": "a colored liquid for writing or printing", "ko": "잉크"}, {"word": "messy", "form": "messy", "pos": "adj.", "en": "dirty and not neat", "ko": "지저분한, 엉망인"}, {"word": "graphite", "form": "graphite", "pos": "n.", "en": "a soft, black rock used inside pencils", "ko": "흑연"}, {"word": "wrap", "form": "wrap", "pos": "v.", "en": "to cover something with paper or cloth", "ko": "감싸다, 포장하다"}, {"word": "clay", "form": "clay", "pos": "n.", "en": "soft, sticky earth that gets hard when it dries", "ko": "점토, 찰흙"}, {"word": "eraser", "form": "eraser", "pos": "n.", "en": "a small rubber thing that takes away pencil marks", "ko": "지우개"}, {"word": "mistake", "form": "mistakes", "pos": "n.", "en": "something that is wrong", "ko": "실수"}], "vocab": [["feather", "I found a white feather in the park.", ["one of the soft, light things that cover a bird's body", "a hard shell", "a sharp tooth", "a long tail"], 0, "feather = 깃털."], ["dip", "Dip the cookie in the milk.", ["to throw something away", "to fold something", "to keep something dry", "to put something into a liquid quickly"], 3, "dip = (액체에) 살짝 담그다."], ["ink", "My pen is out of ink.", ["a colored liquid for writing or printing", "a soft cloth", "a kind of paper", "a type of rock"], 0, "ink = 잉크."], ["messy", "My desk is very messy.", ["small and light", "clean and neat", "new and shiny", "dirty and not neat"], 3, "messy = 지저분한."], ["graphite", "Pencil lead is really graphite.", ["a type of ink", "a soft, black rock used inside pencils", "a kind of wood", "a sweet candy"], 1, "graphite = 흑연. 연필심이에요."], ["wrap", "We wrap the gift in colorful paper.", ["to cover something with paper or cloth", "to open something", "to wash something", "to break something"], 0, "wrap = 감싸다."], ["clay", "We made a bowl out of clay.", ["clear glass", "thin paper", "soft, sticky earth that gets hard when it dries", "hard metal"], 2, "clay = 점토."], ["eraser", "Can I borrow your eraser?", ["a small rubber thing that takes away pencil marks", "a tool for cutting paper", "a ruler for drawing lines", "a pen with blue ink"], 0, "eraser = 지우개."], ["mistake", "I made a mistake on my test.", ["something that is wrong", "a good idea", "a nice gift", "a right answer"], 0, "mistake = 실수."]], "comp": [{"type": "중심 내용", "q": "What is the passage mainly about?", "options": ["It is about how birds use feathers.", "It is about the history of the pencil.", "It is about how to make clay bowls.", "It is about rocks in England."], "answer": 1, "ex": "깃털 펜에서 오늘날 연필까지, 연필이 바뀌어 온 이야기예요."}, {"type": "세부 내용", "q": "What did people use to write with long ago?", "options": ["They used to write with feathers and ink.", "They used to write with sheepskin.", "They used to write with clay.", "They used to write with erasers."], "answer": 0, "ex": "1문단: people used to write with feathers. They dipped the feathers in ink."}, {"type": "세부 내용", "q": "What did Conté mix with graphite?", "options": ["He mixed it with clay.", "He mixed it with wood.", "He mixed it with string.", "He mixed it with ink."], "answer": 0, "ex": "4문단: He mixed graphite with clay."}, {"type": "시간 순서와 변화", "q": "Which happened FIRST?", "options": ["People in England found graphite.", "People put graphite inside wood.", "Conté mixed graphite with clay.", "An American man put an eraser on a pencil."], "answer": 0, "ex": "1500s 흑연 발견 → 나무 → 1795 점토 → 1858 지우개."}, {"type": "문맥 속 어휘", "q": "\"It was slow and messy.\" What does \"messy\" mean?", "options": ["It means dirty and not neat.", "It means very quiet.", "It means very fast.", "It means very cheap."], "answer": 0, "ex": "messy = 잉크가 묻어 지저분한."}, {"type": "문법 · used to (기초)", "q": "Long ago, people ______ write with feathers.", "options": ["used", "use to", "using to", "used to"], "answer": 3, "ex": "예전에 ~하곤 했다 → used to + 동사원형."}, {"type": "문법 · used to (기초)", "q": "I used to ______ a tricycle, but now I ride a bike.", "options": ["riding", "ride", "rides", "rode"], "answer": 1, "ex": "used to + 동사원형(ride)."}, {"type": "문법 · used to (기초)", "q": "Which sentence is correct?", "options": ["We used to living in Seoul.", "We used live in Seoul.", "We used to live in Seoul.", "We use to lived in Seoul."], "answer": 2, "ex": "used to + 동사원형 → used to live."}]}, "5": {"passage": "Can a bridge made of paper hold coins? Try this simple experiment and find out!\n\nYou will need two paper cups, one sheet of paper, twenty coins, and a ruler.\n\nFirst, put the two cups upside down on a table. Leave a space of about fifteen centimeters between them.\n\nNext, lay the flat sheet of paper across the cups. This is your bridge. Put one coin on the middle of the bridge and watch closely. What happens? The paper bends, and the coin falls to the table!\n\nAfter that, take the paper and fold it like a fan. Make many small folds. Then put the folded paper across the cups again.\n\nNow, add coins one by one. Count them carefully. How many coins can your bridge hold this time?\n\nWhy does it work? The folds make the paper much stronger. Real bridges use the same idea. Builders use special shapes to make bridges strong without making them too heavy.", "speaking": "What will you do if your experiment fails? Choose one idea and give a reason. (20–30 seconds)", "speakStarters": ["If my experiment fails, I will … .", "That is because … .", "I will not give up!"], "prompt": "Write the steps for a simple experiment or craft you know. Write 4–5 sentences.", "starters": ["You will need … .", "First, … .", "Next, … .", "After that, … .", "Finally, … ."], "cards": [{"word": "bridge", "form": "bridge", "pos": "n.", "en": "a thing built over a river or road so people can cross", "ko": "다리"}, {"word": "experiment", "form": "experiment", "pos": "n.", "en": "a test you do to learn something", "ko": "실험"}, {"word": "coin", "form": "coins", "pos": "n.", "en": "a small, round piece of metal money", "ko": "동전"}, {"word": "space", "form": "space", "pos": "n.", "en": "an empty area between things", "ko": "공간, 간격"}, {"word": "lay", "form": "lay", "pos": "v.", "en": "to put something down flat", "ko": "(평평하게) 놓다"}, {"word": "bend", "form": "bends", "pos": "v.", "en": "to become curved, not straight", "k ng her room. Toys, socks, and books were always on the floor. \"I need a machine to clean for me,\" she said.\n\nOn Saturday, Mina was building her machine in the garage. She was using a toy car, a small fan, and an old vacuum cleaner. Her little brother Ben was watching her.\n\nWhen she turned it on, the machine roared. It was moving fast, but it was going in the wrong direction! It was blowing the socks into the air. It was pushing the books under the bed. Paper was flying everywhere.\n\n\"Stop!\" Ben shouted. He was laughing so hard. Mina pulled the plug. Her room was messier than before.\n\nMina sat down and looked at her machine. \"The problem is the fan,\" she said. \"It is blowing, not pulling.\"\n\nShe took off the fan and turned the vacuum around. Then she tried again. This time, the machine picked up three socks and a crayon.\n\n\"It's not perfect,\" Mina said, \"but it's a good start!\"", "speaking": "What machine do you want to invent? Choose one and give a reason. (20–30 seconds)", "speakStarters": ["I want to invent a … .", "It will … .", "I need it because … ."], "prompt": "Describe a machine you want to make. What does it do? Write 4–5 sentences.", "starters": ["I want to make a … machine.", "It can … .", "I will use … to build it.", "It will help me because … .", "It will be … !"], "cards": [{"word": "hate", "form": "hated", "pos": "v.", "en": "to not like something at all", "ko": "몹시 싫어하다"}, {"word": "garage", "form": "garage", "pos": "n.", "en": "a building or room where you keep a car", "ko": "차고"}, {"word": "vacuum", "form": "vacuum", "pos": "n.", "en": "a machine that sucks up dirt from the floor", "ko": "진공청소기"}, {"word": "roar", "form": "roared", "pos": "v.", "en": "to make a very loud, deep noise", "ko": "굉음을 내다, 으르렁거리다"}, {"word": "direction", "form": "direction", "pos": "n.", "en": "the way something is moving or pointing", "ko": "방향"}, {"word": "blow", "form": "blowing", "pos": "v.", "en": "to move air hard and fast", "ko": "(바람이) 불다, 날리다  [{"type": "중심 내용", "q": "What is the story mainly about?", "options": ["Two kids play with a toy car.", "A girl cleans the garage.", "A girl tries to build a machine to clean her room.", "A boy buys a new vacuum cleaner."], "answer": 2, "ex": "방 청소를 대신할 기계를 만드는 미나의 이야기예요."}, {"type": "세부 내용", "q": "What was Ben doing while Mina was building the machine?", "options": ["He was building a car.", "He was cleaning his room.", "He was watching her.", "He was sleeping."], "answer": 2, "ex": "2문단: Her little brother Ben was watching her."}, {"type": "문제와 해결", "q": "What was the problem with the machine?", "options": ["The fan was blowing, not pulling.", "It had no wheels.", "It was too quiet.", "It was too small."], "answer": 0, "ex": "5문단: The problem is the fan… It is blowing, not pulling."}, {"type": "인물의 마음", "q": "How did Mina feel at the end of the story?", "options": ["She felt sad and cried.", "She felt hopeful about her machine.", "She felt bored.", "She felt angry and wanted to stop."], "answer": 1, "ex": "마지막: It's not perfect, but it's a good start! 희망적인 마음이에요."}, {"type": "문맥 속 어휘", "q": "\"When she turned it on, the machine roared.\" What does \"roared\" mean?", "options": ["It stopped working.", "It became very small.", "It started to smile.", "It made a very loud noise."], "answer": 3, "ex": "roar = 크고 낮은 소리를 내다."}, {"type": "문법 · 과거진행형 (was / were + -ing)", "q": "Ben ______ her when the machine started.", "options": ["were watching", "was watching", "is watching", "watching"], "answer": 1, "ex": "과거 그때 하고 있던 일 + Ben(한 명) → was watching."}, {"type": "문법 · 과거진행형 (was / were + -ing)", "q": "The socks ______ in the air.", "options": ["was flying", "is flying", "were flying", "flying"], "answer": 2, "ex": "The socks(여럿) → were flying."}, {"type": "문법 · 과거진행형 (was / were + -ing)", "q": "Which sentence is correct?", "options": ["She building a machine.", "She was building a machine.", "She were building a machine.", "She was build a machine."], "answer": 1, "ex": "was/were + 동사-ing."}]}, "7": {"passage": "Do you yawn when someone near you yawns? Yawns can spread from person to person. Scientists say that kindness is contagious, too!\n\nWhen people see an act of kindness, they often want to be kind too. Then other people see them and do the same. One small act can travel through a whole group, like a ripple in a pond.\n\nSo how can you start a kindness ripple? Here are some ideas.\n\nYou should smile at people and say hello. You should help a classmate who drops their books. You should share your snacks or your colored pencils. Small things are important.\n\nYou shouldn't laugh at someone's mistakes. You shouldn't leave anyone out of a game. These things can make people feel lonely.\n\nBeing kind is good for you, too. Many people feel happier after they help someone.\n\nTry it this week. Do one kind thing every day. Then watch how far your kindness goes!", "speaking": "Tell about a kind thing someone did for you recently. Say why it made you happy. (20–30 seconds)", "speakStarters": ["Recently, … was kind to me.", "He / She … .", "It made me happy because … ."], "prompt": "How can we spread kindness at school? Write 4–5 sentences. Use should and shouldn't.", "starters": ["We can spread kindness at school.", "We should … .", "We should also … .", "We shouldn't … .", "Kindness is important because … ."], "cards": [{"word": "contagious", "form": "contagious", "pos": "adj.", "en": "able to spread from one person to another", "ko": "전염되는, 옮는"}, {"word": "yawn", "form": "yawn", "pos": "v.", "en": "to open your mouth wide when you are tired", "ko": "하품하다"}, {"word": "spread", "form": "spread", "pos": "v.", "en": "to move to more people or places", "ko": "퍼지다"}, {"word": "act", "form": "act", "pos": "n.", "en": "something that you do", "ko": "행동"}, {"word": "ripple", "form": "ripple", "pos": "n.", "en": "a small wave that moves out in a circle on water", "ko": "잔물결"}, {"word": "classmate", "form": "classmate", "pos": "n.", "en": "a should to share your snacks."], "answer": 0, "ex": "should + 동사원형."}]}, "8": {"passage": "Dear Advice Owl,\nMy best friend Lily and I had a big fight yesterday. She wanted to play tag, but I wanted to play soccer. I said, \"Your games are boring!\" Now she won't talk to me, and I really miss her. What should I do?\nFrom, Sad in Seoul\n\nDear Sad in Seoul,\nI'm sorry you feel sad, but fights happen even between best friends. The good news is that you can fix this.\n\nFirst, think about how Lily felt. Your words probably hurt her feelings. Why don't you say sorry to her? You could say, \"I'm sorry I called your games boring. That wasn't kind.\"\n\nNext, you could make a plan together, so why don't you take turns? You could play tag on Monday and soccer on Tuesday.\n\nFinally, listen to her. She may want to tell you how she felt.\n\nGood friends don't always agree. But they always try to understand each other.\nHoot hoot,\nAdvice Owl", "speaking": "What do you do when you have a fight with a friend? Choose one thing and give a reason. (20–30 seconds)", "speakStarters": ["When I have a fight with a friend, I … .", "I do this because … .", "Then we … ."], "prompt": "Read this problem: \"My friend never shares his toys.\" Write a reply to give advice. Write 4–5 sentences.", "starters": ["Dear …,", "I'm sorry you … .", "Why don't you … ?", "You could also … .", "From, …"], "cards": [{"word": "advice", "form": "Advice", "pos": "n.", "en": "ideas that help someone decide what to do", "ko": "조언"}, {"word": "fight", "form": "fight", "pos": "n.", "en": "an angry argument", "ko": "싸움, 다툼"}, {"word": "boring", "form": "boring", "pos": "adj.", "en": "not interesting", "ko": "지루한"}, {"word": "fix", "form": "fix", "pos": "v.", "en": "to make something good or working again", "ko": "고치다, 바로잡다"}, {"word": "hurt", "form": "hurt", "pos": "v.", "en": "to make someone feel pain or sadness", "ko": "아프게 하다, 상처 주다"}, {"word": "feeling", "form": "feelings", "pos": "n.", "en": "something you f e": "Today was the hardest day of my life. It was my first day at a new school.\n\nMy family moved from Busan last month. At my old school, I had the best friends in the world. Here, I didn't know anyone. I was so nervous. The building was the biggest school in the city, and I got lost two times.\n\nAt lunch, I sat alone. I was the quietest kid in the room. I looked at my sandwich and tried not to cry.\n\nThen a girl with a big smile sat next to me. \"Hi, I'm Yuna,\" she said. \"Do you want to play with us after lunch?\"\n\nWe played catch with four other kids. Yuna is the fastest runner in our class. A boy named Max told the funniest jokes. I laughed so much that I forgot about being sad.\n\nAfter school, Mom asked, \"How was your day?\" The morning was the worst part. But the afternoon was the best part.\n\nTomorrow, I want to find someone who is sitting alone. I know how that feels now.", "speaking": "How can you help a new student at school? Choose one way and give a reason. (20–30 seconds)", "speakStarters": ["I can help a new student.", "I can … .", "This will help because … ."], "prompt": "Imagine you are a new student. Write a diary entry about your first day. Write 4–5 sentences.", "starters": ["Today was my first day at … .", "In the morning, I felt … .", "The best part was … .", "The worst part was … .", "Tomorrow, I want to … ."], "cards": [{"word": "nervous", "form": "nervous", "pos": "adj.", "en": "a little scared about something new", "ko": "긴장한, 불안한"}, {"word": "building", "form": "building", "pos": "n.", "en": "a structure with walls and a roof, like a house or school", "ko": "건물"}, {"word": "alone", "form": "alone", "pos": "adv.", "en": "without other people", "ko": "혼자"}, {"word": "quiet", "form": "quietest", "pos": "adj.", "en": "making very little noise", "ko": "조용한"}, {"word": "cry", "form": "cry", "pos": "v.", "en": "to have tears come from your eyes", "ko": "울다"}, {"word": "runner", "form": "runner", "pos": "n.", "en": "a person who runs", "k

<title>Olive Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one calm reading desk — app bar on top, a single centered column (max 1080px), cards only for working surfaces */
:root{
  --bg:#F5F1E7; --surface:#FFFFFF; --sunk:#FBF8F1; --ink:#20365A; --muted:#66708A; --line:#E3DCCC;
  --accent:#3E8C63; --accent-ink:#FFFFFF; --accent-soft:#E3EFE6; --primary:#20365A; --on-primary:#FFFFFF;
  --warn:#C2452D; --warn-soft:#FBE7E2; --gold:#9A7410; --gold-soft:#FAF1D6; --navy-soft:#E7ECF4; --hl:#FCE7E2; --hl-ink:#B33A24;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121821; --surface:#1A2230; --sunk:#161D29; --ink:#E6EBF2; --muted:#9CA6B8; --line:#2B3546;
  --accent:#5CBB8A; --accent-ink:#0E1A13; --accent-soft:#1D3327; --primary:#E6EBF2; --on-primary:#121821;
  --warn:#EF8A73; --warn-soft:#3A221D; --gold:#E3C35E; --gold-soft:#352D18; --navy-soft:#212C3D; --hl:#3B2420; --hl-ink:#F2A08C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --surface:#1A2230; --sunk:#161D29; --ink:#E6EBF2; --muted:#9CA6B8; --line:#2B3546;
  --accent:#5CBB8A; --accent-ink:#0E1A13; --accent-soft:#1D3327; --primary:#E6EBF2; --on-primary:#121821;
  --warn:#EF8A73; --warn-soft:#3A221D; --gold:#E3C35E; --gold-soft:#352D18; --navy-soft:#212C3D; --hl:#3B2420; --hl-ink:#F2A08C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
.brand{font-weight:900;font-size:16px;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.navy{background:var(--primary);color:var(--on-primary)}
.sp{flex:1}
.link{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
main{max-width:1080px;transition:max-width .2s;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
h1{font-size:clamp(24px,3.4vw,32px);font-weight:900;line-height:1.25;margin:4px 0 6px;text-wrap:balance;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:20px;font-weight:900;margin:0;text-wrap:balance}
h3{font-size:17px;font-weight:700;margin:0}
.sub{color:var(--muted);margin:0}
.small{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:700;font-size:14px;background:var(--primary);color:var(--on-primary)}
.btn.g{background:var(--accent);color:var(--accent-ink)}
.btn.o{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.w{background:var(--warn);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.stat .v i{font-style:normal;font-size:13px;color:var(--muted);font-weight:500}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.meter div{height:100%;background:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-ok{background:var(--accent-soft);color:var(--accent)}.t-wait{background:var(--gold-soft);color:var(--gold)}.t-no{background:var(--navy-soft);color:var(--muted)}.t-red{background:var(--warn-soft);color:var(--warn)}
.unit{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px 20px}
.unit.locked{background:var(--sunk);color:var(--muted)}
.unit .ttl{font-size:17px;font-weight:900;color:var(--ink)}
.unit.locked .ttl{color:var(--muted)}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.tbl .btn,.tbl .tag{white-space:nowrap}
.ugrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.ugrid{grid-template-columns:1fr}}
.lvsum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}.lvsum b{color:var(--ink);font-weight:700}
.pgap{display:block;height:12px}
body.wide main,body.wide .bar-in{max-width:1360px}
.ulay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.ulay .pcol{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.ulay .pcol .passage{font-size:17px;line-height:1.85;max-width:none}
.ulay .tabs .tab{min-width:0;font-size:14px;padding:14px 4px}
@media (max-width:900px){.ulay{grid-template-columns:1fr}.ulay .pcol{position:static;max-height:none}}
.fc .acts .btn.ok{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.need{font-size:12.5px;color:var(--muted);text-align:center}
.fc{border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:250px;justify-content:center}
.fc .w{font-family:var(--f-read);font-size:40px;font-weight:600;line-height:1.1}
.fc .pos{font-size:13px;color:var(--muted);font-style:italic}
.fc .en{font-family:var(--f-read);font-size:19px;line-height:1.5;max-width:46ch}
.fc .ko{font-size:18px;font-weight:700;color:var(--accent)}
.fc.back{background:var(--accent-soft);border-color:var(--accent)}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.wlist button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;font-size:14px}
.wlist button b{font-family:var(--f-read);font-size:16px}
.wlist button.d{border-color:var(--accent);background:var(--accent-soft)}
.st{border:1px solid var(--line);border-radius:9px;padding:6px 4px;text-align:center;font-size:11.5px;background:var(--sunk);color:var(--muted)}
.st b{display:block;font-size:12px}
.st.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.zoom{display:flex;gap:14px;align-items:center;background:var(--accent-soft);border-radius:var(--r);padding:16px 20px}
.zoom .ic{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;flex:none}
.passage{font-family:var(--f-read);font-size:18px;line-height:1.9;margin:10px 0 0;max-width:72ch}
.tw{border-radius:4px;transition:background .12s;cursor:pointer}
.tw.ts{background:var(--accent-soft)}
.tw.tc{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold);color:var(--ink)}
.vw{background:var(--hl);color:var(--hl-ink);font-weight:600;padding:0 4px;border-radius:5px}
.mis{color:var(--warn);text-decoration:underline wavy var(--warn);text-underline-offset:5px;font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:-22px -24px 22px;overflow-x:auto}
.tab{flex:1;min-width:120px;background:none;border:0;border-bottom:3px solid transparent;padding:15px 8px;font-weight:700;color:var(--muted)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab span{font-size:11px;font-weight:500;background:var(--navy-soft);border-radius:5px;padding:2px 6px;margin-left:5px}
.q{font-size:19px;font-weight:700;margin:6px 0 14px}
.qsent{font-family:var(--f-read);font-size:20px;line-height:1.6;margin:6px 0 16px}
.qsent u{text-decoration:none;border-bottom:3px solid var(--gold);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:15px}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--sunk);border:1px solid var(--line)}
.opt.sel{border-color:var(--primary);background:var(--navy-soft)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;background:var(--accent-soft);font-size:14px}
.fb.bad{background:var(--warn-soft)}
.dots{display:flex;gap:5px}.dots i{width:20px;height:6px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--accent)}.dots i.x{background:var(--warn)}.dots i.c{background:var(--primary)}
.prompt{background:var(--gold-soft);border-radius:var(--r);padding:16px 20px}
.prompt ul{margin:10px 0 0;padding-left:16px;border-left:3px solid var(--gold);list-style:none}
.prompt li{font-style:italic;font-family:var(--f-read);color:var(--gold)}
textarea,input[type=text],input[type=password],select{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px}
textarea{min-height:180px;font-family:var(--f-read);font-size:17px;line-height:1.8;resize:vertical}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.rec{border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--sunk);display:flex;flex-direction:column;gap:10px}
.rec.done{background:var(--surface);border-color:var(--accent)}
.qbox{border-left:4px solid var(--gold);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:700;font-family:var(--f-read);font-size:17px}
.note{background:var(--navy-soft);border-radius:12px;padding:12px 16px;font-size:13.5px}
.sent-w{background:var(--warn-soft);border-radius:12px;padding:12px 16px}
.sent-f{background:var(--accent-soft);border-radius:12px;padding:12px 16px}
.lab{font-size:11.5px;font-weight:700;margin-bottom:2px}
.sent-w .lab{color:var(--warn)}.sent-f .lab{color:var(--accent)}
.s{font-family:var(--f-read);font-size:18px;line-height:1.7}
.del{color:var(--warn);text-decoration:underline wavy var(--warn);text-underline-offset:4px;font-weight:600}
.add{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 3px;font-weight:600}
.why{margin-top:8px;font-size:13.5px;background:var(--surface);border-radius:8px;padding:8px 12px}
.preview{border:1.5px dashed var(--line);border-radius:12px;padding:14px 18px;font-family:var(--f-read);font-size:16px;line-height:1.8;background:var(--sunk)}
.preview .pend{color:var(--muted)}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.ladder span{font-size:12px;font-weight:700;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums}
.ladder .d{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.ladder .c{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ladder .x{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.short{font-family:var(--f-read);font-size:18px;line-height:1.85;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.badge{width:150px;height:150px;border-radius:28px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;text-align:center;padding:10px}
.badge small{font-size:11px;font-weight:700;letter-spacing:.08em}
.badge b{font-size:24px;font-weight:900;line-height:1.15}
.bars{display:grid;gap:10px}
.br{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;font-size:14px}
.br .tr{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.br .tr div{height:100%;border-radius:5px;background:var(--accent)}
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;font-size:12.5px}
.rule span{border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:center;color:var(--muted)}
.rule span.on{border:2px solid var(--accent);color:var(--accent);font-weight:700}
.tside{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:start}
.tside>*{min-width:0}
.tnav{display:flex;flex-direction:column;gap:4px;position:sticky;top:80px}
.tnav button{text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:700;color:var(--muted)}
.tnav button.on{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--sunk)}
.sq{display:flex;gap:4px}.sq i{width:13px;height:13px;border-radius:4px;background:var(--line)}.sq i.d{background:var(--accent)}.sq i.p{background:var(--gold)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:var(--f-read);font-size:15.5px;line-height:1.85}
.col h5{font-family:var(--f-ui);font-size:12px;margin:0 0 6px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:9}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.door{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:22px}
.door h3{font-size:19px;font-weight:900}
.pin{letter-spacing:.4em;font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:760px){.tside{grid-template-columns:1fr}.tnav{flex-direction:row;overflow-x:auto;position:static}.tnav button{white-space:nowrap}.steps{grid-template-columns:repeat(2,1fr)}.br{grid-template-columns:90px 1fr 44px}.passage{font-size:17px}}

/* ---------- landing (home) ---------- */
body.home main{max-width:none;padding:0}
body.home .bar-in{max-width:1160px}
.lw{max-width:1160px;margin:0 auto;padding-inline:20px}
.lnav{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.lnav button{background:none;border:0;padding:8px 10px;font-size:14px;font-weight:500;color:var(--muted);border-radius:8px}
.lnav button:hover{color:var(--ink);background:var(--sunk)}
.lhero{background:linear-gradient(180deg,var(--surface) 0%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.lhero .lw{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,420px);gap:48px;align-items:center;padding-block:72px 80px}
.lhero h1{font-size:clamp(32px,5vw,52px);line-height:1.15;margin:12px 0 18px;letter-spacing:-.03em}
.lhero .lead{font-size:17px;color:var(--muted);max-width:52ch;margin:0 0 26px;line-height:1.7}
.lkicker{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px}
.lfacts{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.lfacts div b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lfacts div span{font-size:13px;color:var(--muted)}
.lbtn{padding:14px 24px;font-size:15px;border-radius:12px}
.login{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 18px 50px -24px rgba(32,54,90,.35);display:flex;flex-direction:column;gap:12px}
.login h3{font-size:22px;font-weight:900}
.lsec{padding-block:88px}
.lsec.alt{background:var(--surface);border-block:1px solid var(--line)}
.lhead{max-width:640px;margin-bottom:40px}
.lhead h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.02em;line-height:1.25;margin:10px 0 12px}
.lhead p{color:var(--muted);margin:0;font-size:16px;line-height:1.7}
.lsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.lstep{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.lsec.alt .lstep{background:var(--bg)}
.lstep.coach{background:var(--accent-soft)!important;border-color:var(--accent)}
.lstep .no{font-family:var(--f-read);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.lstep h4{margin:4px 0 0;font-size:16px;font-weight:900}
.lstep p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.65}
.lfeat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.lfeat .f{padding:26px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.lfeat .f .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft);margin-bottom:14px}
.lfeat .f h4{margin:0 0 6px;font-size:17px;font-weight:900}
.lfeat .f p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.lunits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lu{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.lu .n{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.lu b{font-family:var(--f-read);font-size:17px;font-weight:600;line-height:1.35}
.lu.open{border-color:var(--accent)}

my was in ice for thousands of years. It was preserved well in ice. That is why scientists have been able to learn a lot from Ötzi’s ancient body. \n\nScientists studied the body of Ötzi and found out many things about his body condition when he died. At his death, Ötzi was about 45 years old, an old man in his time. He was in poor health. His lungs were black, and he had worm eggs inside his stomach, which probably made him ill. His bones were weak, especially in his shoulders, knees, and ankles. \n\nStudying Ötzi's body helps scientists understand life back then. Scientists found clothing and equipment that show Ötzi was an important man. Studies of his teeth tell scientists where he lived. They even learned that Ötzi had eaten just two hours before he died. \n\nWhat scientists cannot fully understand is Ötzi’s death. After much testing, they learned that somebody killed Ötzi. They found an arrowhead in his left shoulder that caused bleeding. He also had a head injury. Scientists have a lot of information, but there are still questions. Why was Ötzi in the mountains? Why was he killed? Perhaps we’ll never know the answer.\n\n\n[Guess What!]\nIn 2013, scientists had also found 19 people who are descendants of Ötzi. They were still living in the region of Austria near where his body was found.", "speaking": "If you were a scientist, what would you want to learn from an ancient mummy?", "speakStarters": ["I would want to learn …", "I'm curious about this because …", "It would help us understand …"], "prompt": "Write about Ötzi. What do scientists know about him, and what is still a mystery? Write 4–6 sentences.", "starters": ["Ötzi is a … that was found in …", "Scientists know that …", "However, they still don't know …", "I think …"], "cards": [{"word": "discovery", "form": "discovery", "pos": "", "en": "the act of finding something for the first time", "ko": "발견"}, {"word": "mummy", "form": "mummy", "pos": "", "en": "a dead body kept unusually well", "ko": "미라"}, {" y go for a walk. Get outside.\n\nBefore you exercise, make sure you stretch. If your ankles, knees, or wrists are weak, you can injure them easily. Regular stretching helps make these body parts strong.\n\nGet enough sleep. Try to sleep at least nine hours each night. Healthy sleep strengthens your immune system. It helps you fight off infections and keeps you healthy. \n\nMake sure you eat different types of healthy foods. Don’t forget to include lots of fruit and vegetables. Drink lots of water to keep your body hydrated, especially when you’re exercising or outside in the sun!\n\nBe careful of what you put in your school bag! Too many books can give you a backache. Try to take only two or three books home at a time. Leave anything you don’t need at school. \n\nMake sure you get a medical checkup every year. Even if you don’t feel ill, it’s important that your doctor sees you. The doctor might discover a problem that you didn’t know about. You should also consult your doctor about things like trying new sports.", "speaking": "Which healthy habit from the passage do you already have? Which one do you need?", "speakStarters": ["I already …", "But I need to …", "I will try to …"], "prompt": "Write your own plan to live healthy. Choose three tips and explain how you will follow them. Write 4–6 sentences.", "starters": ["To live healthy, I will …", "First, …", "Second, …", "Finally, …"], "cards": [{"word": "stretch", "form": "stretch", "pos": "", "en": "to make one’s arms or legs straight", "ko": "스트레칭을 하다"}, {"word": "wrist", "form": "wrists", "pos": "", "en": "the part of the body between the hand and the arm", "ko": "손목"}, {"word": "strengthen", "form": "strengthens", "pos": "", "en": "to make stronger", "ko": "강화하다"}, {"word": "immune system", "form": "immune system", "pos": "phr.", "en": "the system in someone’s body that helps it fight against diseases", "ko": "면역 체계"}, {"word": "infection", "form": "infections", "pos": "", "en": "a disease caused by bacteria or  come from?", "options": ["trash", "oil and gas", "rainwater", "the sun and wind"], "answer": 3, "ex": "the park's energy came from the sun and wind."}, {"type": "추론", "q": "What can visitors learn at the environmental center?", "options": ["how to train a baseball team", "how Hong Kong handles trash", "how to play football", "how to build a park"], "answer": 1, "ex": "an environmental center to teach visitors about how Hong Kong handles trash"}]}, "11": {"passage": "Why do people drink water from plastic bottles? Some think it’s cleaner than tap water. Others think it’s easier to carry. But do you know the effects of buying water in plastic bottles? Once you do, you may never buy it again! \n\n• First, we need a lot of oil to make plastic products. Oil is a source of energy, and we depend on it for lots of things. In fact, the oil we use for a year’s worth of water bottles could fill the tanks of 1 million cars. \n• Second, plastic bottles pollute the environment. If we recycled all our plastic bottles, there would be less garbage in landfills. But people still throw away lots of plastic and much of it goes into the sea—over 5 million tons each year. Plastic is destroying the ocean’s ecosystem by making seabirds and animals sick. Seabirds often eat plastic from the ocean by mistake. To them, the plastic looks like and even smells like food.\n• Third, let’s think about cost. Tap water is almost free, but bottled water costs money. It costs a lot more than tap water for sure, and some bottled water is just tap water sold in a bottle! In fact, one report shows that 47 percent of bottled water is from the tap. That’s almost half!\n\nSo, the next time you feel thirsty, stop and think. Should you buy a bottle of water or get a glass of tap water instead? Your actions make a difference.\n\n\n[Guess What!]\nThe next time you feel thirsty, would you drink tap water or buy a bottle of water? Why?", "speaking": "The next time you feel thirsty, would you drink tap water or buy ies can pollute rivers with chemicals.", ["to plant trees near water", "to catch fish", "to clean water carefully", "to make air, water, or land dirty and harmful to living things"], 3, "pollute = 오염시키다."], ["ecosystem", "Every animal is important in the forest ecosystem.", ["a community of living things and their environment", "a list of dangerous animals", "a large building for animals", "a kind of computer system"], 0, "ecosystem = 생태계."], ["seabird", "A seabird flew over the waves looking for fish.", ["a small island", "a bird that lives near the sea", "a fish that can jump out of water", "a boat with white sails"], 1, "seabird = 바닷새."], ["cost", "This book costs ten dollars.", ["to be very heavy", "to have a particular price", "to be hard to read", "to be very old"], 1, "cost = (값·비용이) 들다."]], "comp": [{"type": "주제", "q": "What is the writer's main message?", "options": ["We should drink tap water instead of buying bottled water.", "Seabirds need more food.", "Oil is a good source of energy.", "Bottled water is cleaner than tap water."], "answer": 0, "ex": "제목 그대로 수돗물을 마시자는 글이에요."}, {"type": "세부 내용", "q": "How much plastic goes into the sea each year?", "options": ["about 10,000 tons", "about 47 tons", "over 5 million tons", "over 1 million tons"], "answer": 2, "ex": "over 5 million tons each year"}, {"type": "세부 내용", "q": "Why do seabirds eat plastic?", "options": ["People feed it to them.", "It looks and smells like food.", "It is soft.", "They are very hungry."], "answer": 1, "ex": "To them, the plastic looks like and even smells like food."}, {"type": "세부 내용", "q": "According to one report, how much bottled water is from the tap?", "options": ["about 47 percent", "about 10 percent", "about 25 percent", "about 70 percent"], "answer": 0, "ex": "47 percent of bottled water is from the tap."}, {"type": "추론", "q": "Which is NOT a problem of bottled water in the passage?", "options": ["It pollutes the environment.", "It tastes bad.", "It costs more money.", "It uses a lot of oil."], "answer": 1, "ex": "맛에 대한 이야기는 나오지 않아요."}]}, "12": {"passage": "Enrique, 13, Galápagos Islands \nI live on a beautiful island. Many tourists come here every year, and throw away a lot of garbage. My friends and I tell people, \"Never throw garbage on the streets or beaches. Always use a recycling bin or a trash can.\" We often clean the beaches near our village, too. There are so many exotic creatures living on our island! We must protect them from pollution. \n\nSofia, 12, Lisbon\nIf you plant a tree near your house, the shade will keep your home cool in the summer. Then, when the leaves fall in the autumn, the sun will heat your house. Trees are also beneficial because they make oxygen. We breathe in oxygen, so we can’t live without it! Another thing you can do is to use a fan instead of an air conditioner because it saves energy. \n\nCarlos, 11, Madrid \nWe throw away a lot of food every day. Don’t waste food. If we buy only what we need, we won’t waste anything. Another way to go green is to ride your bike or walk instead of driving. Going green is easy!\n\nAmina, 12, Dubai \nDon’t waste things! If a tap drips, you will waste a lot of water. One drop of water each second is over 10,000 liters of water a year! Also, find a recycling center near you and recycle everything you can. Remember that you can use things again. You can use the same plastic bags many times before you recycle them.", "speaking": "Which way to go green from the passage is the easiest for you? Why?", "speakStarters": ["The easiest way for me is …", "This is because …", "I can start by …"], "prompt": "Write your own tips for going green. Give three things people can do at home or at school. Write 4–6 sentences.", "starters": ["There are easy ways to go green.", "First, …", "Second, …", "Finally, …"], "cards": [{"word": "recycling bin", "form": "recycling bin", "pos": "phr.", "en": "a container for waste that will be recycled", "ko": "재활용품 통"}, {"word": "exotic", "form": "e e = 숨을 쉬다."], ["drip", "Water was dripping from the roof after the rain.", ["to break into pieces", "to let liquid fall in drops", "to blow very hard", "to burn very brightly"], 1, "drip = (액체가) 뚝뚝 떨어지다."], ["drop", "A drop of rain fell on my nose.", ["a cup of tea", "a large wave in the sea", "a small round-shaped amount of liquid", "a piece of ice"], 2, "drop = 방울."]], "comp": [{"type": "주제", "q": "What is the passage mainly about?", "options": ["how to travel to the Galápagos Islands", "four students' ideas for going green", "why air conditioners are bad", "how to plant a tree"], "answer": 1, "ex": "네 명의 학생이 환경을 지키는 방법을 소개해요."}, {"type": "세부 내용", "q": "What do Enrique and his friends often do?", "options": ["ride bikes", "plant trees", "clean the beaches near their village", "visit recycling centers"], "answer": 2, "ex": "We often clean the beaches near our village, too."}, {"type": "세부 내용", "q": "According to Sofia, why are trees beneficial?", "options": ["They make oxygen.", "They stop the rain.", "They give us fruit.", "They keep insects away."], "answer": 0, "ex": "Trees are also beneficial because they make oxygen."}, {"type": "세부 내용", "q": "What does Carlos say we should do?", "options": ["use a fan", "buy only what we need", "use plastic bags once", "drive to school"], "answer": 1, "ex": "If we buy only what we need, we won't waste anything."}, {"type": "추론", "q": "Why does Amina talk about one drop of water each second?", "options": ["to show that a dripping tap wastes a lot of water", "to explain how rain falls", "to talk about the weather in Dubai", "to show how much water we drink"], "answer": 0, "ex": "작은 방울도 1년이면 10,000리터가 넘는다는 것을 보여 줘요."}]}}}, "4": {"lexile": "580–830", "titles": {"1": "Treasure Find", "2": "New York City", "3": "Letters to the City Guide", "4": "Then and Now", "5": "Watch It!", "6": "An Internet Star", "7": "Car-Free Cities?", "8": "Getting Around Underground", "9": "Unique Transportation", "10": "Unusual Jobs", "11": "Dr. Lee’s Many Jobs", "12": "What Do You Want to Be?"}, "fields": {}, "units": {"1": {"passage": "What is Treasure Find?\nIn Treasure Find, you look for treasure in a city. We design each Treasure Find to help you explore a city. You can learn about the most famous sights in the city.\n\nHow does it work?\nFirst, make a team of three to four people. It’s better to explore in a group. You must download the Treasure Find app on your phone. The phone will track your location through GPS. Touch “Start” to begin your adventure. The app then gives you directions to your first location. Follow the directions to your first destination. They’re usually important landmarks, statues, or public parks.\n\nOnce you arrive, you’ll get information about the place. You will have 30 seconds to study the information, and then you’ll have to take a test. If you pass the test, you get easy directions to the next location. If you don’t pass the test, the directions can get quite tricky.\n\nHow do you win? \nTo win, your team has to go from one location to another quickly. Once you get to the final destination, you’ll find a Treasure Find sign. Stand next to it and take a picture. Send your picture through the app. The app records your time. Then, the Treasure Find team sends a message to the winner of each city. The winners get a great prize! \n\nWith this activity, you get to travel around a city, and if you are lucky, you will get a prize at the end. \n\nWhy don’t you start your adventure today?", "speaking": "Would you like to play Treasure Find in your city? Which places would you visit?", "speakStarters": ["I would / would not like to play because …", "I would visit …", "It would be fun to …"], "prompt": "Explain how to play Treasure Find to a friend. Describe the steps in order. Write 5–7 sentences.", "starters": ["Treasure Find is a game where …", "First, …", "Next, …", "When you arrive, …", "Finally, …"], "cards": [{"word": "design", "form": "design", "pos": "", "en": "to plan and make for a Eiffel Tower is a famous landmark in Paris.", ["a small shop on a side street", "a person who guides tourists", "a building or object that is easy to see and recognize", "a kind of map for drivers"], 2, "landmark = 랜드마크, 주요 지형지물."], ["tricky", "The last math question was really tricky.", ["difficult to do or deal with", "very funny and silly", "very short and quick", "very easy to answer"], 0, "tricky = 까다로운."], ["record", "The coach records each runner's time.", ["to forget about something", "to share something with friends", "to change something quickly", "to keep an account of facts or events"], 3, "record = 기록하다."]], "comp": [{"type": "주제", "q": "What is the passage mainly about?", "options": ["how to take good pictures", "the most famous statues in the world", "how to make a phone app", "a game that helps you explore a city"], "answer": 3, "ex": "도시를 탐험하는 게임 Treasure Find를 소개해요."}, {"type": "세부 내용", "q": "How many people should be on a team?", "options": ["five or six", "three or four", "ten", "one or two"], "answer": 1, "ex": "make a team of three to four people"}, {"type": "세부 내용", "q": "What happens if your team doesn't pass the test?", "options": ["The directions can get quite tricky.", "You have to go home.", "You must start again.", "You get a prize."], "answer": 0, "ex": "If you don't pass the test, the directions can get quite tricky."}, {"type": "세부 내용", "q": "What must you do at the final destination?", "options": ["call the Treasure Find team", "take another test", "buy a ticket", "take a picture next to the Treasure Find sign"], "answer": 3, "ex": "Stand next to it and take a picture."}, {"type": "추론", "q": "Why is passing the tests important for winning?", "options": ["The app gives you money.", "You can skip the final destination.", "You get more people on your team.", "Easy directions help your team reach the next place faster."], "answer": 3, "ex": "테스트를 통과하면 쉬운 길 안내를 받아 더 빨리 이동할 수 있어요. 빨리 가야 이겨요."}]}, "2": {"passage": "New York is an exciting city. There is so much to do! The city can be expensive, but you don’t have to spend a lot of money to have fun. In fact, you can do some things for free. For example, you can enjoy New York Bay on the Staten Island Ferry. The tour takes you around the bay, so you can see the Statue of Liberty and the island of Manhattan as well as all its famous skyscrapers. You can also visit Central Park, a massive green space in the middle of Manhattan. At nearly 350 hectares, it is larger than two countries—Vatican City and Monaco—put together! In the park, you can walk or fish in the lake. You can even go rock climbing! \n\nWhen in New York, you must visit the American Museum of Natural History. It doesn’t cost much for students, and there are lots of fantastic exhibitions and activities for people of all ages. You can see collections of fossils, dinosaur bones, and mummies, or you can learn about outer space and the oceans. \n\nIn the evening, you can take a walk around Times Square or go to the theater on Broadway. With luck, you can get some discounted tickets for amazing shows. But what can you do after seeing all the sights? Eat, of course! You shouldn’t leave without trying the food. There are bargain restaurants from every culture in the world. If you want to eat local food, try bagels. They’re delicious chewy bread rings. You can buy them on the street. They’re very cheap and tasty.\n\n\n[Guess what!] \nThe French engineer Gustave Eiffel built the Statue of Liberty—a gift from France to the USA. Eiffel also built the famous Eiffel Tower in Paris.", "speaking": "If you visited New York, what is the first thing you would do? Why?", "speakStarters": ["The first thing I would do is …", "I want to do this because …", "After that, I would …"], "prompt": "Write a short guide to having fun in New York without spending a lot of money. Give at least three ideas from the passage. Write 5–7 sentences.", "starters": ["You don't need much money to enjoy New York.", "First, you can …", "Also, …", "In the evening, …", "Don't forget to …"], "cards": [{"word": "bay", "form": "Bay", "pos": "", "en": "a part of the sea where the land curves in", "ko": "만"}, {"word": "ferry", "form": "Ferry", "pos": "", "en": "a boat that carries people or things for a short distance", "ko": "연락선, 여객선"}, {"word": "skyscraper", "form": "skyscrapers", "pos": "", "en": "a very tall building", "ko": "고층 건물"}, {"word": "massive", "form": "massive", "pos": "", "en": "very large", "ko": "거대한"}, {"word": "exhibition", "form": "exhibitions", "pos": "", "en": "a public show of art or other interesting things", "ko": "전시회"}, {"word": "fossil", "form": "fossils", "pos": "", "en": "a part of ancient animals or plants that is found inside rocks", "ko": "화석"}, {"word": "outer space", "form": "outer space", "pos": "phr.", "en": "the space outside the Earth’s air", "ko": "(대기권 외) 우주 공간"}, {"word": "bargain", "form": "bargain", "pos": "", "en": "something on sale at a lower price", "ko": "할인, 특가품"}], "vocab": [["bay", "Many boats were sailing in the bay.", ["a tall mountain near the sea", "a part of the sea where the land curves in", "a long river in the desert", "a sandy island far from land"], 1, "bay = 만."], ["ferry", "We took a ferry to the island.", ["a bus with two floors", "a small plane for two people", "a train that runs under the city", "a boat that carries people or things for a short distance"], 3, "ferry = 여객선, 연락선."], ["skyscraper", "The office is on the 50th floor of a skyscraper.", ["a small house in the country", "a very tall building", "an old bridge over a river", "a tent used for camping"], 1, "skyscraper = 고층 건물."], ["massive", "A massive wave hit the beach.", ["very small and weak", "very large", "very old and broken", "very fast and quiet"], 1, "massive = 거대한."], ["exhibition", "The museum has an exhibition of Korean paintings.", ["a sports game in a stadium", "a meeting about a problem", "a public show of art or other interesting things", "a long speech by a teacher"], 2, "exhibition = 전시회."], ["fossil", "We found a fossil of a small fish in the rock.", ["a picture painted on a cave wall", "a part of ancient animals or plants that is found inside rocks", "a tool made by early people", "a kind of shiny stone"], 1, "fossil = 화석."], ["outer space", "Astronauts travel into outer space in rockets.", ["the space outside the Earth’s air", "the top of a tall building", "the land at the North Pole", "the deep part of the ocean"], 0, "outer space = 우주 공간."], ["bargain", "This jacket was a real bargain at only ten dollars.", ["something that costs too much", "something on sale at a lower price", "something you borrow from a friend", "something you make by hand"], 1, "bargain = 할인 상품, 특가품."]], "comp": [{"type": "주제", "q": "What is the main idea of the passage?", "options": ["New York is too expensive for students.", "Bagels are the best food in the world.", "You can enjoy New York without spending a lot of money.", "Central Park is bigger than Monaco."], "answer": 2, "ex": "돈을 많이 쓰지 않고도 뉴욕을 즐길 수 있는 방법을 소개해요."}, {"type": "세부 내용", "q": "What can you see from the Staten Island Ferry?", "options": ["Times Square at night", "the American Museum of Natural History", "the Statue of Liberty and Manhattan", "Central Park and the lake"], "answer": 2, "ex": "you can see the Statue of Liberty and the island of Manhattan …"}, {"type": "세부 내용", "q": "Which is NOT something you can do in Central Park?", "options": ["go rock climbing", "walk", "fish in the lake", "see dinosaur bones"], "answer": 3, "ex": "공룡 뼈는 자연사 박물관에서 볼 수 있어요."}, {"type": "세부 내용", "q": "What are bagels?", "options": ["chewy bread rings", "sweet cakes from France", "cheap theater tickets", "a kind of street show"], "answer": 0, "ex": "They're delicious chewy bread rings."}, {"type": "추론", "q": "Why does the writer mention Vatican City and Monaco?", "options": ["to explain where bagels come from", "to show that Central Park is very large", "to talk about famous museums", "to recommend other cities to visit"], "answer": 1, "ex": "두 나라를 합친 것보다 크다고 해서 공원의 크기를 보여 줘요."}]}, "3": {"passage": "Dear City Guide, \nBarcelona is one of the largest cities in Spain. There are two things I really like about living in Barcelona. The first thing is that the city is by the sea. It has a coastline that stretches to 4.5 km with great beaches for tourists. Visitors should bring their swimsuits so that they can swim. The second thing is that the city is really beautiful, and there are some really amazing buildings, too. You might spend all day walking around, so make sure you bring comfortable shoes and a camera. \nMaria Cortez\n\n\nDear City Guide, \nI live in Melbourne, Australia. I love living in Melbourne because you can meet so many fascinating people. There are people here from all over the world. Some days you might hear ten different languages! I also like the fact that you can get lots of different kinds of cuisine. I always like to try new things to eat. \nPaul Bell\n\n\nDear City Guide, \nBuenos Aires is the capital city of Argentina. One reason that I like Buenos Aires is because it’s so green. There are a lot of parks and everyone goes to them often. You can go for a walk, have a picnic, or go jogging. I especially love the Botanical Garden. It has so many beautiful flowers! There are also fantastic museums, and many of them are free. You can buy unique souvenirs from the outdoor markets as well. \nSandra Fernandez", "speaking": "Which city from the letters would you like to visit the most? Why?", "speakStarters": ["I would like to visit … the most.", "This is because …", "I would also like to …"], "prompt": "Write a letter to the City Guide about your own city or town. Give two reasons you like living there. Write 5–7 sentences.", "starters": ["Dear City Guide,", "I live in …", "One reason I like … is that …", "Another reason is …", "Visitors should …"], "cards": [{"word": "coastline", "form": "coastline", "pos": "", "en": "the outline of the land next to the sea", "ko": "해안선, 해안지대"}, {"word": "stretch", "form": "stretches", "pos": "", "en": "to continue for a particular distance", "ko": "펼쳐지다, 이어지다"}, {"word": "fascinating", "form": "fascinating", "pos": "", "en": "very interesting or appealing", "ko": "매력적인"}, {"word": "cuisine", "form": "cuisine", "pos": "", "en": "a particular type of cooking", "ko": "요리"}, {"word": "capital", "form": "capital", "pos": "", "en": "the city of a country where the government is located", "ko": "수도"}, {"word": "botanical garden", "form": "Botanical Garden", "pos": "phr.", "en": "a public garden where plants are grown for scientific study", "ko": "식물원"}, {"word": "unique", "form": "unique", "pos": "", "en": "very special or unusual", "ko": "독특한"}, {"word": "souvenir", "form": "souvenirs", "pos": "", "en": "something you buy or keep to help you remember a place or an event", "ko": "기념품"}], "vocab": [["coastline", "The island has a beautiful coastline with white sand.", ["the outline of the land next to the sea", "a road through the city center", "the top part of a mountain", "a line of trees in a park"], 0, "coastline = 해안선."], ["stretch", "The forest stretches for many kilometers.", ["to continue for a particular distance", "to stop suddenly", "to become very small", "to move up and down"], 0, "stretch = (특정 거리에 걸쳐) 펼쳐지다, 이어지다."], ["fascinating", "The movie about the ocean was fascinating.", ["boring and too long", "very interesting or appealing", "scary and dark", "hard to understand"], 1, "fascinating = 매력적인, 아주 흥미로운."], ["cuisine", "I love Italian cuisine, especially pasta.", ["a famous chef", "a kind of kitchen tool", "a place to buy food", "a particular type of cooking"], 3, "cuisine = 요리(법)."], ["capital", "Seoul is the capital of Korea.", ["the biggest island of a country", "a small town near the border", "the city of a country where the government is located", "the oldest school in a country"], 2, "capital = 수도."], ["botanical garden", "We saw rare plants at the botanical garden.", ["a store that sells flowers", "a zoo for small animals", "a public garden where plants are grown for scientific study", "a farm that grows vegetables to sell"], 2, "botanical garden = 식물원."], ["unique", "Each snowflake has a unique shape.", ["very cheap", "very special or unusual", "the same as all the others", "very ugly"], 1, "unique = 독특한, 유일한."], ["souvenir", "I bought a key ring as a souvenir of Paris.", ["a map of the city", "a ticket for the train", "something you buy or keep to help you remember a place or an event", "a letter from a friend"], 2, "souvenir = 기념품."]], "comp": [{"type": "주제", "q": "What are the three letters about?", "options": ["problems in big cities", "how to write a letter", "why the writers like their cities", "the best beaches in the world"], "answer": 2, "ex": "세 사람이 자기 도시를 좋아하는 이유를 써요."}, {"type": "세부 내용", "q": "What does Maria tell visitors to bring?", "options": ["swimsuits, comfortable shoes, and a camera", "money for the museums", "warm clothes", "a map and an umbrella"], "answer": 0, "ex": "Visitors should bring their swimsuits … comfortable shoes and a camera."}, {"type": "세부 내용", "q": "Why does Paul love living in Melbourne?", "options": ["It has beautiful buildings.", "He can meet fascinating people from all over the world.", "It has many parks.", "It is by the sea."], "answer": 1, "ex": "you can meet so many fascinating people."}, {"type": "세부 내용", "q": "What is Sandra's favorite place in Buenos Aires?", "options": ["the beach", "the museums", "the outdoor markets", "the Botanical Garden"], "answer": 3, "ex": "I especially love the Botanical Garden."}, {"type": "추론", "q": "Which city would be best for someone who wants to try many kinds of food?", "options": ["none of them", "Melbourne", "Buenos Aires", "Barcelona"], "answer": 1, "ex": "Paul은 멜버른에서 여러 종류의 요리를 먹을 수 있다고 했어요."}]}, "4": {"passage": "1980\nI love taking pictures with my new camera and sharing them with my friends. It’s quite easy. First, I buy a roll of film and put it into the camera. I usually buy film that takes 24 pictures. When the film is finished, I carefully take it out of the camera and go to the photo store. There, the pictures are printed on paper. When the pictures are ready, I go and pick them up. I only save the good ones and put them in an album. Sometimes, I make a scrapbook. I cut and paste the pictures, decorate them with stickers or fabric, and write some comments next to the pictures. How do I share my pictures? I take the album or scrapbook to my friend’s house, and we go through it together. \n\n\nToday\nI take and share pictures all the time. Whenever I see something beautiful or cool, I take a picture with the camera on my phone. I might even just take a selfie when I don’t have anything else to take pictures of. After I take a picture, I can edit it. I can add a sticker on it or change the colors of the picture on my phone easily. When I’m satisfied with the picture, I share it with others. I post the picture on social media for my friends and family to see. It’s fun to read everybody’s comments about my pictures. I also like to see what others post on their social media. Sharing pictures is my favorite pastime.", "speaking": "Do you like sharing pictures on social media or in a photo album more? Why?", "speakStarters": ["I like … more because …", "For example, …", "But …"], "prompt": "Compare sharing pictures in 1980 and today. Write about two differences and say which way you prefer. Write 5–7 sentences.", "starters": ["In 1980, people …", "Today, people …", "Another difference is …", "I prefer … because …"], "cards": [{"word": "roll", "form": "roll", "pos": "", "en": "a long piece of paper, cloth, etc., that is wrapped into the shape of tube", "ko": "두루마리, 통"}, {"word": "scrapbook", "form": "scrapbook", "pos": "", "en": "a book with empty pages for collecting pictures, articles, etc.", "ko": "스크랩북"}, {"word": "paste", "form": "paste", "pos": "", "en": "to stick something to something else using glue", "ko": "(풀로) 붙이다"}, {"word": "fabric", "form": "fabric", "pos": "", "en": "cloth used for making clothes, curtains, etc.", "ko": "천"}, {"word": "selfie", "form": "selfie", "pos": "", "en": "a picture that you take of yourself", "ko": "셀피, 자신의 모습을 직접 찍은 사진"}, {"word": "edit", "form": "edit", "pos": "", "en": "to make changes to text or data on screen", "ko": "편집하다"}, {"word": "satisfied", "form": "satisfied", "pos": "", "en": "having a happy or pleased feeling", "ko": "만족하는"}, {"word": "pastime", "form": "pastime", "pos": "", "en": "an activity that you do for fun in your free time", "ko": "취미"}], "vocab": [["roll", "We need a new roll of paper towels.", ["a heavy bag of rice", "a flat piece of glass", "a small box for jewelry", "a long piece of paper, cloth, etc., that is wrapped into the shape of tube"], 3, "roll = (둥글게 말린) 통, 두루마리."], ["scrapbook", "She keeps her concert tickets in a scrapbook.", ["a book with empty pages for collecting pictures, articles, etc.", "a notebook for math homework", "a phone app for games", "a book of short stories"], 0, "scrapbook = 스크랩북."], ["paste", "Paste the picture on the first page.", ["to tear into pieces", "to color with a pencil", "to stick something to something else using glue", "to draw a line"], 2, "paste = (풀로) 붙이다."], ["fabric", "Mom bought soft fabric to make curtains.", ["paint used on walls", "wood for making tables", "cloth used for making clothes, curtains, etc.", "paper for writing letters"], 2, "fabric = 천, 직물."], ["selfie", "We took a selfie in front of the castle.", ["a video of a sports game", "a drawing made with a pencil", "a picture that you take of yourself", "a picture of a famous person"], 2, "selfie = 셀피."], ["edit", "You can edit your story before you print it.", ["to read something aloud", "to delete everything", "to send a message to a friend", "to make changes to text or data on screen"], 3, "edit = 편집하다."], ["satisfied", "The teacher was satisfied with our project.", ["bored and tired", "having a happy or pleased feeling", "angry and upset", "worried and nervous"], 1, "satisfied = 만족하는."], ["pastime", "Fishing is my grandfather's favorite pastime.", ["an activity that you do for fun in your free time", "a job that pays a lot", "a meal you eat at night", "a test you take at school"], 0, "pastime = 취미, 여가 활동."]], "comp": [{"type": "주제", "q": "What is the passage mainly about?", "options": ["how taking and sharing pictures changed from 1980 to today", "how to use a film camera", "why selfies are popular", "how to make a scrapbook"], "answer": 0, "ex": "1980년과 오늘날 사진을 찍고 나누는 방법을 비교해요."}, {"type": "세부 내용", "q": "In 1980, where did the writer get the pictures printed?", "options": ["at the photo store", "at home", "at a friend's house", "at school"], "answer": 0, "ex": "go to the photo store. There, the pictures are printed on paper."}, {"type": "세부 내용", "q": "How did the writer share pictures in 1980?", "options": ["by sending them by email", "by posting them online", "by taking the album or scrapbook to a friend's house", "by putting them on the wall at school"], "answer": 2, "ex": "I take the album or scrapbook to my friend's house …"}, {"type": "세부 내용", "q": "What does the writer do today after taking a picture?", "options": ["throw it away", "edit it on the phone", "print it at a store", "put it in an album"], "answer": 1, "ex": "After I take a picture, I can edit it."}, {"type": "추론", "q": "Which sentence about the two time periods is true?", "options": ["Today, people only save the good pictures in an album.", "In 1980, people took more selfies.", "Today, it is faster and easier to share pictures.", "In 1980, people could change the colors of pictures easily."], "answer": 2, "ex": "오늘날은 휴대폰으로 바로 편집하고 SNS에 올릴 수 있어요."}]}, "5": {"passage": "Which TV programs and movies do you watch? How do you watch them? TV programs and movies have always entertained us. However, the way we watch them has changed a lot over time.\n\nThe first electronic black and white television was invented in the 1920s. Back then, TV sets were very expensive. As the TV got cheaper, more people were able to buy TVs. In the 1950s, color television appeared in homes for the first time. By the late 1960s, many people had color TV sets. \n\nIn those days, TV programs were broadcast only at certain times. You had to be sure you turned on the TV at the scheduled time, or you would miss your program. The VCR (videocassette recorder) was invented in the 1950s, and it became popular in the 1970s and 1980s. VCRs allowed people to record TV programs or movies to watch later. In the 1990s, people began watching digital movies on DVDs. DVDs were better quality than VCR tapes. By 1997, you could order a DVD from the Internet, and it was delivered to your house by mail. \n\nNow, we can download TV shows and movies directly to our TVs. We even watch TV programs on our computers, tablets, and smartphones. Technology continues to improve. Just imagine what technology will bring us in 100 years. Whatever it is, we’ll be watching!\n\n\n[Guess what!] \nThe first TV advertisement was shown in 1941. It was for a watch. The advertisement cost the watch company $9 to make.", "speaking": "How do you usually watch TV shows or movies? What do you like about it?", "speakStarters": ["I usually watch them on …", "I like it because …", "Sometimes I also …"], "prompt": "Explain how the way people watch TV changed over time. Use at least three time words such as \"In the 1950s\" or \"Now.\" Write 5–7 sentences.", "starters": ["In the 1920s, …", "In the 1950s, …", "Later, …", "Now, …", "In the future, …"], "cards": [{"word": "entertain", "form": "entertained", "pos": "", "en": "to interest people in order to please them", "ko": "즐겁게 해 주다"}, {"word": "electronic", "form": "electronic", "pos": "", "en": "using electricity", "ko": "전자의"}, {"word": "invent", "form": "invented", "pos": "", "en": "to create for the first time", "ko": "발명하다"}, {"word": "broadcast", "form": "broadcast", "pos": "", "en": "to send out by television or radio", "ko": "방송하다"}, {"word": "scheduled", "form": "scheduled", "pos": "", "en": "planned to happen at a particular time", "ko": "예정된"}, {"word": "videocassette", "form": "videocassette", "pos": "", "en": "a plastic case containing videotape that is played using a VCR", "ko": "비디오 카세트"}, {"word": "deliver", "form": "delivered", "pos": "", "en": "to take something to someone or a place", "ko": "배달하다"}, {"word": "improve", "form": "improve", "pos": "", "en": "to make better", "ko": "개선되다"}], "vocab": [["entertain", "The clown entertained the children at the party.", ["to send someone home", "to teach someone a lesson", "to interest people in order to please them", "to make someone feel scared"], 2, "entertain = 즐겁게 해 주다."], ["electronic", "My brother loves electronic games.", ["made by hand", "very old", "using electricity", "made of wood"], 2, "electronic = 전자의."], ["invent", "Who invented the telephone?", ["to fix something old", "to create for the first time", "to sell for a high price", "to break for the first time"], 1, "invent = 발명하다."], ["broadcast", "The game will be broadcast live on TV.", ["to send out by television or radio", "to write in a newspaper", "to hide from everyone", "to record on paper"], 0, "broadcast = 방송하다."], ["scheduled", "The train left at its scheduled time.", ["changed at the last minute", "free for everyone", "late because of bad weather", "planned to happen at a particular time"], 3, "scheduled = 예정된."], ["videocassette", "Dad found an old videocassette of my first birthday.", ["a plastic case containing videotape that is played using a VCR", "a kind of digital camera", "a small speaker for music", "a book of old photos"], 0, "videocassette = 비디오카세트."], ["deliver", "The store will deliver the new sofa tomorrow.", ["to take something back", "to make something smaller", "to take something to someone or a place", "to clean something carefully"], 2, "deliver = 배달하다."], ["improve", "Your English will improve if you read every day.", ["to get worse", "to stop working", "to make better", "to stay the same"], 2, "improve = 나아지다, 개선되다."]], "comp": [{"type": "주제", "q": "What is the passage mainly about?", "options": ["why DVDs are better than VCRs", "how to make a TV program", "how the way we watch TV and movies has changed", "the first TV advertisement"], "answer": 2, "ex": "TV와 영화를 보는 방식의 변화를 시대순으로 설명해요."}, {"type": "세부 내용", "q": "When did color television first appear in homes?", "options": ["in the 1950s", "in the 1920s", "in 1997", "in the 1990s"], "answer": 0, "ex": "In the 1950s, color television appeared in homes for the first time."}, {"type": "세부 내용", "q": "What did VCRs allow people to do?", "options": ["order DVDs online", "watch TV in color", "download movies", "record programs to watch later"], "answer": 3, "ex": "VCRs allowed people to record TV programs or movies to watch later."}, {"type": "세부 내용", "q": "What could people do by 1997?", "options": ["watch shows on smartphones", "make their own TV programs", "order a DVD from the Internet", "buy the first black and white TV"], "answer": 2, "ex": "By 1997, you could order a DVD from the Internet …"}, {"type": "추론", "q": "Before VCRs, what happened if you didn't turn on the TV at the scheduled time?", "options": ["You could order a DVD.", "You could watch it later online.", "The program would start again.", "You would miss your program."], "answer": 3, "ex": "예정된 시간에 TV를 켜지 않으면 프로그램을 놓쳤어요."}]}, "6": {"passage": "Do you watch videos that people post online? People post different types of videos. Some might show videos of their pets’ special talents. If the video is interesting or funny, others might share it so that more people can view it. Before long, the video can get a lot of views. Without even knowing it, people can become internet stars! \n\nThis happened to Evan. With his father’s help, Evan began making videos in 2011 when he was just six years old. As of 2021, his online channel has over 6.7 million followers. People, mostly children, have watched his videos more than 1.4 billion times!\n\nWhy do so many children like Evan’s videos? His father says it’s because children feel like Evan is their friend. The videos are funny and interesting. Some show Evan’s adventures with his younger sister, Jillian. But it was Evan’s toy reviews that made him famous. He plays with toys and tells what he likes about them. Many toy companies have come to Evan with new toys for him to review. Evan has been in TV advertisements for toys. Evan and Jillian have even acted as voice actors for cartoon characters. \n\nCompanies pay the family for advertisements on Evan’s channel. Evan saves everything he earns for college, and he donates most of the toys he reviews. Evan is a smart, generous, and funny boy. Evan’s fame is not surprising at all!", "speaking": "If you made videos online, what would they be about? Why?", "speakStarters": ["My videos would be about …", "I would choose this because …", "People would enjoy them because …"], "prompt": "Why is Evan so popular? Give three reasons from the passage and add your own opinion about him. Write 5–7 sentences.", "starters": ["Evan is an internet star who …", "One reason he is popular is …", "Another reason is …", "Also, …", "I think Evan is …"], "cards": [{"word": "talent", "form": "talents", "pos": "", "en": "a natural ability to do something well", "ko": "재능"}, {"word": "follower", "form": "followers", "pos": "", "en": "someone who subscribes to an account to receive all the updates", "ko": "팔로워, 구독자"}, {"word": "review", "form": "reviews", "pos": "", "en": "a report that gives an opinion about the quality of something", "ko": "평가, 리뷰"}, {"word": "voice actor", "form": "voice actors", "pos": "phr.", "en": "an actor who voices characters in animated films, video games, etc.", "ko": "성우"}, {"word": "earn", "form": "earns", "pos": "", "en": "to get money for work that you have done", "ko": "(돈을) 벌다"}, {"word": "donat ], "comp": [{"type": "주제", "q": "What is the passage mainly about?", "options": ["a boy who became an internet star", "how to make funny pet videos", "the best toys for children", "how cartoons are made"], "answer": 0, "ex": "인터넷 스타가 된 Evan에 대한 글이에요."}, {"type": "세부 내용", "q": "How old was Evan when he started making videos?", "options": ["ten", "four", "twelve", "six"], "answer": 3, "ex": "when he was just six years old"}, {"type": "세부 내용", "q": "What made Evan famous?", "options": ["his toy reviews", "his pet videos", "his songs", "his cooking videos"], "answer": 0, "ex": "it was Evan's toy reviews that made him famous."}, {"type": "세부 내용", "q": "What does Evan do with most of the toys he reviews?", "options": ["donates them", "sells them", "keeps them", "gives them to Jillian"], "answer": 0, "ex": "he donates most of the toys he reviews."}, {"type": "추론", "q": "Why does the writer call Evan \"generous\"?", "options": ["He has many followers.", "He makes funny videos.", "He acts in cartoons.", "He gives away most of his toys."], "answer": 3, "ex": "리뷰한 장난감 대부분을 기부하기 때문이에요."}]}, "7": {"passage": "Traffic is a big problem around the world. In Los Angeles, USA, people spend 90 hours a year in traffic. It’s worse in Rio de Janeiro, Brazil, at 100 hours per year. The worst is in Mexico City. Residents there lose over 200 hours each year. Drivers in the UK spend more than 100 days of their lives looking for parking!\n\nMany cities want to improve transportation. Urban planners in Helsinki, Finland want to make owning a car less necessary. They have created an app and service that includes various types of transportation: buses, trains, shared bikes and cars, electric scooters, taxis, and more. Users enter location and destination, and the app shows them the best type of transportation for their trip. Users pay for their transportation right in the app, and there are even unlimited travel plans. \n\nHelsinki also has more than 1,200 km of bike lanes. There are trams and subways. It has a huge bus system with over 1,000 bus stops, too. The city even has self-driving electric minibuses that can take people across the city. In addition, many of the roads downtown are for pedestrians only, so no traffic is allowed.\n\nDoes this mean Helsinki could be a car-free city someday? Possibly. Some *Finns are already saying they could give up their cars. And green transportation appeals to many younger people. In the meantime, it certainly seems fewer cars will be on the road.", "speaking": "Could your city become car-free? Why or why not?", "speakStarters": ["I think my city could / could not be car-free because …", "For example, …", "To help, my city should …"], "prompt": "How is Helsinki trying to make owning a car less necessary? Explain three things the city has done. Write 5–7 sentences.", "starters": ["Helsinki wants to …", "First, the city created …", "Second, …", "Also, …", "I think this is …"], "cards": [{"word": "traffic", "form": "Traffic", "pos": "", "en": "the vehicles driving along a road", "ko": "(특정 시간에 도로상의) 차량들"}, {"word": "resident", "form": "Residents", "pos": "", "en": "someone who lives in a particular place", "ko": "주민, 거주자"}, {"word": "urban", "form": "Urban", "pos": "", "en": "of or in a city or town", "ko": "도시의"}, {"word": "electric scooter", "form": "electric scooters", "pos": "phr.", "en": "a vehicle similar to a child’s scooter but with an electric motor attached", "ko": "전동 스쿠터"}, {"word": "unlimited", "form": "unlimited", "pos": "", "en": "not limited in amount, number, or level", "ko": "무제한의"}, {"word": "lane", "form": "lanes", "pos": "", "en": "a marked road used for one line of vehicles", "ko": "도로"}, {"word": "tram", "form": "trams", "pos": "", "en": "a vehicle for passengers that goes along metal tracks on the street", "ko": "전차"}, {"word": "pedestrian", "form": "pedestrians", "pos": "", "en": "someone who is walking instead of driving", "ko": "보행자"}], "vocab": [["traffic", "We were late because of heavy tra  The Aquarelle Train is one of the trains in the Moscow Metro system. This train is a moving gallery. It has copies of famous artwork hanging inside the train. Stockholm’s metro is the most colorful. It is known as the world’s longest art gallery. That is because 90 of its 100 stations have paintings, mosaics, or sculptures. Stations like these make waiting for the next train really easy!", "speaking": "Which underground station in the passage would you most like to visit? Why?", "speakStarters": ["I would like to visit … the most.", "It sounds interesting because …", "I would like to see …"], "prompt": "Describe three special underground railways from the passage. What makes each one special? Write 5–7 sentences.", "starters": ["Many cities have underground railways.", "London's Underground is special because …", "In …, …", "Also, …", "My favorite is … because …"], "cards": [{"word": "underground", "form": "underground", "pos": "", "en": "below the surface of the Earth", "ko": "지하의"}, {"word": "metro", "form": "metro", "pos": "", "en": "an underground railway system in a city", "ko": "지하철"}, {"word": "the planet", "form": "the planet", "pos": "phr.", "en": "the planet Earth", "ko": "지구"}, {"word": "display", "form": "displayed", "pos": "", "en": "to put something where people can see it", "ko": "전시하다, 진열하다"}, {"word": "chandelier", "form": "chandeliers", "pos": "", "en": "a decorative light that hangs from the ceiling", "ko": "샹들리에"}, {"word": "gallery", "form": "gallery", "pos": "", "en": "a room or building where people can look at works of art", "ko": "미술관, 화랑"}, {"word": "mosaic", "form": "mosaics", "pos": "", "en": "a pattern or picture made with many small pieces of colored glass, stone, etc.", "ko": "모자이크"}, {"word": "sculpture", "form": "sculptures", "pos": "", "en": "an art object made out of stone, clay, etc.", "ko": "조각품"}], "vocab": [["underground", "The car park is underground, below the shopping mall.", ["next to the ocean", "on top of a mountain", "b  Moscow Metro", "London's Underground", "the Tokyo metro"], "answer": 2, "ex": "London's Underground … opened in 1863. It's the oldest …"}, {"type": "세부 내용", "q": "Why are some stations in Athens like mini museums?", "options": ["Ancient objects found during construction are displayed there.", "They have large chandeliers.", "They are very deep.", "Famous painters work there."], "answer": 0, "ex": "there are ancient objects displayed inside. These objects were found when the metro was built."}, {"type": "세부 내용", "q": "Why is Stockholm's metro called the world's longest art gallery?", "options": ["Its trains are very long.", "It is the longest metro in the world.", "It has a moving gallery train.", "90 of its 100 stations have art."], "answer": 3, "ex": "90 of its 100 stations have paintings, mosaics, or sculptures."}, {"type": "추론", "q": "What can we guess about Arsenalna station?", "options": ["It takes a long time to get down to the trains.", "It is the oldest station.", "It is very busy.", "It has a lot of artwork."], "answer": 0, "ex": "105m 깊이라 에스컬레이터로만 5분 넘게 걸려요."}]}, "9": {"passage": "Venice, Italy \nIn Venice, there are buses and taxis just like any other city, but they travel on water instead of roads! The water bus is called the vaporetto, and it works just like an ordinary bus. You can get a single-trip ticket—a ticket valid for 75 minutes. Or you can get a weekly pass. Some visitors like riding in gondolas, but they’re quite expensive. The vaporettos and the water taxis aren’t as romantic as gondolas. However, they’re good enough for getting around, and they run every day.\n\nSan Francisco, USA \nIn San Francisco, getting around is really easy. There are all kinds of transportation: buses, subways, shared cars, and bikes. The oldest and the best kind is the cable cars. Some of them are modern, but some look just like the cable cars that were used in the city a hundred years ago. You can get a special ticket to use all types of transportation for a period of 120 minutes. It’s not very expensive, so it’s worth it! Some people think that walking in the city is difficult because it’s very hilly. Cable cars are a fun way to go up and down the city’s steep hills!\n\nMedellÍn, Colombia \nMedellÍn is becoming a popular tourist destination. People come for the museums, gardens, and its huge aquarium. But the top tourist attraction in MedellÍn is actually its unique means of transportation: the MedellÍn Metrocable. The Metrocable has more than 30,000 riders each day on its five lines. Many of the riders are tourists. It’s a great way to get a beautiful view of the city from above. The Metrocable is part of the city’s larger metro system. This system lets you explore the entire city underground or in the sky. The tickets are very inexpensive, too!", "speaking": "Which type of transportation from the passage would you like to try? Why?", "speakStarters": ["I would like to try …", "I think it would be …", "I would use it to …"], "prompt": "Choose two cities from the passage. Compare their unique transportation. Which one would you rather try? Write 5–7 sentences.", "starters": ["In Venice, people can …", "In …, …", "Both cities …", "However, …", "I would rather try … because …"], "cards": [{"word": "valid", "form": "valid", "pos": "", "en": "legally acceptable, often for a fixed period of time", "ko": "유효한"}, {"word": "pass", "form": "pass", "pos": "", "en": "a ticket which shows that you have the right to ride a vehicle", "ko": "탑승권"}, {"word": "gondola", "form": "gondolas", "pos": "", "en": "a long, narrow boat used in Venice, Italy", "ko": "곤돌라(베니스에서 운하를 오가는 기다란 배)"}, {"word": "romantic", "form": "romantic", "pos": "", "en": "causing feelings of love and excitement", "ko": "낭만적인"}, {"word": "hilly", "form": "hilly", "pos": "", "en": "having many hills", "ko": "언덕이 많은"}, {"word": "steep", "form": "steep", "pos": "", "en": "rising or falling very sharply", "ko": "가파른"}, {"word": "aquarium", "form": "aquarium", "pos": "", "en":  author ... it seems like there’s never a day off for Dr. Lee!", "speaking": "Would you like to travel to Mars someday? Why or why not?", "speakStarters": ["I would / would not like to go to Mars because …", "On Mars, I would …", "The hardest part would be …"], "prompt": "Describe Dr. Pascal Lee's many jobs. Which job do you think is the most interesting? Write 5–7 sentences.", "starters": ["Dr. Pascal Lee is a … who …", "He also …", "In addition, he …", "I think the most interesting job is … because …"], "cards": [{"word": "planetary", "form": "planetary", "pos": "", "en": "relating to planets", "ko": "행성의"}, {"word": "the Arctic", "form": "the Arctic", "pos": "phr.", "en": "the very cold area around the North Pole", "ko": "북극"}, {"word": "rover", "form": "rovers", "pos": "", "en": "a vehicle for exploring the surface of other planets", "ko": "탐사선"}, {"word": "spacesuit", "form": "spacesuits", "pos": "", "en": "a special suit that astronauts wear in space", "ko": "우주복"}, {"word": "greenhouse", "form": "greenhouses", "pos": "", "en": "a glass building for growing plants in", "ko": "온실"}, {"word": "toxic", "form": "toxic", "pos": "", "en": "containing poison; poisonous", "ko": "유독성의"}, {"word": "instructor", "form": "instructor", "pos": "", "en": "someone who teaches a sport or practical skill", "ko": "강사"}, {"word": "author", "form": "author", "pos": "", "en": "someone who has written a book", "ko": "작가"}], "vocab": [["planetary", "Planetary scientists study Mars and Jupiter.", ["relating to animals", "relating to oceans", "relating to plants", "relating to planets"], 3, "planetary = 행성의."], ["the Arctic", "Polar bears live in the Arctic.", ["a hot desert in Africa", "the very cold area around the North Pole", "a large forest in South America", "an island in the Pacific"], 1, "the Arctic = 북극."], ["rover", "The rover took pictures of rocks on Mars.", ["a kind of space food", "a vehicle for exploring the surface of other planets", "a big telescope on Earth", "a scien anyon", "3": "Beautiful but Little-Known", "4": "Power in the Path", "5": "What’s Out There?", "6": "Technology over Time", "7": "What to Do About Wildfires", "8": "Nature’s Creative Creatures", "9": "Amelie’s Amazing Weekend", "10": "The Bermuda Triangle", "11": "Amelia Earhart", "12": "Anansi the Spider"}, "fields": {}, "units": {"1": {"passage": "Friday, July 10\nI’m so excited: we’re leaving for Peru tomorrow! Our first stop is the capital, Lima. We’ll be visiting some of Lima’s beautiful churches. We’ll also see the monument honoring José de San Martín, a national hero of Peru.\n\nSunday, July 12\nToday, we’re going to Cusco, the oldest city on the continent. It’s also among the highest, at 3,400m above sea level. We’re visiting Cusco Cathedral, which took almost 100 years to build. We’re also eating some Peruvian dishes, including ceviche, which is raw fish in lime juice.\n\nMonday, July 13\nWe’re going to Machu Picchu today. This is a city of Incan ruins, found high in the Andes Mountains. Machu Picchu was very important during the Incan Empire but was forgotten until 1911, when an explorer named Hiram Bingham found the city. Today, it’s one of the most popular tourist destinations in the world.\n\nTuesday, July 14\nToday, we’re visiting Ollantaytambo. This historic fort is made from huge 50-ton stones. What’s fascinating is that the blocks came from an area over 5 km away. People moved the blocks down a mountain, across a river, and up another mountain to build the fort—with no trucks or trains!\n\nFriday, July 17\nToday, we’re in Puno, a small town near the Bolivian border. From Puno, we’re taking a boat to the Uros Islands. People live in straw houses on these floating islands. Some of the straw houses are simple, but others are quite modern: they even have satellite TV and Wi-Fi!\n\nSunday, July 19\nUnfortunately, our next destination is Lima’s airport. It’s time to go home. Goodbye, Peru!", "speaking": "Which place on the Peru trip would you most like to 1, when an explorer … found the city."}, {"type": "어휘", "q": "In the July 14 entry, the word \"fascinating\" is closest in meaning to ______.", "options": ["dangerous", "very interesting", "expensive", "boring"], "answer": 1, "ex": "fascinating = 대단히 흥미로운."}, {"type": "추론", "q": "Why does the writer find Ollantaytambo amazing?", "options": ["People moved 50-ton stones a long way without trucks or trains.", "It is the highest city in the world.", "It took 100 years to build.", "It has satellite TV and Wi-Fi."], "answer": 0, "ex": "50톤 돌을 트럭이나 기차 없이 5km 넘게 옮겨 지은 요새예요."}]}, "2": {"passage": "The Grand Canyon is a massive gorge located in the US state of Arizona, and it’s considered one of the seven wonders of the natural world. Scientists think the Colorado River, which still runs through the canyon, has created the gorge slowly over the past six million years. However, new research suggests that this started happening as far back as 70 million years ago. Today, the canyon is 446 km long, up to 29 km wide, and nearly 1.6 km deep at certain points.\n\nMillions of visitors come to the Grand Canyon each year. In fact, the Grand Canyon received over six million tourists in 2016, the most it’s ever seen. Camping is very popular around the canyon. Some visitors love to hike through it, while others prefer to explore the canyon on a mule. The paths can be rocky, steep, and narrow. It’s best to have some experience if you plan to explore on foot. Lots of visitors go rafting on the Colorado River. The fast, powerful waters of the river make for an exciting ride! If you want a different kind of adventure, visit the Skywalk, a glass pathway over the western side of the canyon. As you walk on the glass, you can see the bottom of the canyon, which is 1,200 m below!\n\nIf you go, plan your visit carefully. Check the weather and bring the right clothing. It can get as hot as 47°C in the summer, and there’s little shade. Bring sunscreen and lots of water to drink. The Grand Canyon is  forms in outer space. But they are looking for microscopic life forms that might be found in water, not creatures from science fiction films.\n\nScientists have already spent much time and money looking for water on the surface of Mars. They’ve found water underneath Mars’s surface, but it’s not like the lakes and rivers we have on Earth. Scientists feel that the Red Planet probably had water on its surface billions of years ago. Today, researchers continue to investigate whether the planet has ever been able to support life.\n\nTwo moons are also showing signs that life in space could be possible. They are Jupiter’s moon Europa and Saturn’s moon Enceladus. Both moons have icy surfaces with water underneath. Europa is billions of years older than Enceladus. For that reason, many scientists think it’s more likely than Enceladus to have life because life forms take a long time to develop.\n\nScientists have also started studying the possibility of life on a planet outside our solar system. There’s a planet orbiting Proxima Centauri, the next closest star to Earth after the Sun. This rocky planet is about the same size as Earth and may be warm enough for liquid water. It’s too early to tell if life could exist on the planet.\n\nWith exciting new missions planned, scientists are hoping to answer the question: are we alone in the universe, or do we have some microscopic neighbors waiting for us?\n\n\nGuess What!\nNASA scientists are planning to send the Europa Clipper spacecraft to arrive in Jupiter’s system before 2030. They are also planning to land astronauts on Mars by the mid-2030s.", "speaking": "Do you think there is life somewhere else in the universe? Why or why not?", "speakStarters": ["I think there is / isn't life because …", "For example, …", "If scientists found life, …"], "prompt": "Describe the places in space where scientists are looking for life. Explain why each place is interesting to them. Write 6–8 sentences.", "starters": ["Scientists are looking

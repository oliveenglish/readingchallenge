g we throw away every day: food.\n\nLast week, our eco club weighed the leftovers from lunch. In just one day, our school threw away 38 kilograms of food. That is about the weight of a fifth grader! Imagine carrying that every single day.\n\nWhy does this matter? When food goes to a landfill, it rots and releases methane, a gas that warms the planet. Also, it takes water, energy, and hard work to grow every carrot and grain of rice on our trays.\n\nI'm not asking for something impossible. I'm asking for small steps. First, take only what you can eat. You can always go back for more. Second, let's start a share table where students can leave unopened snacks for others. Third, in order to reduce waste even more, our club wants to start a compost bin for the school garden.\n\nSome of you may think, \"I'm just one person. What difference can I make?\" But if 600 students each save just a few bites a day, that adds up to a mountain of food every year.\n\nSo, in order to protect our planet, please join us. Small steps, taken together, make a big change. Thank you!", "speaking": "Tell about a time you persuaded your friends to do something. Give your opinion and an example. (30–40 seconds)", "speakStarters": ["One time, I persuaded my friends to … .", "For example, I said, \"… .\"", "I think it worked because … ."], "prompt": "Write a short speech for a school meeting about a change you want. Write 6–8 sentences. Use in order to at least once.", "starters": ["Good morning, everyone. My name is … .", "Today I want to talk about … .", "This is a problem because … .", "In order to … , we should … .", "Some people may think … , but … .", "Please join me. Thank you!"], "cards": [{"word": "weigh", "form": "weighed", "pos": "v.", "en": "to measure how heavy something is", "ko": "무게를 재다"}, {"word": "leftover", "form": "leftovers", "pos": "n.", "en": "food that is not eaten after a meal", "ko": "남은 음식"}, {"word": "landfill", "form": "landfill", "pos": "n.", "en": "a large place where trash is buried in the ground", "ko": "쓰레기 매립지"}, {"word": "rot", "form": "rots", "pos": "v.", "en": "to slowly go bad and break down", "ko": "썩다"}, {"word": "release", "form": "releases", "pos": "v.", "en": "to let something go out", "ko": "방출하다, 내보내다"}, {"word": "methane", "form": "methane", "pos": "n.", "en": "a gas that warms the planet when it goes into the air", "ko": "메탄"}, {"word": "impossible", "form": "impossible", "pos": "adj.", "en": "not able to happen or be done", "ko": "불가능한"}, {"word": "unopened", "form": "unopened", "pos": "adj.", "en": "still closed; not opened yet", "ko": "뜯지 않은"}, {"word": "reduce", "form": "reduce", "pos": "v.", "en": "to make something smaller or less", "ko": "줄이다"}, {"word": "compost", "form": "compost", "pos": "n.", "en": "a mix of old food and plants that becomes rich soil", "ko": "퇴비"}, {"word": "bite", "form": "bites", "pos": "n.", "en": "the amount of food you take into your mouth at one time", "ko": "한 입"}], "vocab": [["weigh", "The nurse weighed the baby.", ["to paint something", "to measure how long something is", "to measure how heavy something is", "to count the number of things"], 2, "weigh = 무게를 재다."], ["leftover", "We had leftovers from dinner for lunch.", ["food you buy at a shop", "a fresh fruit", "a new recipe", "food that is not eaten after a meal"], 3, "leftovers = 남은 음식."], ["landfill", "Most of our trash ends up in a landfill.", ["a recycling center", "a farm", "a park", "a large place where trash is buried in the ground"], 3, "landfill = 쓰레기 매립지."], ["rot", "The apples rotted on the ground.", ["to slowly go bad and break down", "to freeze", "to stay fresh", "to grow bigger"], 0, "rot = 썩다."], ["release", "Cars release gas into the air.", ["to keep inside", "to let something go out", "to clean", "to stop"], 1, "release = 방출하다."], ["methane", "Rotting food produces methane.", ["a kind of fresh water", "a gas that warms the planet when it goes into the air", "a type of metal", "a cool breeze"], 1, "methane = 메탄가스."], ["impossible", "It's impossible to finish this in one minute.", ["not able to happen or be done", "simple", "very easy", "possible"], 0, "impossible = 불가능한."], ["unopened", "Please give me the unopened bottle of water.", ["still closed; not opened yet", "empty", "broken", "already eaten"], 0, "unopened = 개봉하지 않은."], ["reduce", "We want to reduce plastic waste.", ["to make bigger", "to make something smaller or less", "to keep the same", "to double"], 1, "reduce = 줄이다."], ["compost", "We put fruit peels in the compost bin.", ["a kind of fertilizer made in a factory", "a trash can for plastic", "a garden tool", "a mix of old food and plants that becomes rich soil"], 3, "compost = 퇴비."], ["bite", "Can I have a bite of your sandwich?", ["a whole meal", "a large plate", "the amount of food you take into your mouth at one time", "a glass of water"], 2, "bite = 한 입."]], "comp": [{"type": "중심 내용", "q": "What is the speech mainly about?", "options": ["how to join the eco club", "why methane is useful", "asking students to reduce food waste at school", "how to cook healthy lunches"], "answer": 2, "ex": "학교 음식물 쓰레기를 줄이자고 설득하는 연설이에요."}, {"type": "세부 내용", "q": "How much food did the school throw away in one day?", "options": ["38 kilograms", "5 kilograms", "a few bites", "600 kilograms"], "answer": 0, "ex": "In just one day, our school threw away 38 kilograms of food."}, {"type": "추론", "q": "Who is the audience of this speech?", "options": ["workers at a landfill", "students and teachers at Ha-eun's school", "farmers who grow rice", "people at a restaurant"], "answer": 1, "ex": "Good morning, everyone… our school… 학교 회의에서 하는 연설이에요."}, {"type": "설득 기법 찾기", "q": "Why does Ha-eun compare the food to the weight of a fifth grader?", "options": ["to talk about her own weight", "to show she is strong", "to help listeners imagine how much food is wasted", "to make fun of fifth graders"], "answer": 2, "ex": "38kg이라는 숫자를 듣는 사람이 쉽게 상상하도록 비유했어요."}, {"type": "글의 구조", "q": "In what order does Ha-eun present her ideas?", "options": ["the problem → why it matters → three steps → answering a doubt → a call to action", "a list of foods she likes", "three steps → the problem → thank you", "a story about her family → a recipe"], "answer": 0, "ex": "문제 → 이유 → 세 가지 실천 → 반론에 답하기 → 참여 호소."}, {"type": "문법 · 목적의 to부정사 (in order to)", "q": "______ to reduce waste, we want a compost bin.", "options": ["In order", "Because", "So", "For"], "answer": 0, "ex": "In order to + 동사원형 = ~하기 위해."}, {"type": "문법 · 목적의 to부정사 (in order to)", "q": "She practiced every day in order ______ the speech well.", "options": ["give", "giving", "to give", "for giving"], "answer": 2, "ex": "in order to + 동사원형."}, {"type": "문법 · 목적의 to부정사 (in order to)", "q": "Which sentence is correct?", "options": ["I saved money in order for buy a bike.", "I saved money in order to buy a bike.", "I saved money in order buy a bike.", "I saved money for to buy a bike."], "answer": 1, "ex": "in order to + 동사원형(buy)."}]}}}, "5": {"lexile": "600–699", "titles": {"1": "Inside an Earthquake", "2": "The Volcano Watchers", "3": "The Night the River Rose", "4": "Why Do Prices Change?", "5": "From Shells to Cards: The Story of Money", "6": "The Lemonade Plan", "7": "How Artists Use Color", "8": "Frida Kahlo: Painting Her World", "9": "Poems About Home", "10": "Life on the Space Station", "11": "Should Humans Go to Mars?", "12": "Message from Planet K"}, "fields": {}, "units": {"1": {"passage": "The ground beneath your feet feels solid, but it is always moving very slowly. Earth's outer layer is broken into giant pieces called tectonic plates. These plates rest on hot, soft rock. They slide a few centimeters each year, about as fast as your fingernails grow.\n\nMost of the time, the plates move without causing problems. At their edges, however, they can get stuck against each other. Pressure builds up for years, like a spring being pushed down. When the rocks finally break and slip, a huge amount of energy is released all at once. This energy travels through the ground in waves that can be felt hundreds of kilometers away. That shaking is an earthquake.\n\nThe place underground where the rocks break is called the focus. The point on the surface directly above it is called the epicenter, and the shaking is usually strongest there.\n\nEarthquakes can be measured with an instrument called a seismometer. Scientists describe their size with a magnitude scale. Each step up on the scale means about 32 times more energy, so a magnitude 7 earthquake is far more powerful than a magnitude 5.\n\nEarthquakes cannot be predicted exactly. However, the damage they cause can be reduced. Buildings can be designed to sway instead of collapse. In countries such as Japan and Chile, students practice earthquake drills regularly. They learn to drop to the ground, take cover under a table, and hold on until the shaking stops.", "speaking": "Which natural disaster seems the scariest to you? Compare two disasters. (45 seconds)", "speakStarters": ["Earthquakes and … are both dangerous.", "However, … .", "I think … is scarier because … ."], "prompt": "Explain how to prepare for an earthquake. Write two paragraphs (about 120 words): Paragraph 1 — before an earthquake. Paragraph 2 — during and after it.", "starters": ["Paragraph 1: Before an earthquake, families should … .", "Emergency supplies can be kept … .", "Paragraph 2: During an earthquake, you should … .", "After the shaking stops, … ."], "cards": [{"word": "beneath", "form": "beneath", "pos": "prep.", "en": "under or below something", "ko": "~의 아래에"}, {"word": "solid", "form": "solid", "pos": "adj.", "en": "hard and firm, not liquid or gas", "ko": "단단한, 고체의"}, {"word": "plate", "form": "plates", "pos": "n.", "en": "one of the huge pieces that make up Earth's outer layer", "ko": "(지각의) 판"}, {"word": "pressure", "form": "Pressure", "pos": "n.", "en": "the force of pushing on something", "ko": "압력"}, {"word": "release", "form": "released", "pos": "v.", "en": "to let something go out suddenly", "ko": "방출하다"}, {"word": "surface", "form": "surface", "pos": "n.", "en": "the top or outside part of something", "ko": "표면, 지표면"}, {"word": "epicenter", "form": "epicenter", "pos": "n.", "en": "the point on the Earth's surface right above where an earthquake starts", "ko": "진앙"}, {"word": "instrument", "form": "instrument", "pos": "n.", "en": "a tool used for measuring or for scientific work", "ko": "기구, 측정 장비"}, {"word": "magnitude", "form": "magnitude", "pos": "n.", "en": "the size or strength of an earthquake", "ko": "규모"}, {"word": "predict", "form": "predicted", "pos": "v.", "en": "to say what will happen in the future", "ko": "예측하다"}, {"word": "sway", "form": "sway", "pos": "v.", "en": "to move slowly from side to side", "ko": "흔들리다"}, {"word": "collapse", "form": "collapse", "pos": "v.", "en": "to fall down suddenly", "ko": "붕괴하다, 무너지다"}], "vocab": [["beneath", "The cat is sleeping beneath the table.", ["under or below something", "high above", "next to", "far away from"], 0, "beneath = ~의 아래에."], ["solid", "Ice is water in a solid form.", ["hard and firm, not liquid or gas", "soft and runny", "easy to pour", "full of air"], 0, "solid = 단단한."], ["plate", "Korea sits on the Eurasian plate.", ["a deep ocean", "one of the huge pieces that make up Earth's outer layer", "a dish for food", "a kind of mountain"], 1, "plate = 판, 지각판 (접시라는 뜻도 있어요)."], ["pressure", "The pressure of the water broke the pipe.", ["a cold wind", "a soft sound", "the force of pushing on something", "a kind of light"], 2, "pressure = 압력."], ["release", "The volcano released hot gas.", ["to slowly hide", "to stop completely", "to hold tightly inside", "to let something go out suddenly"], 3, "release = 방출하다."], ["surface", "Leaves floated on the surface of the pond.", ["the center", "the top or outside part of something", "the bottom", "the deep inside"], 1, "surface = 표면."], ["epicenter", "The town near the epicenter was badly damaged.", ["the deepest ocean", "a safe shelter", "a weather station", "the point on the Earth's surface right above where an earthquake starts"], 3, "epicenter = 진앙."], ["instrument", "A thermometer is an instrument that measures heat.", ["a kind of food", "a type of rock", "a tool used for measuring or for scientific work", "a piece of clothing"], 2, "instrument = 기구 (악기라는 뜻도 있어요)."], ["magnitude", "The earthquake had a magnitude of 6.2.", ["the place it happens", "the color of the ground", "the time it lasts", "the size or strength of an earthquake"], 3, "magnitude = (지진의) 규모."], ["predict", "It is hard to predict the weather a month ahead.", ["to repeat a story", "to forget the past", "to say what will happen in the future", "to describe today"], 2, "predict = 예측하다."], ["sway", "The tall trees swayed in the wind.", ["to fall straight down", "to move slowly from side to side", "to stay completely still", "to jump up"], 1, "sway = 좌우로 흔들리다."], ["collapse", "The old bridge collapsed in the storm.", ["to stand strong", "to fall down suddenly", "to grow taller", "to be repaired"], 1, "collapse = 무너지다."]], "comp": [{"type": "요약", "q": "Which is the best summary of the passage?", "options": ["Japan and Chile have the most earthquakes in the world.", "Fingernails grow at the same speed as mountains.", "Earthquakes can be predicted exactly by scientists.", "Earthquakes happen when stuck plates suddenly slip; they can be measured, and we can prepare for them."], "answer": 3, "ex": "원인(판의 미끄러짐) → 측정 → 대비, 글 전체를 담은 요약이에요."}, {"type": "세부 내용", "q": "Where is the shaking usually strongest?", "options": ["hundreds of kilometers away", "at the focus deep underground", "at the edge of the ocean", "at the epicenter"], "answer": 3, "ex": "3문단: the epicenter… the shaking is usually strongest there."}, {"type": "추론", "q": "Compared to a magnitude 5 earthquake, a magnitude 6 earthquake releases ______.", "options": ["about half the energy", "about 32 times more energy", "about 1,000 times more energy", "about the same energy"], "answer": 1, "ex": "한 단계 올라갈 때마다 약 32배 → 5에서 6은 약 32배."}, {"type": "관점·근거 평가", "q": "Which detail best supports the idea that earthquake damage can be reduced?", "options": ["Buildings can be designed to sway, and students practice drills.", "Waves can be felt far away.", "Plates slide a few centimeters each year.", "Pressure builds up for years."], "answer": 0, "ex": "흔들리도록 설계된 건물과 대피 훈련이 '피해를 줄일 수 있다'의 근거예요."}, {"type": "문맥 속 어휘", "q": "\"Buildings can be designed to sway instead of collapse.\" What does \"sway\" mean?", "options": ["fall down completely", "move gently from side to side", "stay perfectly still", "grow taller"], "answer": 1, "ex": "sway = 좌우로 흔들리다."}, {"type": "문법 · 수동태 + 조동사 (can be measured)", "q": "Earthquakes can ______ with a seismometer.", "options": ["be measured", "measured", "measure", "being measured"], "answer": 0, "ex": "지진이 '측정되는' 것 → can be + 과거분사."}, {"type": "문법 · 수동태 + 조동사 (can be measured)", "q": "Strong buildings ______ designed to sway.", "options": ["are can", "can", "can being", "can be"], "answer": 3, "ex": "조동사 + be + 과거분사 → can be designed."}, {"type": "문법 · 수동태 + 조동사 (can be measured)", "q": "Which sentence is correct?", "options": ["Damage can is reduced.", "Damage can be reduced.", "Damage can reduced.", "Damage can be reduce."], "answer": 1, "ex": "can be + 과거분사(reduced)."}]}, "2": {"passage": "Most people run away from volcanoes. Volcanologists, who study volcanoes for a living, often walk toward them. Their work is part science and part detective work.\n\nA volcanologist's day might start before sunrise at an observatory near an active volcano. First, the team checks data from instruments placed around the mountain. Seismometers record tiny earthquakes, which often increase when magma is rising underground. GPS stations measure whether the ground is bulging, like a balloon slowly being filled with air. Special sensors also measure gases such as sulfur dioxide, which smells like rotten eggs. Volcanologists also study ash clouds, which can be dangerous for airplanes flying nearby.\n\nSometimes the scientists must collect samples in person. They wear heat-resistant suits, helmets, and gas masks. The work is hot, heavy, and sometimes frightening. Near a lava flow, the temperature can reach more than 1,000 degrees Celsius, so they use long metal poles to scoop up glowing rock.\n\nWhy take such risks? The answer is simple: good warnings save lives. In 1991, scientists noticed that Mount Pinatubo in the Philippines was showing many warning signs. They advised the government to move people away from the mountain. Days later, the volcano erupted in one of the largest eruptions of the twentieth century. Because so many people had already left, thousands of lives were saved.\n\nStill, volcanoes are hard to predict. Some show signs for months and never erupt, while others erupt with very little warning. That is why volcano watchers never stop watching.", "speaking": "Could you do a dangerous job like a volcanologist? Compare a dangerous job with a safe job. (45 seconds)", "speakStarters": ["A dangerous job like … is exciting, but … .", "On the other hand, a safe job like … .", "I would choose … because … ."], "prompt": "Describe a day in the life of a scientist. Write two paragraphs (about 120 words): Paragraph 1 — the morning. Paragraph 2 — the afternoon and why the work matters.", "starters": ["Paragraph 1: A … , who studies … , starts the day by … .", "First, … .", "Paragraph 2: In the afternoon, … .", "This work is important because … ."], "cards": [{"word": "observatory", "form": "observatory", "pos": "n.", "en": "a building where scientists watch and study nature or the sky", "ko": "관측소"}, {"word": "active", "form": "active", "pos": "adj.", "en": "able to erupt now or soon (for a volcano)", "ko": "활동 중인 (화산)"}, {"word": "data", "form": "data", "pos": "n.", "en": "facts and numbers collected for study", "ko": "자료, 데이터"}, {"word": "magma", "form": "magma", "pos": "n.", "en": "hot, melted rock under the ground", "ko": "마그마"}, {"word": "sensor", "form": "sensors", "pos": "n.", "en": "a device that notices and measures changes like heat or gas", "ko": "센서, 감지기"}, {"word": "rotten", "form": "rotten", "pos": "adj.", "en": "bad and smelly because it has gone off", "ko": "썩은"}, {"word": "sample", "form": "samples", "pos": "n.", "en": "a small amount of something taken for testing", "ko": "샘플, 표본"}, {"word": "lava", "form": "lava", "pos": "n.", "en": "hot, liquid rock that flows out of a volcano", "ko": "용암"}, {"word": "scoop", "form": "scoop", "pos": "v.", "en": "to pick something up with a spoon or a curved tool", "ko": "퍼내다, 떠내다"}, {"word": "risk", "form": "risks", "pos": "n.", "en": "the chance that something bad will happen", "ko": "위험, 위험 요소"}, {"word": "advise", "form": "advised", "pos": "v.", "en": "to tell someone what you think they should do", "ko": "조언하다, 권고하다"}, {"word": "erupt", "form": "erupted", "pos": "v.", "en": "to explode and send out rock, ash, and lava", "ko": "분출하다, 폭발하다"}], "vocab": [["observatory", "The observatory has a huge telescope.", ["a building where scientists watch and study nature or the sky", "a shopping mall", "a sports stadium", "a train station"], 0, "observatory = 관측소."], ["active", "Mount Etna is an active volcano.", ["able to erupt now or soon (for a volcano)", "very small", "completely dead", "made of ice"], 0, "active volcano = 활화산."], ["data", "The scientists studied the data from the test.", ["a kind of food", "a guess with no facts", "facts and numbers collected for study", "a type of song"], 2, "data = 자료."], ["magma", "Magma rises slowly inside the volcano.", ["cold water in a river", "soft sand on a beach", "a kind of ice", "hot, melted rock under the ground"], 3, "magma = 땅속의 녹은 암석 (밖으로 나오면 lava)."], ["sensor", "The light turns on when the sensor detects movement.", ["a device that notices and measures changes like heat or gas", "a paper map", "a kind of battery", "a wooden tool"], 0, "sensor = 감지기."], ["rotten", "The rotten fruit smelled terrible.", ["fresh and clean", "bad and smelly because it has gone off", "sweet and new", "hard and shiny"], 1, "rotten = 썩은."], ["sample", "The doctor took a blood sample.", ["a whole mountain", "a huge amount", "a kind of tool", "a small amount of something taken for testing"], 3, "sample = 표본."], ["lava", "Red lava flowed down the mountain.", ["cold, hard ice", "white smoke", "hot, liquid rock that flows out of a volcano", "clear water"], 2, "lava = 용암."], ["scoop", "She scooped some ice cream into a bowl.", ["to pour out", "to cut into pieces", "to throw away", "to pick something up with a spoon or a curved tool"], 3, "scoop up = 퍼 올리다."], ["risk", "Riding without a helmet is a big risk.", ["a free gift", "a safe choice", "the chance that something bad will happen", "a happy surprise"], 2, "risk = 위험."], ["advise", "The doctor advised me to rest.", ["to follow someone", "to laugh at someone", "to ignore someone", "to tell someone what you think they should do"], 3, "advise = 조언하다."], ["erupt", "The volcano erupted last night.", ["to stay quiet and still", "to freeze", "to become smaller", "to explode and send out rock, ash, and lava"], 3, "erupt = (화산이) 분출하다."]], "comp": [{"type": "요약", "q": "Which is the best summary of the passage?", "options": ["Volcanoes smell like rotten eggs.", "Volcanologists only work in the Philippines.", "Mount Pinatubo is the most dangerous volcano.", "Volcanologists watch volcanoes with many tools to give warnings that save lives."], "answer": 3, "ex": "화산학자들이 여러 장비로 화산을 관찰해 생명을 구하는 경고를 한다는 내용이에요."}, {"type": "세부 내용", "q": "What do GPS stations measure?", "options": ["whether the ground is bulging", "the temperature of lava", "the smell of gases", "how many people live nearby"], "answer": 0, "ex": "2문단: GPS stations measure whether the ground is bulging."}, {"type": "근거로 추론하기", "q": "If seismometers suddenly record many more tiny earthquakes, what might this mean?", "options": ["The volcano is falling asleep.", "The instruments are broken.", "Magma may be rising underground.", "The weather is getting colder."], "answer": 2, "ex": "작은 지진은 마그마가 올라올 때 늘어나요."}, {"type": "관점·근거 평가", "q": "Which evidence best supports the statement \"good warnings save lives\"?", "options": ["People left before Mount Pinatubo erupted, and thousands of lives were saved.", "Some volcanoes never erupt.", "Lava can reach 1,000 degrees Celsius.", "Sulfur dioxide smells like rotten eggs."], "answer": 0, "ex": "피나투보 화산 사례가 주장의 근거예요."}, {"type": "문맥 속 어휘", "q": "\"They use long metal poles to scoop up glowing rock.\" What does \"scoop up\" mean?", "options": ["paint carefully", "break into pieces", "throw far away", "pick up with a curved tool"], "answer": 3, "ex": "scoop up = 국자처럼 퍼 올리다."}, {"type": "문법 · 관계대명사 계속적 용법 (, who … / , which …)", "q": "Volcanologists, ______ study volcanoes, often walk toward them.", "options": ["whose", "which", "what", "who"], "answer": 3, "ex": "사람 + 콤마 → , who (계속적 용법)."}, {"type": "문법 · 관계대명사 계속적 용법 (, who … / , which …)", "q": "Sulfur dioxide, ______ smells like rotten eggs, is a gas.", "options": ["that", "which", "where", "who"], "answer": 1, "ex": "사물 + 콤마 → , which. 계속적 용법에는 that을 쓰지 않아요."}, {"type": "문법 · 관계대명사 계속적 용법 (, who … / , which …)", "q": "Which sentence is correct?", "options": ["My uncle, that is a pilot, travels a lot.", "My uncle, which is a pilot, travels a lot.", "My uncle who, is a pilot travels a lot.", "My uncle, who is a pilot, travels a lot."], "answer": 3, "ex": "사람 → , who … , 형태로 콤마 두 개."}]}, "3": {"passage": "The rain had been falling for three days when Nadia noticed the river.\n\nFrom her bedroom window, she could usually see a wide field and, beyond it, the slow brown river. Tonight, the field had disappeared. Black water was spreading toward the house, swallowing fence posts one by one.\n\nHer father had already left for his night shift at the hospital, and her mother was visiting relatives in another city. That left Nadia, who was twelve, and her grandfather, who walked with a cane. She tried to call her father, but the phone lines had already gone down. The radio crackled: \"Residents near the river should move to higher ground immediately.\"\n\n\"Grandpa, we have to go,\" Nadia said. He looked at the water and shook his head. \"I've lived here for forty years. This house has survived floods before.\"\n\nNadia's heart pounded. She knew the road to the school on the hill would soon be underwater, and she also knew her grandfather was stubborn. Taking a deep breath, she knelt beside his chair. \"Please,\" she said quietly. \"I can't do this without you.\"\n\nSomething in her voice changed his mind. Together, they packed his medicine, a flashlight, and the family photo album. Nadia held his arm as they waded through knee-deep water toward the hill.\n\nBy morning, the water had reached the windows of their house. But Nadia and her grandfather were safe, wrapped in blankets in the school gym, and her father was running through the door.", "speaking": "In a dangerous moment, what matters most? Compare two things, such as staying calm and acting quickly. (45 seconds)", "speakStarters": ["Staying calm and acting quickly are both important.", "Staying calm helps you … .", "On the other hand, acting quickly … .", "I think … matters more because … ."], "prompt": "Write two paragraphs (about 120 words). Paragraph 1: Describe the choice Nadia made and why it was important. Paragraph 2: What would you have done in her place, and why?", "starters": ["Paragraph 1: When the river rose, Nadia had to … .", "Her grandfather had … , so … .", "Paragraph 2: If I were Nadia, I would … .", "I think … because … ."], "cards": [{"word": "beyond", "form": "beyond", "pos": "prep.", "en": "on the far side of something", "ko": "~ 너머에"}, {"word": "swallow", "form": "swallowing", "pos": "v.", "en": "to cover something completely, as if eating it", "ko": "삼키다, 집어삼키다"}, {"word": "shift", "form": "shift", "pos": "n.", "en": "a set period of time when people work", "ko": "(교대) 근무 시간"}, {"word": "relative", "form": "relatives", "pos": "n.", "en": "a member of your family", "ko": "친척"}, {"word": "cane", "form": "cane", "pos": "n.", "en": "a stick that helps a person walk", "ko": "지팡이"}, {"word": "crackle", "form": "crackled", "pos": "v.", "en": "to make short, sharp, breaking sounds", "ko": "지지직거리다, 탁탁 소리 나다"}, {"word": "resident", "form": "Residents", "pos": "n.", "en": "a person who lives in a particular place", "ko": "주민"}, {"word": "immediately", "form": "immediately", "pos": "adv.", "en": "right now; without waiting", "ko": "즉시"}, {"word": "survive", "form": "survived", "pos": "v.", "en": "to stay alive or keep going through danger", "ko": "살아남다, 견뎌 내다"}, {"word": "stubborn", "form": "stubborn", "pos": "adj.", "en": "not willing to change your mind", "ko": "고집이 센"}, {"word": "wade", "form": "waded", "pos": "v.", "en": "to walk through water", "ko": "(물속을) 헤치며 걷다"}, {"word": "wrap", "form": "wrapped", "pos": "v.", "en": "to cover something by putting material around it", "ko": "감싸다"}], "vocab": [["beyond", "There is a lake beyond the hills.", ["on the far side of something", "right in front of", "inside of", "under"], 0, "beyond = ~ 너머에."], ["swallow", "The fog swallowed the whole town.", ["to lift something up", "to clean something", "to cover something completely, as if eating it", "to push something away"], 2, "swallow = 삼키다, 뒤덮다."], ["shift", "The nurse works the night shift.", ["a day off", "a set period of time when people work", "a holiday", "a short break"], 1, "shift = 교대 근무."], ["relative", "We visit our relatives during the holidays.", ["a classmate", "a member of your family", "a stranger", "a teacher"], 1, "relative = 친척."], ["cane", "My grandmother walks with a cane.", ["a stick that helps a person walk", "a big umbrella", "a wheel on a bike", "a kind of shoe"], 0, "cane = 지팡이."], ["crackle", "The fire crackled in the fireplace 거리는 심장 등)을 따라가는 3인칭 시점이에요."}, {"type": "갈등과 해결 평가", "q": "What is the main conflict, and how is it solved?", "options": ["Grandpa refuses to leave, but Nadia gently persuades him.", "The house is on fire, so they call firefighters.", "Nadia is lost, so her father finds her.", "The radio breaks, so they fix it."], "answer": 0, "ex": "고집 센 할아버지 vs 대피해야 하는 상황 → 나디아의 진심 어린 부탁으로 해결."}, {"type": "문맥 속 어휘", "q": "\"She also knew her grandfather was stubborn.\" What does \"stubborn\" mean?", "options": ["not willing to change his mind", "very tired", "easily scared", "very kind"], "answer": 0, "ex": "stubborn = 고집이 센."}, {"type": "문법 · 과거완료 (had already left)", "q": "When the water came, her father ______ for work.", "options": ["has already left", "already left", "already leaves", "had already left"], "answer": 3, "ex": "물이 오기 전에 이미 떠난 일 → 과거완료 had already left."}, {"type": "문법 · 과거완료 (had already left)", "q": "By morning, the water ______ the windows.", "options": ["has reached", "had reached", "reaches", "reaching"], "answer": 1, "ex": "아침이라는 과거 시점까지 완료 → had reached."}, {"type": "문법 · 과거완료 (had already left)", "q": "Which sentence is correct?", "options": ["When we arrived, the movie had already start.", "When we arrived, the movie had already started.", "When we arrived, the movie already had started was.", "When we arrived, the movie has already started."], "answer": 1, "ex": "had + 과거분사(started)."}]}, "4": {"passage": "Why does a watermelon cost more in winter than in summer? Why do concert tickets for a famous singer sell for so much money? The answers lie in two ideas that economists call supply and demand.\n\nSupply is how much of something is available to buy. Demand is how much people want it. When either of these changes, prices usually change too.\n\nThink about watermelons. In summer, farmers harvest huge numbers of them, so supply is high. Stores have more watermelons than they can easily sell, and prices drop. In winter, watermelons must be grown in heated greenhouses or shipped from far away. Supply is low, so prices rise.\n\nDemand works in a similar way. The more people want something, the higher its price usually goes. When a new toy suddenly becomes popular, shops may run out, and some sellers raise the price. When the trend ends, demand falls, and the same toy may end up in a sale bin.\n\nOther events can affect prices as well. A drought can destroy crops, so the price of vegetables jumps. On the other hand, a new factory can produce more phones, so the price of each phone may fall.\n\nUnderstanding supply and demand can help you make smart choices. The more you know about why prices change, the better you can plan your spending. For example, buying fruit when it is in season usually saves money, and waiting until a trend is over can be cheaper too.", "speaking": "How do you use your allowance? Compare saving money with spending it right away. (45 seconds)", "speakStarters": ["Saving and spending both have good points.", "When you save, … .", "On the other hand, when you spend right away, … .", "I usually … because … ."], "prompt": "Write two paragraphs (about 120 words). Paragraph 1: Name something whose price went up or down. Paragraph 2: Explain why, using supply or demand.", "starters": ["Paragraph 1: Recently, the price of … went up / down.", "It used to cost … , but now … .", "Paragraph 2: I think this happened because … .", "The more … , the … ."], "cards": [{"word": "economist", "form": "economists", "pos": "n.", "en": "a person who studies how money, goods, and trade work", "ko": "경제학자"}, {"word": "supply", "form": "supply", "pos": "n.", "en": "the amount of something that is available", "ko": "공급"}, {"word": "demand", "form": "demand", "pos": "n.", "en": "how much people want to buy something", "ko": "수요"}, {"word": "available", "form": "available", "pos": "adj.", "en": "able to be bought, used, or reached", "ko": "구할 수 있는, 이용 가능한"}, {"word": "harvest", "form": "harvest", "pos": "v.", "en": "to gather ing because the movie was bored.", "I was boring because the movie was boring.", "I was bored because the movie was boring."], "answer": 3, "ex": "사람은 bored(지루함을 느낀), 영화는 boring(지루하게 만드는)."}]}, "8": {"passage": "Frida Kahlo is one of the most famous painters of the twentieth century. What makes her work special is how honestly she painted her own life.\n\nFrida was born in 1907 in Mexico City, in a bright blue house that is now a museum. When she was six, she caught polio, an illness that left her right leg thinner than her left. Some children teased her. Still, she grew up strong-willed and curious, and she dreamed of becoming a doctor.\n\nThen, at eighteen, her life changed. The bus she was riding crashed into a streetcar, and she was badly injured. For months, she had to lie in bed. Her mother placed a mirror above the bed, and Frida began to paint the face she saw. What she painted was herself.\n\nOver her lifetime, Frida made about 200 paintings. More than fifty of them are self-portraits. In them, she shows her pain, her love, and her pride in Mexico. She often wore traditional Mexican dresses, and she painted monkeys, parrots, and bright tropical flowers around herself.\n\nWhat surprises many viewers is how direct her paintings are. She did not hide her injuries or her sadness. Instead, she turned them into art that is full of color and strength.\n\nFrida died in 1954, but her paintings are more popular today than ever. Her blue house in Mexico City now welcomes visitors from around the world. For many people, what she teaches is that our own stories, even painful ones, are worth telling.", "speaking": "Would you rather express yourself through painting, music, or dance? Compare two of them. (45 seconds)", "speakStarters": ["Painting and music are both ways to express feelings.", "With painting, you can … .", "On the other hand, music … .", "What I would choose is … because … ."], "prompt": "Introduce an artist you like in two paragraphs (about 120 words). Pa drift around. Tools, pens, and even food have to be fastened down with straps or velcro.\n\nEating is tricky too. Most food comes in sealed pouches. Astronauts have to add water to many meals. Bread is not allowed, because its tiny crumbs could float into the equipment. Instead, the crew eats tortillas. Even salt and pepper come in liquid form, since loose grains would drift away.\n\nKeeping clean is another challenge. Astronauts are not allowed to take showers, because water would form floating bubbles. Instead, they wipe their bodies with wet towels and use shampoo that they don't have to rinse out. Almost all the water on the station, including sweat and urine, is recycled into clean drinking water.\n\nWithout gravity, muscles and bones become weak. That is why astronauts have to exercise for about two hours every day on special machines. Living in space takes careful planning, but many astronauts say the view of Earth makes every challenge worth it.", "speaking": "What would you miss most in space? Compare two things you would miss. (45 seconds)", "speakStarters": ["In space, I would miss … and … .", "I would miss … because … .", "However, I would miss … even more because … ."], "prompt": "Write about one day on the space station in two paragraphs (about 120 words). Paragraph 1: the morning. Paragraph 2: the evening. Use have to and be allowed to.", "starters": ["Paragraph 1: I woke up in a sleeping bag attached to … .", "First, I had to … .", "Paragraph 2: In the evening, we are not allowed to … , so … .", "Before bed, I … ."], "cards": [{"word": "astronaut", "form": "astronauts", "pos": "n.", "en": "a person who travels into space", "ko": "우주비행사"}, {"word": "orbit", "form": "orbits", "pos": "v.", "en": "to move in a curved path around a planet or star", "ko": "궤도를 돌다"}, {"word": "gravity", "form": "gravity", "pos": "n.", "en": "the force that pulls things toward the ground", "ko": "중력"}, {"word": "attach", "form": "attached", "pos": "v.", "en": "to join or fix one thing to another", "ko": "붙이다, 고정하다"}, {"word": "drift", "form": "drift", "pos": "v.", "en": "to move slowly without control", "ko": "떠다니다, 표류하다"}, {"word": "pouch", "form": "pouches", "pos": "n.", "en": "a small, soft bag", "ko": "작은 주머니, 파우치"}, {"word": "crumb", "form": "crumbs", "pos": "n.", "en": "a very small piece of bread or cake", "ko": "부스러기"}, {"word": "tortilla", "form": "tortillas", "pos": "n.", "en": "a thin, flat, round bread from Mexico", "ko": "토르티야"}, {"word": "liquid", "form": "liquid", "pos": "n.", "en": "something that flows, like water or oil", "ko": "액체"}, {"word": "rinse", "form": "rinse", "pos": "v.", "en": "to wash something with clean water to remove soap", "ko": "헹구다"}, {"word": "recycle", "form": "recycled", "pos": "v.", "en": "to treat used things so they can be used again", "ko": "재활용하다"}, {"word": "bone", "form": "bones", "pos": "n.", "en": "one of the hard parts inside your body", "ko": "뼈"}], "vocab": [["astronaut", "The astronaut floated inside the station.", ["a person who flies planes on Earth", "a person who travels into space", "a person who sails ships", "a person who studies rocks"], 1, "astronaut = 우주비행사."], ["orbit", "The Moon orbits the Earth.", ["to move in a curved path around a planet or star", "to move in a straight line", "to stay still", "to fall down"], 0, "orbit = 궤도를 돌다."], ["gravity", "Gravity makes the apple fall from the tree.", ["a type of wind", "the force that pulls things toward the ground", "a loud noise", "a kind of light"], 1, "gravity = 중력."], ["attach", "Attach the photo to your letter.", ["to remove", "to fold", "to join or fix one thing to another", "to throw"], 2, "attach = 붙이다."], ["drift", "The boat drifted away from the shore.", ["to run fast", "to stay fixed in one place", "to sink", "to move slowly without control"], 3, "drift = 떠다니다."], ["pouch", "Space food comes in a plastic pouch.", ["a small, soft bag", "a glass bottle", "a wooden plate", "a big metal box"], 0, "pouch = 작은 봉지."], ["crumb", "There were crumbs all over the table.", ["a whole loaf", "a big slice", "a drop of water", "a very small piece of bread or cake"], 3, "crumb = 빵 부스러기."], ["tortilla", "We wrapped beans in a tortilla.", ["a fried egg", "a kind of soup", "a thin, flat, round bread from Mexico", "a thick loaf of bread"], 2, "tortilla = 토르티야 (얇고 둥근 빵)."], ["liquid", "Milk is a liquid.", ["something hard like ice", "something that flows, like water or oil", "a gas like air", "a powder like sugar"], 1, "liquid = 액체."], ["rinse", "Rinse the shampoo out of your hair.", ["to add more soap", "to wash something with clean water to remove soap", "to dry with a towel", "to make something dirty"], 1, "rinse = 헹구다."], ["recycle", "We recycle paper and cans at school.", ["to treat used things so they can be used again", "to throw away forever", "to burn", "to hide"], 0, "recycle = 재활용하다."], ["bone", "Milk helps build strong bones.", ["the soft skin", "the blood in your body", "one of the hard parts inside your body", "the hair on your head"], 2, "bone = 뼈."]], "comp": [{"type": "요약", "q": "Which is the best summary of the passage?", "options": ["The space station stays still above Korea.", "Astronauts take long showers every morning.", "Living on the space station is hard because of low gravity, so astronauts follow special rules for sleeping, eating, cleaning, and exercise.", "Bread is the main food on the space station."], "answer": 2, "ex": "중력이 거의 없어서 생기는 생활 규칙들을 정리한 글이에요."}, {"type": "세부 내용", "q": "Why is bread not allowed on the space station?", "options": ["It is too expensive.", "Its crumbs could float into the equipment.", "It goes bad quickly.", "Astronauts don't like it."], "answer": 1, "ex": "its tiny crumbs could float into the equipment."}, {"type": "추론", "q": "Why does the crew see about sixteen sunrises a day?", "options": ["The station has many windows.", "Astronauts sleep very little.", "The Sun moves very fast.", "The station goes around the Earth about every 90 minutes."], "answer": 3, "ex": "24시간 ÷ 90분 ≈ 16바퀴."}, {"type": "관점·근거 평가", "q": "Which detail best supports the idea that life in space \"takes careful planning\"?", "options": ["Astronauts like the view of Earth.", "Even salt and pepper must come in liquid form.", "The station is 400 kilometers high.", "There are sixteen sunsets a day."], "answer": 1, "ex": "소금·후추까지 액체로 만들어야 할 만큼 세심한 계획이 필요해요."}, {"type": "문맥 속 어휘", "q": "\"Shampoo that they don't have to rinse out.\" What does \"rinse\" mean?", "options": ["wash with water to remove soap", "dry with a towel", "add color to", "cut short"], "answer": 0, "ex": "rinse = 물로 헹구다."}, {"type": "문법 · have to / be allowed to", "q": "Astronauts ______ exercise for about two hours every day.", "options": ["have to", "are allowed", "allowed to", "has to"], "answer": 0, "ex": "꼭 해야 하는 일 → have to + 동사원형."}, {"type": "문법 · have to / be allowed to", "q": "Astronauts ______ take showers on the station.", "options": ["are not allowed to", "not allowed", "have not to", "don't allowed to"], "answer": 0, "ex": "허락되지 않는다 → be not allowed to + 동사원형."}, {"type": "문법 · have to / be allowed to", "q": "Which sentence is correct?", "options": ["We don't allowed to run in the hall.", "We are not allowed to run in the hall.", "We are not allow to run in the hall.", "We are not allowed run in the hall."], "answer": 1, "ex": "be allowed to + 동사원형."}]}, "11": {"passage": "For more than fifty years, robots have explored Mars. Rovers have rolled across its red dust, taken photos, and found signs that water once flowed there. Now some space agencies and companies want to send humans. Is this a good idea?\n\nSupporters say yes. First, humans can do things that robots cannot. A rover may take hours to drive a few meters, but a person could explore far more ground in a single day and make quick decisions. Second, Mars may hold answers to big questions, such as whether life ever existed beyond Earth. Third, some people believe that settling on another planet could give humanity a backup home in the distant future. Finally, the challenge itself would push scientists to invent new technologies that could help people on Earth.\n\nOn the other hand, critics point to serious problems. The trip would take about six to nine months each way. Mars has a thin atmosphere, mostly carbon dioxide, and the temperature often drops far below freezing. Astronauts would also be exposed to dangerous radiation from space. However, the biggest concern for many critics is cost. They argue that the huge budget could be used to solve problems on Earth, such as hunger or climate change.\n\nBoth sides make strong points. However, they may not be completely opposed. Robots can continue to prepare the way, while scientists work on making the journey safer. The real question may not be whether humans go to Mars, but when they will be ready.", "speaking": "If you went to Mars, what would you take with you? Compare two items and choose one. (45 seconds)", "speakStarters": ["I would think about taking … or … .", "… would be useful because … .", "On the other hand, … would … .", "In the end, I would choose … ."], "prompt": "Should humans go to Mars? Write two paragraphs (about 120 words). Paragraph 1: your opinion and reasons. Paragraph 2: one point from the other side, starting with \"However,\" or \"On the other hand,\" and your answer to it.", "starters": ["Paragraph 1: I believe humans should / should not go to Mars.", "First, … . Second, … .", "Paragraph 2: On the other hand, some people say … .", "However, I still think … because … ."], "cards": [{"word": "rover", "form": "Rovers", "pos": "n.", "en": "a vehicle that drives on the surface of a planet or moon to explore it", "ko": "탐사 로버"}, {"word": "agency", "form": "agencies", "pos": "n.", "en": "an organization that does a special job, often for a government", "ko": "기관"}, {"word": "supporter", "form": "Supporters", "pos": "n.", "en": "a person who agrees with and helps an idea", "ko": "지지자"}, {"word": "exist", "form": "existed", "pos": "v.", "en": "to be real; to be present", "ko": "존재하다"}, {"word": "settle", "form": "settling", "pos": "v.", "en": "to go and live in a new place", "ko": "정착하다"}, {"word": "backup", "form": "backup", "pos": "n.", "en": "something extra you can use if the first one fails", "ko": "예비, 대비책"}, {"word": "critic", "form": "critics", "pos": "n.", "en": "a person who points out problems with an idea", "ko": "비판하는 사람"}, {"word": "atmosphere", "form": "atmosphere", "pos": "n.", "en": "the layer of gases around a planet", "ko": "대기"}, {"word": "radiation", "form": "radiation", "pos": "n.", "en": "dangerous energy that can harm living things", "ko": "방사선"}, {"word": "concern", "form": "concern", "pos": "n.", "en": "a worry", "ko": "걱정, 우려"}, {"word": "budget", "form": "budget", "pos": "n.", "en": "the amount of money available for something", "ko": "예산"}, {"word": "opposed", "form": "opposed", "pos": "adj.", "en": "completely against or different from each other", "ko": "반대되는, 대립하는"}], "vocab": [["rover", "The rover sent pictures from Mars.", ["a kind of spaceship that flies", "a telescope", "a vehicle that drives on the surface of a planet or moon to explore it", "a space suit"], 2, "rover = 탐사 차량."], ["agency", "NASA is a space agency.", ["a family", "an organization that does a special job, often for a government", "a small shop", "a sports team"], 1, "agency = 기관."], ["supporter", "The supporters of the plan cheered.", ["a person who forgets", "a person who agrees with and helps an idea", "a person who is unsure", "a person who disagrees"], 1, "supporter = 지지자."], ["exist", "Do aliens really exist?", ["to be broken", "to disappear", "to be real; to be present", "to be imaginary"], 2, "exist = 존재하다."], ["settle", "Many families settled near the river.", ["to leave forever", "to travel around", "to visit for a day", "to go and live in a new place"], 3, "settle = 정착하다."], ["backup", "Always keep a backup of your files.", ["a final ending", " a person could explore far more ground… and make quick decisions."}, {"type": "주장과 근거 평가", "q": "Which reason do critics consider the BIGGEST concern?", "options": ["inventing new technology", "the red dust", "the cost, which could be used to solve problems on Earth", "finding signs of water"], "answer": 2, "ex": "However, the biggest concern for many critics is cost."}, {"type": "문맥 속 어휘", "q": "\"Mars has a thin atmosphere.\" What is an \"atmosphere\"?", "options": ["the rocky ground", "a kind of rocket", "the layer of gases around a planet", "the temperature at night"], "answer": 2, "ex": "atmosphere = 행성을 둘러싼 대기."}, {"type": "문법 · however / on the other hand", "q": "Mars has water ice. ______, its air is too thin to breathe.", "options": ["Because", "For example", "So", "However"], "answer": 3, "ex": "앞 내용과 반대 → However."}, {"type": "문법 · however / on the other hand", "q": "Robots are cheaper. On the ______ hand, humans can make quick decisions.", "options": ["one", "another", "second", "other"], "answer": 3, "ex": "On the other hand = 반면에."}, {"type": "문법 · however / on the other hand", "q": "Which sentence is correct?", "options": ["The trip is long. However, many people still want to go.", "However the trip, is long people want to go.", "The trip is long however, so people want to go.", "The trip is long, however people want to go however."], "answer": 0, "ex": "문장 앞 However + 콤마."}]}, "12": {"passage": "Report Number 47, from Explorer Zik to the Council of Planet K\n\nGreetings, Council members. I have now been watching the blue planet called Earth for one of its years. Here is what I have learned about the strange beings who live there, the humans.\n\nHumans spend a great deal of time staring at small glowing rectangles. At first, I thought these rectangles were their leaders. Now I understand that they are tools for talking to other humans who are far away. Oddly, humans often use them even when their friends are sitting right beside them.\n\nHumans also have a ritual called \"breakfast.\" Every morning, they eat round, flat objects and drink a hot brown liquid that seems to give them power. Without it, many become slow and grumpy.\n\nYet humans also surprised me. When a storm destroyed homes in one of their villages, strangers came from everywhere to help. They carried food, built shelters, and held each other when they cried. On Planet K, we fix problems with machines, but humans fix them with each other.\n\nI must also report that humans are hurting their planet. Their air is getting warmer, and their oceans are filling with plastic. Some humans are working hard to stop this, and I hope they will succeed.\n\nMy ship will be leaving Earth's orbit in three days. By the time this message reaches you, I will be crossing the outer moons. When I return, I will be bringing a small gift from Earth: a seed. Humans say that if you care for it, it will grow.", "speaking": "If you met an alien, what would you say about Earth? Compare one good thing and one problem on Earth. (45 seconds)", "speakStarters": ["I would tell the alien that Earth is … .", "One good thing is … .", "On the other hand, one problem is … .", "I hope … ."], "prompt": "Write a letter to an alien introducing Earth, in two paragraphs (about 120 words). Paragraph 1: what is wonderful about Earth. Paragraph 2: one problem and what humans will be doing to fix it.", "starters": ["Dear friend from another planet,", "Paragraph 1: Earth is a planet where … .", "Paragraph 2: However, Earth has a problem: … .", "Next year, many people will be … ."], "cards": [{"word": "council", "form": "Council", "pos": "n.", "en": "a group of people chosen to make decisions", "ko": "의회, 위원회"}, {"word": "being", "form": "beings", "pos": "n.", "en": "a living creature", "ko": "존재, 생명체"}, {"word": "glowing", "form": "glowing", "pos": "adj.", "en": "giving out a soft, steady light", "ko": "빛나는"}, {"word": "rectangle", "form": "rectangles", "pos": "n.", "en": "a shape with four straight sides and four right angles", "ko": "직사각형"}, {"word": "oddly", "form": "Oddly", "pos": "adv.", "en": "in a strange or surprising way", "ko": "이상하게도"}, {"word": "ritual", "form": "ritual", "pos": "n.", "en": "something done in the same way, often every day or on special days", "ko": "의식, 늘 하는 일"}, {"word": "grumpy", "form": "grumpy", "pos": "adj.", "en": "a little angry and unfriendly", "ko": "짜증 난"}, {"word": "stranger", "form": "strangers", "pos": "n.", "en": "a person you do not know", "ko": "낯선 사람"}, {"word": "shelter", "form": "shelters", "pos": "n.", "en": "a place that protects people from danger or bad weather", "ko": "대피소, 피난처"}, {"word": "succeed", "form": "succeed", "pos": "v.", "en": "to do what you tried to do", "ko": "성공하다"}, {"word": "orbit", "form": "orbit", "pos": "n.", "en": "the curved path of something moving around a planet", "ko": "궤도"}, {"word": "seed", "form": "seed", "pos": "n.", "en": "a small part of a plant that can grow into a new plant", "ko": "씨앗"}], "vocab": [["council", "The student council planned the festival.", ["a group of people chosen to make decisions", "a family pet", "a single person", "a kind of spaceship"], 0, "council = 위원회."], ["being", "Are there other intelligent beings in space?", ["a machine", "an empty box", "a living creature", "a rock"], 2, "being = 생명체."], ["glowing", "We saw glowing fireflies in the field.", ["very loud", "giving out a soft, steady light", "very cold", "completely dark"], 1, "glowing = 은은하게 빛나는."], ["rectangle", "A door is shaped like a rectangle.", ["a round shape", "a star shape", "a shape with four straight sides and four right angles", "a shape with three sides"], 2, "rectangle = 직사각형."], ["oddly", "Oddly, the cat was not hungry.", ["happily", "in a strange or surprising way", "normally", "as expected"], 1, "oddly = 이상하게도."], ["ritual", "Reading before bed is my nightly ritual.", ["something done in the same way, often every day or on special days", "a surprise", "a mistake", "something done only once"], 0, "ritual = 의식처럼 반복하는 일."], ["grumpy", "Dad is grumpy before his coffee.", ["calm", "excited", "a little angry and unfriendly", "cheerful"], 2, "grumpy = 투덜대는."], ["stranger", "Don't open the door for a stranger.", ["a person you do not know", "a neighbor you know well", "a close friend", "a family member"], 0, "stranger = 낯선 사람."], ["shelter", "We found shelter from the rain under a bridge.", ["a broken window", "an open field", "a place that protects people from danger or bad weather", "a dangerous road"], 2, "shelter = 피난처."], ["succeed", "If you keep trying, you will succeed.", ["to fail", "to forget", "to give up", "to do what you tried to do"], 3, "succeed = 성공하다."], ["orbit", "The satellite is in orbit around Earth.", ["a straight road", "the curved path of something moving around a planet", "a mountain top", "a deep hole"], 1, "orbit = 궤도."], ["seed", "Plant the seed in the soil.", ["a dead leaf", "a flower petal", "a kind of rock", "a small part of a plant that can grow into a new plant"], 3, "seed = 씨앗."]], "comp": [{"type": "요약", "q": "Which is the best summary of the story?", "options": ["An alien takes control of Earth's phones.", "The Council of Planet K visits Earth for breakfast.", "An alien explorer reports what is strange, kind, and worrying about humans before leaving Earth.", "Humans travel to Planet K to give a seed."], "answer": 2, "ex": "외계인 탐사대원이 인간에 대해 관찰한 점을 보고하는 이야기예요."}, {"type": "세부 내용", "q": "What did Zik first think the glowing rectangles were?", "options": ["the humans' leaders", "windows", "spaceships", "breakfast food"], "answer": 0, "ex": "At first, I thought these rectangles were their leaders."}, {"type": "추론", "q": "What is the \"hot brown liquid\" most likely to be?", "options": ["plastic", "coffee", "seawater", "melted chocolate cake"], "answer": 1, "ex": "아침에 마시고 없으면 grumpy해지는 뜨거운 갈색 음료 → 커피."}, {"type": "시점과 주제", "q": "Why does the writer tell the story from an alien's point of view?", "options": ["to explain chers call a Third Culture Kid, or TCK. The term describes children who spend a large part of their childhood in a culture that is different from their parents'. Their \"first culture\" is their family's home country, and their \"second culture\" is the place where they live. The \"third culture\" is the unique mix they create by combining both. Their number is growing as more families move abroad for work.\n\nGrowing up abroad, TCKs often develop impressive skills. Many speak two or more languages, and they tend to adapt quickly to new situations. Having made friends from many backgrounds, they are often open-minded and curious about the world. Studies also suggest that many TCKs later choose careers that involve travel or international work.\n\nHowever, this lifestyle has its challenges. Moving every few years means saying goodbye again and again. Returning to their \"home\" country, some TCKs feel like foreigners, because their classmates share memories and jokes that they missed. Some miss the places they have left for years afterward. Researchers have found that many TCKs feel they belong everywhere and nowhere at the same time.\n\nSo, where is home for a Third Culture Kid? For many, the answer is not a place at all. Feeling at home with people rather than places, they carry their sense of belonging with them. As Mina puts it, \"Home is wherever my family is having dinner.\"", "speaking": "What are the good and bad points of living in many countries? Give your opinion, one point from the other side, and an example. (60 seconds)", "speakStarters": ["In my opinion, living in many countries is … .", "For example, … .", "Some people might say … .", "Even so, I believe … ."], "prompt": "What does \"home\" mean to you? Write a three-paragraph essay (about 180 words): introduction, body with examples, and conclusion. Try to use one participle clause.", "starters": ["Paragraph 1: For many people, home is … . For me, home means … .", "Paragraph 2: First, … . For example, … . Living in … , I learned … .", "Paragraph 3: In conclusion, … ."], "cards": [{"word": "pause", "form": "pause", "pos": "v.", "en": "to stop for a short time before continuing", "ko": "잠시 멈추다"}, {"word": "raised", "form": "raised", "pos": "adj./v.", "en": "brought up and cared for as a child", "ko": "길러진, 자란"}, {"word": "complicated", "form": "complicated", "pos": "adj.", "en": "difficult to explain or understand because it has many parts", "ko": "복잡한"}, {"word": "term", "form": "term", "pos": "n.", "en": "a word or phrase with a particular meaning", "ko": "용어"}, {"word": "unique", "form": "unique", "pos": "adj.", "en": "being the only one of its kind; very special", "ko": "독특한, 유일한"}, {"word": "abroad", "form": "abroad", "pos": "adv.", "en": "in or to a foreign country", "ko": "해외에서, 해외로"}, {"word": "impressive", "form": "impressive", "pos": "adj.", "en": "making people admire something", "ko": "인상적인, 대단한"}, {"word": "adapt", "form": "adapt", "pos": "v.", "en": "to change your behavior to fit a new situation", "ko": "적응하다"}, {"word": "background", "form": "backgrounds", "pos": "n.", "en": "a person's family, culture, and experiences", "ko": "배경, 출신"}, {"word": "career", "form": "careers", "pos": "n.", "en": "a job that someone does for a long period of their life", "ko": "직업, 경력"}, {"word": "lifestyle", "form": "lifestyle", "pos": "n.", "en": "the way a person lives", "ko": "생활 방식"}, {"word": "foreigner", "form": "foreigners", "pos": "n.", "en": "a person from another country", "ko": "외국인"}, {"word": "belong", "form": "belong", "pos": "v.", "en": "to feel happy and accepted in a place or group", "ko": "소속감을 느끼다, ~에 속하다"}], "vocab": [["pause", "She paused before answering the question.", ["to leave forever", "to shout loudly", "to speak very fast", "to stop for a short time before continuing"], 3, "pause = 잠시 멈추다."], ["raised", "He was born in Busan but raised in Canada.", ["built by someone", "brought up and cared for as a child", "sold to someone", "sent away d accepted in a place or group", "to want to leave"], 2, "belong = 속하다. a sense of belonging = 소속감."]], "comp": [{"type": "주제·요지", "q": "What is the main idea of the passage?", "options": ["Living abroad makes it impossible to make friends.", "Mina wants to move back to Seoul.", "Third Culture Kids gain special skills and face challenges, and many find home in people rather than places.", "Third Culture Kids should never move abroad."], "answer": 2, "ex": "TCK의 장점·어려움과 '집'의 의미를 다룬 글이에요."}, {"type": "세부 내용", "q": "According to the passage, what is the \"third culture\"?", "options": ["the unique mix TCKs create by combining their first and second cultures", "the culture of their school only", "the culture of the country they will live in next", "the culture of their grandparents"], "answer": 0, "ex": "2문단: The \"third culture\" is the unique mix they create by combining both."}, {"type": "추론", "q": "Why might some TCKs feel like foreigners in their \"home\" country?", "options": ["They don't like their parents' country.", "They missed shared memories and jokes that their classmates have.", "They cannot speak any language.", "They are not allowed to go to school there."], "answer": 1, "ex": "classmates share memories and jokes that they missed."}, {"type": "추론", "q": "What does Mina mean by \"Home is wherever my family is having dinner\"?", "options": ["Her family moves every night.", "For her, home is being with the people she loves, not a fixed place.", "She wants to eat dinner more often.", "She only feels at home in restaurants."], "answer": 1, "ex": "장소보다 사람(가족)과 함께 있는 곳이 집이라는 뜻이에요."}, {"type": "어조·글쓴이의 의도", "q": "What is the writer's attitude toward Third Culture Kids?", "options": ["balanced and understanding, showing both strengths and challenges", "bored and uninterested", "angry and critical", "jealous and unfriendly"], "answer": 0, "ex": "장점과 어려움을 모두 공정하게 다루는 공감하는 어조예요."}, {"type": "문법 · 분사구문 (Growing up abroad, …)", "q": "______ abroad, TCKs often develop impressive skills.", "options": ["Grown up", "Growing up", "To growing up", "Grow up"], "answer": 1, "ex": "분사구문: (As they grow up) → Growing up."}, {"type": "문법 · 분사구문 (Growing up abroad, …)", "q": "______ friends from many backgrounds, they are often open-minded.", "options": ["To make", "Made", "Make", "Having made"], "answer": 3, "ex": "먼저 일어난 일 → Having + 과거분사."}, {"type": "문법 · 분사구문 (Growing up abroad, …)", "q": "Which sentence uses a participle clause correctly?", "options": ["Feeling tired, she went to bed early.", "She feeling tired, went to bed early.", "Feeling tired, so she went to bed early.", "Felt tired, she went to bed early."], "answer": 0, "ex": "분사구문 + 콤마 + 주어 + 동사. 주어는 같아야 해요."}]}, "2": {"passage": "When I was eight, my family moved from Busan to Toronto, and I had to switch languages almost overnight. At home, we spoke Korean. At school, everything happened in English. For the first few months, I felt like two different people living in one body.\n\nIn Korean, I was talkative and funny. I joked with my grandmother on the phone and argued with my brother about whose turn it was to choose the TV channel. In English, however, I was quiet and careful. I often knew exactly what I wanted to say, but the words arrived too late, after the conversation had already moved on.\n\nSlowly, things changed. I started dreaming in English, which surprised me. I also noticed that I could do something my classmates couldn't. When my mother went to the doctor, I translated for her. When a new Korean student joined our class, I was not only her classmate but also her guide.\n\nToday, I don't think of myself as two people anymore. Instead, I think of my languages as two windows looking out at the same world. Some ideas fit better in Korean, like the warm feeling of jeong, a kind of deep connection that English has no single word for. Other ideas, like the quick humor of my school friends, feel more natural in English.\n\nBeing bilingual is not only useful but also part of who I am. Sometimes I still mix the two in one sentence, and my parents laugh. I used to feel embarrassed about that. Now I see it as my own language, one that only people like me can truly speak.", "speaking": "Which language do you think in? Give your opinion, one different view, and an example. (60 seconds)", "speakStarters": ["I usually think in … .", "For example, when I … , I … .", "Some people say … , but … .", "So I believe … ."], "prompt": "Write a three-paragraph essay (about 180 words) about yourself as a language learner. Paragraph 1: introduction. Paragraph 2: examples. Paragraph 3: what language means to you. Use not only … but also … at least once.", "starters": ["Paragraph 1: When I speak … , I feel … .", "Paragraph 2: For example, … . Learning English is not only … but also … .", "Paragraph 3: In the end, … ."], "cards": [{"word": "switch", "form": "switch", "pos": "v.", "en": "to change from one thing to another", "ko": "바꾸다, 전환하다"}, {"word": "overnight", "form": "overnight", "pos": "adv.", "en": "very quickly or suddenly; during one night", "ko": "하룻밤 사이에, 갑자기"}, {"word": "talkative", "form": "talkative", "pos": "adj.", "en": "liking to talk a lot", "ko": "수다스러운, 말이 많은"}, {"word": "argue", "form": "argued", "pos": "v.", "en": "to speak angrily with someone because you disagree", "ko": "말다툼하다"}, {"word": "conversation", "form": "conversation", "pos": "n.", "en": "a talk between two or more people", "ko": "대화"}, {"word": "translate", "form": "translated", "pos": "v.", "en": "to change words from one language into another", "ko": "번역하다, 통역하다"}, {"word": "guide", "form": "guide", "pos": "n.", "en": "a person who shows others the way", "ko": "안내자"}, {"word": "connection", "form": "connection", "pos": "n.", "en": "a relationship that joins people or things", "ko": "유대, 연결"}, {"word": "humor", "form": "humor", "pos": "n.", "en": "the quality of being funny", "ko": "유머"}, {"word": "natural", "form": "natural", "pos": "adj.", "en": "normal and easy, n ced", "very strange", "difficult", "fake and forced"], 0, "natural = 자연스러운."], ["bilingual", "Many children in Canada are bilingual.", ["able to speak two languages well", "speaking no language", "unable to read", "speaking one language only"], 0, "bilingual = 이중 언어를 쓰는."], ["embarrassed", "I was embarrassed when I tripped on stage.", ["proud", "feeling shy or uncomfortable because of what others think", "bored", "calm"], 1, "embarrassed = 창피한."], ["truly", "I am truly sorry.", ["rarely", "really; completely", "hardly", "falsely"], 1, "truly = 진정으로."]], "comp": [{"type": "주제·요지", "q": "What is the main idea of the essay?", "options": ["Korean is easier to learn than English.", "Speaking two languages is always embarrassing.", "The writer wants to move back to Busan.", "The writer learned to see two languages as one rich identity instead of two separate selves."], "answer": 3, "ex": "두 언어가 결국 하나의 '나'를 만든다는 것이 요지예요."}, {"type": "세부 내용", "q": "How was the writer different in English at first?", "options": ["more talkative and funny", "angry and loud", "quiet and careful", "exactly the same as in Korean"], "answer": 2, "ex": "In English, however, I was quiet and careful."}, {"type": "추론", "q": "Why did the words \"arrive too late\" for the writer in English?", "options": ["The writer did not want to talk.", "The classmates spoke Korean.", "The writer needed more time to put thoughts into English.", "The teacher did not allow talking."], "answer": 2, "ex": "말하고 싶은 것은 알았지만 영어로 바꾸는 데 시간이 걸렸어요."}, {"type": "추론", "q": "What does the writer mean by \"two windows looking out at the same world\"?", "options": ["The writer can only see the world through one language.", "The writer's house has two windows.", "The writer prefers Korean to English.", "Each language gives a different view, but they belong to one person."], "answer": 3, "ex": "두 언어는 같은 세상을 보는 서로 다른 창이라는 비유예요."}, {"type": "어조·글쓴이의 태도", "q": "How does the writer feel about mixing languages now?", "options": ["angry at is grandmother always added extra sesame oil. To his surprise, the plate was empty in minutes. As the class tasted the kimbap, several students asked him how to make it at home. Even Tyler came back for seconds. \"If I had known Korean food was this good,\" Tyler admitted, \"I wouldn't have said anything that first day.\"\n\nThat night, as Ji-ho thought about the sandwich weeks, he realized something: if he had kept hiding his lunch, he would still be pretending today. He opened the fridge and found his mother's leftover kimchi.\n\nThe next morning, he asked for rice again.", "speaking": "Tell about a time you stayed true to yourself. Give your opinion, another view, and an example. (60 seconds)", "speakStarters": ["I think it is important to be yourself because … .", "For example, one time I … .", "Some people might say fitting in is easier, but … .", "So, … ."], "prompt": "Write a letter to Ji-ho in three paragraphs (about 180 words). Paragraph 1: what you thought of his story. Paragraph 2: a similar experience or advice. Paragraph 3: encouragement. Try to use a mixed conditional.", "starters": ["Paragraph 1: Dear Ji-ho, I read your story, and … .", "Paragraph 2: I once … . If I had … , I would … now.", "Paragraph 3: Remember that … . Your friend, …"], "cards": [{"word": "container", "form": "container", "pos": "n.", "en": "a box, jar, or bottle used to hold things", "ko": "용기, 그릇"}, {"word": "lid", "form": "lid", "pos": "n.", "en": "the top cover of a box or pot", "ko": "뚜껑"}, {"word": "pretend", "form": "pretending", "pos": "v.", "en": "to act as if something is true when it is not", "ko": "~인 척하다"}, {"word": "stare", "form": "staring", "pos": "v.", "en": "to look at something for a long time", "ko": "빤히 보다"}, {"word": "invisible", "form": "invisible", "pos": "adj.", "en": "not able to be seen; ignored by others", "ko": "보이지 않는, 투명 인간 같은"}, {"word": "tradition", "form": "traditions", "pos": "n.", "en": "a custom passed down in a family or culture", "ko": "전통"}, ecret recipe.", ["a kind of plate", "a restaurant", "instructions for cooking a dish", "a shopping list"], 2, "recipe = 요리법."], ["surprise", "To my surprise, I won the prize.", ["a plan", "something expected", "something unexpected", "a rule"], 2, "to one's surprise = 놀랍게도."], ["admit", "He admitted that he was wrong.", ["to deny", "to forget", "to agree that something is true, often unwillingly", "to hide"], 2, "admit = 인정하다."], ["leftover", "We had leftover pizza for breakfast.", ["frozen solid", "brand new", "freshly made", "remaining after a meal"], 3, "leftover = 남은."], ["seconds", "The soup was so good that I had seconds.", ["the first serving", "a small bite", "a dessert", "a second serving of food"], 3, "come back for seconds = 한 번 더 먹으러 오다."], ["spicy", "Tteokbokki is spicy.", ["plain", "sweet", "having a hot, strong taste", "cold"], 2, "spicy = 매운."]], "comp": [{"type": "주제", "q": "What is the main theme of the story?", "options": ["Being proud of who you are is better than hiding to fit in.", "You should never bring lunch to school.", "Sandwiches are healthier than rice.", "Teachers should not give projects about food."], "answer": 0, "ex": "자신을 숨기기보다 있는 그대로 당당해지는 것이 주제예요."}, {"type": "세부 내용", "q": "What did Ji-ho bring for the class project?", "options": ["leftover kimchi", "kimbap he made with his grandmother", "spicy pork and rice", "a peanut butter sandwich"], "answer": 1, "ex": "he brought kimbap that he and his grandmother had rolled together."}, {"type": "추론", "q": "Why did the sandwich \"taste like nothing at all\"?", "options": ["His mother forgot the peanut butter.", "He was sick.", "The bread was old.", "He felt sad about hiding the food he loved."], "answer": 3, "ex": "좋아하는 음식을 숨기고 남을 따라 한 씁쓸한 마음이 담긴 표현이에요."}, {"type": "추론", "q": "Why did Ji-ho's mother probably say nothing when he asked for sandwiches?", "options": ["She wanted Ji-ho to stop eating.", "She understood his feelings and let him decide for himself.", "She was angry and refused to  the eyes. At the beginning, its guesses are mostly wrong, and some of them are quite funny. Each time it makes a mistake, however, it adjusts its internal settings a tiny bit. After millions of small adjustments, the program becomes surprisingly accurate.\n\nIn a way, this is like learning to shoot a basketball. Your first throws miss, but every miss tells your brain how to change your aim. Machine learning works in a similar way, except that a computer can practice millions of times in a single day.\n\nToday, this technology is being used everywhere, from hospitals to smartphones. It helps doctors spot diseases in X-rays, translates languages instantly, and recommends videos you might enjoy. New systems are being trained right now to drive cars and to predict the weather.\n\nHowever, machines are only as good as the data they learn from. If the training photos show only orange cats, the program might fail to recognize a black one. That is why the people who design these systems must choose their data carefully and check the results again and again.", "speaking": "What job would you like AI to do for you? Give your opinion, one concern, and an example. (60 seconds)", "speakStarters": ["I would like AI to … .", "For example, it could … .", "However, some people worry that … .", "Still, I think … ."], "prompt": "Explain to a younger friend how machines learn. Write three paragraphs (about 180 words): what machine learning is, how it works (with a comparison), and why data matters.", "starters": ["Paragraph 1: Machine learning is a way for computers to … .", "Paragraph 2: It is a bit like … . First, … . Then, … .", "Paragraph 3: However, … . That is why … ."], "cards": [{"word": "recognize", "form": "recognize", "pos": "v.", "en": "to know who or what someone or something is because you have seen it before", "ko": "알아보다, 인식하다"}, {"word": "process", "form": "process", "pos": "n.", "en": "a series of steps to do or make something", "ko": "과정"}, {"word": "label", "form": t get tired. As a result, they can perform repetitive tasks, such as packing boxes, for hours without making careless mistakes. They can also handle dangerous jobs, like inspecting damaged nuclear plants or exploring the deep sea, where humans might be injured. History may also suggest that technology creates new kinds of work. When computers became common, millions of jobs appeared that had never existed before, such as web designer and app developer.\n\nCritics, however, worry about what happens to workers whose jobs disappear. A truck driver who has worked for twenty years cannot easily become a robot engineer overnight. Some studies estimate that a significant share of today's tasks could be automated in the coming decades. It is likely that workers with fewer skills will be affected first. This could widen the gap between rich and poor.\n\nMany experts take a middle position. They point out that robots are excellent at narrow tasks. However, robots still struggle with creativity, empathy, and complex judgment. Jobs that require these qualities, such as nursing, teaching, or counseling, appear less likely to be replaced. In fact, many workers may end up working alongside robots rather than being replaced by them.\n\nIf this is true, the most important question may not be whether robots will take our jobs. Instead, it may be how we prepare people, especially young people, for the jobs that only humans can do.", "speaking": "What can robots NOT do? Give your opinion, the other side's view, and an example. (60 seconds)", "speakStarters": ["I believe robots cannot … .", "For example, … .", "Some people may argue that … .", "However, it is likely that … ."], "prompt": "Write a three-paragraph opinion essay (about 180 words): Will robots be more helpful or harmful to workers? Use at least one hedging phrase (may, might, it is likely that).", "starters": ["Paragraph 1: Robots are becoming common in … . In my opinion, … .", "Paragraph 2: First, … . Some people may argue

 warm weather. After you plant it, the seed drinks water. Then it swells. Next, a little root pushes down into the soil. After that, a green shoot pushes up toward the light.\n\nThe young plant grows fast. Its stem gets thick and strong. Big leaves catch the sunlight to make food for the plant.\n\nAfter about two months, a flower bud appears at the top. Before it opens, the bud turns to follow the sun across the sky. It faces east in the morning and west in the evening.\n\nThen the bud opens into a bright yellow flower. Bees visit it. They carry pollen from flower to flower.\n\nAfter the flower dries, its center is full of new seeds. Birds love to eat them. Some seeds fall to the ground. Next spring, they will grow into new sunflowers. Then the cycle begins again.", "speaking": "What plant do you want to grow? Choose one and give a reason. (20–30 seconds)", "speakStarters": ["I want to grow … .", "I like it because … .", "I will put it … ."], "prompt": "Explain the life cycle of a plant. Use before and after. Write 4–5 sentences.", "starters": ["A plant starts as a … .", "After it gets water, … .", "Then, … .", "Before the flower opens, … .", "After the flower dies, … ."], "cards": [{"word": "giant", "form": "giant", "pos": "adj.", "en": "very, very big", "ko": "거대한"}, {"word": "cycle", "form": "cycle", "pos": "n.", "en": "things that happen again and again in the same order", "ko": "순환, 주기"}, {"word": "soil", "form": "soil", "pos": "n.", "en": "the top layer of the ground where plants grow", "ko": "흙, 토양"}, {"word": "swell", "form": "swells", "pos": "v.", "en": "to get bigger and rounder", "ko": "부풀다"}, {"word": "root", "form": "root", "pos": "n.", "en": "the part of a plant that grows under the ground", "ko": "뿌리"}, {"word": "shoot", "form": "shoot", "pos": "n.", "en": "a new, young part of a plant that grows up", "ko": "새싹, 순"}, {"word": "bud", "form": "bud", "pos": "n.", "en": "a small part of a plant that will open into a flower or leaf", "ko": "꽃봉오리, 싹"}, {"wo  day.\" Leo is going to water them on Mondays and Thursdays.\n\nApril 7 (Friday)\nNothing happened yet! The soil looks the same. Some of us are worried that the seeds are not going to grow.\n\nApril 10 (Monday)\nHooray! Tiny green sprouts came out in four cups. They are about one centimeter tall. Two cups still have no sprouts.\n\nApril 17 (Monday)\nThe sprouts are growing quickly now. The tallest one is eight centimeters. Each plant has two round leaves. We measured them with a ruler and drew pictures in our notebooks.\n\nApril 24 (Monday)\nOur plants are leaning toward the window. We think they want more light. Tomorrow, we are going to turn the cups around. Next month, we are going to move the plants into the school garden. We can't wait to see the beans!", "speaking": "Your school is going to make a garden. What do you want to grow there? Give a reason. (20–30 seconds)", "speakStarters": ["I want to grow … .", "That is because … .", "We are going to … ."], "prompt": "Watch something for a few days (a plant, a pet, or the sky). Write one journal entry. Write 4–5 sentences.", "starters": ["(Date) …", "Today, I saw … .", "It looks … .", "It changed because … .", "Tomorrow, I am going to … ."], "cards": [{"word": "journal", "form": "Journal", "pos": "n.", "en": "a book where you write what happens each day", "ko": "일지, 일기"}, {"word": "bean", "form": "bean", "pos": "n.", "en": "a seed or pod of a plant that you can eat", "ko": "콩"}, {"word": "sprout", "form": "sprouts", "pos": "n.", "en": "a very young plant that just came out of a seed", "ko": "새싹"}, {"word": "centimeter", "form": "centimeter", "pos": "n.", "en": "a small unit for measuring length (cm)", "ko": "센티미터"}, {"word": "quickly", "form": "quickly", "pos": "adv.", "en": "fast", "ko": "빨리"}, {"word": "round", "form": "round", "pos": "adj.", "en": "shaped like a circle or a ball", "ko": "둥근"}, {"word": "measure", "form": "measured", "pos": "v.", "en": "to find out how long, tall, or heavy something is", "ko": rew so fast that Gus jumped with joy. Soon it was as big as a car. \"More!\" said Gus. He gave it more food.\n\nThe pumpkin grew so big that it did not fit through the gate. It grew so heavy that the ground shook. Then it rolled down the hill, across the road, and into the town square!\n\nPeople came out to look. Gus could not move it. He could not take it to the fair. He felt very silly.\n\nA little girl looked at the giant pumpkin. \"We could share it,\" she said. So the whole town worked together. They made pumpkin soup, pumpkin pie, and pumpkin bread. There was enough food for everyone.\n\nGus did not win a prize that year. But he learned something more important. Too much of a good thing can be a problem. Sharing makes everyone happy.", "speaking": "Did you ever want too much of something? Choose one time and tell what happened. (20–30 seconds)", "speakStarters": ["One time, I wanted too much … .", "Then, … .", "I learned that … ."], "prompt": "Tell a friend about this story. Write 4–5 sentences. Include the lesson.", "starters": ["I read a story called … .", "It is about … .", "The pumpkin grew so … that … .", "The lesson is … .", "I think you will like it because … ."], "cards": [{"word": "prize", "form": "prize", "pos": "n.", "en": "something you get for winning", "ko": "상, 상품"}, {"word": "fair", "form": "fair", "pos": "n.", "en": "an outdoor event with games, food, and contests", "ko": "박람회, 축제"}, {"word": "joy", "form": "joy", "pos": "n.", "en": "a feeling of great happiness", "ko": "기쁨"}, {"word": "fit", "form": "fit", "pos": "v.", "en": "to be the right size to go in or through something", "ko": "(크기가) 맞다, 들어가다"}, {"word": "gate", "form": "gate", "pos": "n.", "en": "a door in a fence or wall", "ko": "대문, 문"}, {"word": "roll", "form": "rolled", "pos": "v.", "en": "to move by turning over and over", "ko": "굴러가다"}, {"word": "square", "form": "square", "pos": "n.", "en": "an open area in the middle of a town", "ko": "광장"}, {"word": "enough", "form": "enough" Sky", "8": "Pandora's Jar", "9": "Floods in Myths Around the World", "10": "Coral Reefs: Cities Under the Sea", "11": "Ask a Marine Biologist", "12": "My Plastic-Free Week"}, "fields": {}, "units": {"1": {"passage": "Egypt is a hot, dry country. Most of the land is desert, and it almost never rains. So how did one of the world's first great civilizations grow there? The answer is the Nile River.\n\nThe Nile is one of the longest rivers in the world. In ancient times, it flooded every summer. When the water went down, it left a layer of dark, rich mud on the fields. This mud is called silt. Crops grow very well in silt, so farmers planted wheat and barley. The Egyptians even called their land \"the black land.\"\n\nThe river gave people more than food. A tall plant called papyrus grew along its banks. Its stems were cut and pressed to make paper. Papyrus is still used by some artists today. The Nile was also a busy road. Boats carried stone, grain, and people up and down the river.\n\nLife by the river was not easy, though. Farmers dug canals to bring water to fields far from the river.\n\nToday, the Nile is controlled by a large dam, so it no longer floods. But the river is still the heart of Egypt. Most Egyptians live close to its banks.", "speaking": "Imagine you visit ancient Egypt. What do you want to see there? Give two reasons. (30 seconds)", "speakStarters": ["I want to see … .", "First, … .", "Second, … ."], "prompt": "Imagine you are a child in ancient Egypt. Describe one day of your life near the Nile. Write one paragraph of 5–6 sentences.", "starters": ["My life near the Nile is busy.", "In the morning, I … .", "Our crops are … .", "After lunch, … .", "In the evening, … .", "I love the Nile because … ."], "cards": [{"word": "civilization", "form": "civilizations", "pos": "n.", "en": "a large, organized society with its own culture and way of life", "ko": "문명"}, {"word": "ancient", "form": "ancient", "pos": "adj.", "en": "from a time very long ago", "ko": he forest", "a tool for cutting wood"], 0, "crop = 농작물."], ["bank", "We had a picnic on the bank of the river.", ["the land along the side of a river", "the deepest part of a river", "a place where people keep money", "a boat that crosses a river"], 0, "bank = 강둑. '은행' 말고 '강가의 땅'이라는 뜻도 있어요."], ["stem", "She cut the flower near the bottom of the stem.", ["the colorful part of a flower", "the root under the ground", "the long, thin part of a plant that holds up the leaves", "the seed inside a fruit"], 2, "stem = 줄기."], ["press", "Press the flowers between the pages of a book.", ["to throw something away", "to make something round", "to pull something apart", "to push hard on something to make it flat"], 3, "press = 꾹 눌러 납작하게 하다."], ["canal", "The farmers built a canal to water their fields.", ["a long path dug in the ground to carry water", "a road for cars and trucks", "a natural lake in the hills", "a tall tower made of stone"], 0, "canal = 사람이 판 물길."], ["control", "This button controls the temperature in the room.", ["to forget about something", "to paint something a new color", "to let something go wild", "to make something work or move the way you want"], 3, "control = 통제하다."]], "comp": [{"type": "중심 내용", "q": "What is the passage mainly about?", "options": ["how the pyramids were built", "why it never rains in the desert", "how to make paper from plants", "how the Nile River made life possible in Egypt"], "answer": 3, "ex": "강 하나가 사막의 나라에서 문명을 가능하게 한 이야기예요."}, {"type": "세부 내용", "q": "What did the flood water leave on the fields?", "options": ["It left salt from the sea.", "It left a layer of dark, rich mud.", "It left sand from the desert.", "It left stones from the mountains."], "answer": 1, "ex": "2문단: it left a layer of dark, rich mud on the fields."}, {"type": "원인·결과", "q": "Why did the Egyptians call their land \"the black land\"?", "options": ["The river water was black.", "The flood left dark silt on the fields.", "The nights were very dark.", "Most peopl is ramp is shorter. But it might be hard to turn heavy blocks at the corners.\n\nIdea 3 is an inside ramp. Some scientists think a ramp may be hidden inside the walls. It might still be there today!\n\nThere is one more clue. An old Egyptian wall painting shows a worker pouring water on the sand in front of a sled. Wet sand is easier to pull things across. The real answer may be a mix of all these ideas.", "speaking": "What is the most amazing old building you know? Give two reasons. (30 seconds)", "speakStarters": ["The most amazing old building is … .", "First, … .", "Also, … ."], "prompt": "Which idea about the pyramids do you think is the best? Write one paragraph of 5–6 sentences with two reasons.", "starters": ["I think Idea … is the best.", "First, … .", "Second, … .", "The other ideas might … .", "That is why … ."], "cards": [{"word": "block", "form": "blocks", "pos": "n.", "en": "a large, solid piece of stone or wood with flat sides", "ko": "(돌·나무) 덩어리, 블록"}, {"word": "crane", "form": "cranes", "pos": "n.", "en": "a tall machine that lifts heavy things", "ko": "크레인, 기중기"}, {"word": "iron", "form": "iron", "pos": "n.", "en": "a strong, hard metal", "ko": "철"}, {"word": "tool", "form": "tools", "pos": "n.", "en": "a thing you hold in your hand to do a job", "ko": "도구"}, {"word": "ramp", "form": "ramp", "pos": "n.", "en": "a slope that connects a lower place and a higher place", "ko": "경사로"}, {"word": "sled", "form": "sleds", "pos": "n.", "en": "a flat thing for pulling heavy loads or sliding on snow", "ko": "썰매"}, {"word": "spiral", "form": "spiral", "pos": "adj.", "en": "going round and round in circles while moving up or down", "ko": "나선형의"}, {"word": "hidden", "form": "hidden", "pos": "adj.", "en": "put where people cannot see or find it", "ko": "숨겨진"}, {"word": "clue", "form": "clue", "pos": "n.", "en": "a piece of information that helps you find an answer", "ko": "단서, 실마리"}, {"word": "pour", "form": "pouring", "pos": "v.", "en": "to make a liquid flow ou rk.", "It describes different ideas about how the Great Pyramid was built.", "It explains why elephants carried stones.", "It tells the story of an Egyptian king."], "answer": 1, "ex": "피라미드 건설 방법에 대한 여러 가설을 소개하는 글이에요."}, {"type": "세부 내용", "q": "How old is the Great Pyramid of Giza?", "options": ["It is about 2,000 years old.", "It is about 450 years old.", "It is about two million years old.", "It is about 4,500 years old."], "answer": 3, "ex": "1문단: about 4,500 years old."}, {"type": "원인·결과", "q": "Why did a worker pour water on the sand?", "options": ["Wet sand makes it easier to pull a sled across it.", "The workers were very thirsty.", "Water made the stones lighter.", "They wanted to grow plants."], "answer": 0, "ex": "마지막 문단: Wet sand is easier to pull things across."}, {"type": "문맥 속 어휘", "q": "\"Some scientists think a ramp may be hidden inside the walls.\" What does \"hidden\" mean?", "options": ["It is very old.", "It is in a place where people cannot see it.", "It is very long.", "It is broken."], "answer": 1, "ex": "hidden = 숨겨진, 보이지 않는."}, {"type": "가설 비교", "q": "What is the main problem with Idea 1, the straight ramp?", "options": ["It might be over a kilometer long.", "It is hard to turn blocks at the corners.", "It needs a lot of water.", "No one has found it yet."], "answer": 0, "ex": "Idea 1: a ramp to the very top might be over a kilometer long! (모서리 문제는 Idea 2)"}, {"type": "문법 · may / might (가능성)", "q": "A secret ramp ______ be inside the walls.", "options": ["might to", "mights", "might", "might is"], "answer": 2, "ex": "might + 동사원형 = ~일지도 모른다."}, {"type": "문법 · may / might (가능성)", "q": "The real answer may ______ a mix of all these ideas.", "options": ["is", "to be", "being", "be"], "answer": 3, "ex": "may + 동사원형(be)."}, {"type": "문법 · may / might (가능성)", "q": "Which sentence shows a possibility (가능성)?", "options": ["It rains every day.", "It rained yesterday.", "It might rain later.", "It is raining now."], "answer": 2, "ex": "might + 동사원형 → 그럴 수도 있다는 가능성."}]}, "3": {"passage": "Long ago in Egypt, a boy named Kamose was learning to be a scribe. Scribes were very important people. They wrote letters, counted grain, and kept records for the king.\n\nEvery morning, Kamose sat on the floor of the school with a wooden board on his knees. He practiced writing hieroglyphs with a reed brush and black ink. There were hundreds of symbols, and he had to remember them all.\n\nOne hot afternoon, Kamose was copying a long list of words when his brush slipped. A big black spot fell on the papyrus. His teacher, Old Senu, was walking toward him. Kamose's heart was beating fast. Papyrus was expensive, and mistakes were not allowed.\n\nKamose thought quickly. While his teacher was talking to another student, he turned the spot into a tiny bird. Then he kept writing.\n\nOld Senu looked at the page for a long time. \"You made a mistake,\" he said finally. Kamose held his breath. \"But you fixed it in a clever way. A good scribe does not give up.\"\n\nThat night, Kamose practiced for two extra hours.", "speaking": "Imagine you lived long ago. What job do you want to do? Give two reasons. (30 seconds)", "speakStarters": ["I want to be a … .", "First, … .", "Second, … ."], "prompt": "Imagine you are a child in ancient times. Write a diary entry about one day. Use was/were + -ing at least once. Write one paragraph of 5–6 sentences.", "starters": ["Today was a … day.", "In the morning, I … .", "While I was …, … .", "After that, … .", "I felt … because … ."], "cards": [{"word": "scribe", "form": "scribe", "pos": "n.", "en": "a person whose job was to write things down long ago", "ko": "필경사, 서기"}, {"word": "record", "form": "records", "pos": "n.", "en": "written information about things that happened", "ko": "기록"}, {"word": "practice", "form": "practiced", "pos": "v.", "en": "to do something again and again to get better", "ko": "연습하다"}, {"word": "symbol", "form": "symbols", "pos": "n.", "en": "a picture or mark that means something", "ko": "기호, 상징"}, {"word": "reed", "form": "reed", "pos": "n.", "en": "a tall, thin grass that grows near water", "ko": "갈대"}, {"word": "copy", "form": "copying", "pos": "v.", "en": "to write or make something exactly like another", "ko": "베껴 쓰다"}, {"word": "slip", "form": "slipped", "pos": "v.", "en": "to slide by mistake", "ko": "미끄러지다"}, {"word": "expensive", "form": "expensive", "pos": "adj.", "en": "costing a lot of money", "ko": "비싼"}, {"word": "breath", "form": "breath", "pos": "n.", "en": "the air that goes in and out when you breathe", "ko": "숨, 호흡"}, {"word": "clever", "form": "clever", "pos": "adj.", "en": "smart and quick to understand", "ko": "영리한, 재치 있는"}], "vocab": [["scribe", "The scribe wrote the king's letters.", ["a soldier who fights", "a person who builds houses", "a person who sells fruit", "a person whose job was to write things down long ago"], 3, "scribe = 옛날에 글을 쓰고 기록하던 사람."], ["record", "The school keeps a record of our grades.", ["a loud song", "written information about things that happened", "a kind of food", "a fast race"], 1, "record = 기록."], ["practice", "I practice the piano every day.", ["to stop doing something", "to do something again and again to get better", "to break something", "to forget something"], 1, "practice = 연습하다."], ["symbol", "A heart is a symbol of love.", ["a loud sound", "a heavy box", "a picture or mark that means something", "a long story"], 2, "symbol = 기호."], ["reed", "The ducks hid among the reeds.", ["a kind of rock", "a big tree", "a tall, thin grass that grows near water", "a sea animal"], 2, "reed = 갈대."], ["copy", "Copy the sentence into your notebook.", ["to make up a new idea", "to erase all the words", "to write or make something exactly like another", "to read very fast"], 2, "copy = 베껴 쓰다."], ["slip", "I slipped on the wet floor.", ["to slide by mistake", "to hold tightly", "to stand very still", "to jump up"], 0, "slip = 미끄러지다."], ["expensive", "This watch is too expensive for me.", ["costing ht. If you want better sleep, try these tips. Go to bed at the same time every night. Turn off screens an hour before bed. Keep your bedroom dark and quiet.", "speaking": "What is your own way to sleep well? Give two tips. (30 seconds)", "speakStarters": ["I have two tips for sleeping well.", "First, … .", "Second, … ."], "prompt": "What happens if you don't get enough sleep? Write one paragraph of 5–6 sentences. Use if at least twice.", "starters": ["Sleep is very important for kids.", "If I don't sleep enough, … .", "Also, if I … , … .", "For example, … .", "So, I will … ."], "cards": [{"word": "waste", "form": "waste", "pos": "n.", "en": "a bad use of something, like time or money", "ko": "낭비"}, {"word": "brain", "form": "brain", "pos": "n.", "en": "the part inside your head that thinks and remembers", "ko": "뇌"}, {"word": "sort", "form": "sorts", "pos": "v.", "en": "to put things into groups", "ko": "분류하다, 정리하다"}, {"word": "memory", "form": "memories", "pos": "n.", "en": "something you remember", "ko": "기억"}, {"word": "heal", "form": "heal", "pos": "v.", "en": "to become healthy again", "ko": "낫다, 치유되다"}, {"word": "repair", "form": "repairs", "pos": "v.", "en": "to fix something that is broken or hurt", "ko": "고치다, 회복시키다"}, {"word": "grumpy", "form": "grumpy", "pos": "adj.", "en": "a little angry and not friendly", "ko": "짜증 난, 투덜대는"}, {"word": "attention", "form": "attention", "pos": "n.", "en": "careful listening, watching, or thinking", "ko": "주의, 집중"}, {"word": "germ", "form": "germs", "pos": "n.", "en": "a very tiny living thing that can make you sick", "ko": "세균"}, {"word": "screen", "form": "screens", "pos": "n.", "en": "the flat glass part of a TV, phone, or computer", "ko": "화면"}], "vocab": [["waste", "Watching TV all day is a waste of time.", ["a kind of gift", "a good use of time", "a bad use of something, like time or money", "a type of food"], 2, "waste = 낭비."], ["brain", "Your brain helps you learn new things.", ["the part that pumps blood", "the part inside your head that thinks and remembers", "the part that digests food", "the part that helps you walk"], 1, "brain = 뇌."], ["sort", "Sort the toys by color.", ["to break things", "to mix everything together", "to put things into groups", "to throw things away"], 2, "sort = 분류하다."], ["memory", "I have a happy memory of my first trip.", ["something you remember", "a kind of food", "something you forget", "a type of game"], 0, "memory = 기억."], ["heal", "The cut on my knee will heal soon.", ["to break", "to get worse", "to become healthy again", "to get bigger"], 2, "heal = (상처가) 낫다."], ["repair", "The man repaired our broken window.", ["to paint something", "to lose something", "to break something more", "to fix something that is broken or hurt"], 3, "repair = 고치다."], ["grumpy", "I am grumpy when I am hungry.", ["very excited", "very calm", "very cheerful", "a little angry and not friendly"], 3, "grumpy = 짜증 난."], ["attention", "Please pay attention to the teacher.", ["falling asleep", "careful listening, watching, or thinking", "talking loudly", "not caring at all"], 1, "pay attention = 집중하다."], ["germ", "Wash your hands to get rid of germs.", ["a kind of toy", "a very tiny living thing that can make you sick", "a drop of water", "a vitamin in fruit"], 1, "germ = 세균."], ["screen", "Don't sit too close to the screen.", ["a soft pillow", "the flat glass part of a TV, phone, or computer", "a wooden desk", "a paper book"], 1, "screen = 화면."]], "comp": [{"type": "중심 내용", "q": "What is the main idea of the passage?", "options": ["Kids should sleep only 5 hours.", "Sleep is very important for your brain and body.", "Sleep is a waste of time.", "Screens help you sleep better."], "answer": 1, "ex": "잠이 뇌와 몸에 꼭 필요하다는 것이 중심 생각이에요."}, {"type": "세부 내용", "q": "How much sleep do children aged 6 to 12 need?", "options": ["about 14 to 16 hours", "about 9 to 12 hours", "about 5 to 6 hours", "about 7 to 8 hours"], "answer": 1, "ex": "마지막 문단: about 9 to 12 hours of sleep each night."}, {"type": "원인·결과", "q": "Why might tired kids get sick more often?", "options": ["Sleep helps the body fight germs.", "Tired kids eat too much.", "Their brains get too big.", "Screens have germs."], "answer": 0, "ex": "4문단: sleep helps your body fight germs."}, {"type": "문맥 속 어휘", "q": "\"You may feel grumpy and tired.\" What does \"grumpy\" mean?", "options": ["very happy", "a little angry and not friendly", "very hungry", "very calm"], "answer": 1, "ex": "grumpy = 짜증 나고 투덜대는."}, {"type": "비교", "q": "How is a student who sleeps well different from a tired student?", "options": ["The student who sleeps well gets sick more often.", "The student who sleeps well remembers more and pays attention better.", "They are exactly the same.", "The tired student remembers more."], "answer": 1, "ex": "잘 자면 더 잘 기억하고(2문단), 피곤하면 집중이 어려워요(4문단)."}, {"type": "문법 · if + 현재 (1조건문)", "q": "If you ______ well, you will remember more.", "options": ["sleeping", "slept", "sleep", "will sleep"], "answer": 2, "ex": "if절에는 미래라도 현재시제 → If you sleep."}, {"type": "문법 · if + 현재 (1조건문)", "q": "If it rains tomorrow, we ______ inside.", "options": ["to play", "playing", "will play", "played"], "answer": 2, "ex": "If + 현재, 주어 + will + 동사원형."}, {"type": "문법 · if + 현재 (1조건문)", "q": "Which sentence is correct?", "options": ["If you went to bed early, you will feel better.", "If you go to bed early, you will feel better.", "If you will go to bed early, you feel better.", "If you go to bed early, you felt better."], "answer": 1, "ex": "If + 현재, will + 동사원형."}]}, "6": {"passage": "I have had a cast on my right arm for five days. It all started last Saturday.\n\nI was riding my bike down a steep hill. A small dog ran into the road, and I turned too fast. The next thing I knew, I was lying on the ground. My arm hurt so much that I couldn't move it.\n\nAt the hospital, the doctor took an X-ray. \"Your arm is broken,\" she said. Then she put a hard, white cast on it. I felt angry and scared. My swimming lessons started next week!\n\nThe first two days were terrible. I couldn't write, tie my shoes, or even cut my food. I am right-handed, so everything was difficult.\n\nBut since Wednesday, things have changed. My friends have signed my cast with colorful markers. My little sister has helped me button my shirt. I have also learned to brush my teeth with my left hand. It's messy, but I'm getting better at it!\n\nThe doctor says I need the cast for five more weeks. That feels long, but I'm not angry anymore. I've learned that asking for help is okay.", "speaking": "When you were sick or hurt, what helped you? Give two things. (30 seconds)", "speakStarters": ["When I was hurt, two things helped me.", "First, … .", "Also, … ."], "prompt": "Write about a time you were sick or hurt and then got better. Write one paragraph of 5–6 sentences.", "starters": ["One time, I … .", "At first, I felt … .", "… helped me.", "Since then, I have … .", "I learned that … ."], "cards": [{"word": "cast", "form": "cast", "pos": "n.", "en": "a hard cover that keeps a broken bone still", "ko": "깁스"}, {"word": "steep", "form": "steep", "pos": "adj.", "en": "going up or down very sharply", "ko": "가파른"}, {"word": "broken", "form": "broken", "pos": "adj.", "en": "cracked or in pieces; not working", "ko": "부러진, 고장 난"}, {"word": "scared", "form": "scared", "pos": "adj.", "en": "afraid", "ko": "무서운, 겁먹은"}, {"word": "terrible", "form": "terrible", "pos": "adj.", "en": "very bad", "ko": "끔찍한, 아주 나쁜"}, {"word": "difficult", "form": "difficult", "pos": "adj.", "en": "hard to do", "ko": "어려운"}, {"word": "tie", "form": "tie", "pos": "v.", "en": "to close something by making a knot", "ko": "묶다"}, {"word": "sign", "form": "signed", "pos": "v.", "en": "to write your name on something", "ko": "서명하다, 사인하다"}, {"word": "marker", "form": "markers", "pos": "n.", "en": "a pen with a thick, colorful tip", "ko": "마커 펜"}, {"word": "button", "form": "button", "pos": "v.", "en": "to close clothes with buttons", "ko": "단추를 채우다"}], "vocab": [["cast", "She had a cast on her leg for six weeks.", ["a kind of bandage for small cuts", "a hard cover that keeps a broken bone still", "a shoe for running", "a soft blanket"], 1, "cast = 깁스."], ["steep", "It was hard to climb the steep hill.", ["short and wide", "flat and easy", "wet and muddy", "going up or down very sharply"], 3, "steep = 가파른."], ["broken", "My phone is broken.", ["brand new", "working well", "cracked or in pieces; not working", "very clean"], 2, "broken = 부러진."], ["scared", "I was scared during the storm.", ["afraid", "sleepy", "bored", "brave and calm"], 0, "scared = 겁먹은."], ["terrible", "The food tasted terrible.", ["very good", "very funny", "very easy", "very bad"], 3, "terrible = 끔찍한."], ["difficult", "This puzzle is difficult.", ["hard to do", "fast", "easy", "short"], 0, "difficult = 어려운."], ["tie", "Can you tie your shoes by yourself?", ["to close something by making a knot", "to cut", "to throw", "to open a box"], 0, "tie = 묶다."], ["sign", "Please sign your name here.", ["to erase your name", "to forget your name", "to shout your name", "to write your name on something"], 3, "sign = 서명하다."], ["marker", "I colored the poster with markers.", ["a pair of scissors", "a pen with a thick, colorful tip", "a ruler", "a small eraser"], 1, "marker = 마커."], ["button", "Button your coat. It's cold!", ["to fold clothes", "to close clothes with buttons", "to take off clothes", "to wash clothes"], 1, "button = 단추를 채우다 (단추라는 명사도 있어요)."]], "comp": [{"type": "중심 내용", "q": "What is the story mainly about?", "options": ["It is about a bike race.", "It is about swimming lessons.", "It is about a writer who broke an arm and learned to deal with it.", "It is about a dog that got lost."], "answer": 2, "ex": "팔이 부러진 뒤 일주일 동안의 경험과 마음의 변화 이야기예요."}, {"type": "세부 내용", "q": "How did the writer break the arm?", "options": ["The writer fell from a tree.", "The writer fell off a bike after turning too fast to miss a dog.", "The writer hurt it while swimming.", "The writer fell down the stairs."], "answer": 1, "ex": "2문단: A small dog ran into the road, and I turned too fast."}, {"type": "원인·결과", "q": "Why was everything difficult for the writer?", "options": ["The writer is right-handed, and the right arm was in a cast.", "The writer was very tired.", "The writer was sick with a cold.", "The writer's sister was too loud."], "answer": 0, "ex": "4문단: I am right-handed, so everything was difficult."}, {"type": "문맥 속 어휘", "q": "\"I was riding my bike down a steep hill.\" What does \"steep\" mean?", "options": ["going down very sharply", "very flat", "very short", "very green"], "answer": 0, "ex": "steep = 가파른."}, {"type": "감정 변화", "q": "How did the writer's feelings change during the week?", "options": ["The writer never felt anything.", "The writer was happy at first and then angry.", "The writer was bored the whole time.", "The writer was angry and scared at first, but later felt better and learned something."], "answer": 3, "ex": "3문단 angry and scared → 마지막 문단 not angry anymore, 도움을 청해도 괜찮다는 걸 배움."}, {"type": "문법 · 현재완료 (for / since)", "q": "I have had a cast ______ five days.", "options": ["at", "ago", "for", "since"], "answer": 2, "ex": "기간(five days) → for."}, {"type": "문법 · 현재완료 (for / since)", "q": "Things have changed ______ Wednesday.", "options": ["for", "ago", "during", "since"], "answer": 3, "ex": "시작 시점(Wednesday) → since."}, {"type": "문법 · 현재완료 (for / since)", "q": "Which sentence is correct?", "options": ["She has lived here for 2020.", "She has live here since 2020.", "She lives here since 2020.", "She has lived here since 2020."], "answer": 3, "ex": "have/has + 과거분사 + since + 시작 시점."}]}, "7": {"passage": "Long ago, the Sun and the Moon lived on Earth. They were husband and wife, and they had a lovely house. Their best friend was Water, who lived in the sea.\n\nThe Sun often visited Water, but Water never visited them. \"Why don't you come to our house?\" the Sun asked one day.\n\n\"Your house is too small,\" said Water. \"I have many people, and they will need a lot of space.\"\n\nSo the Sun and the Moon built a new house which was very, very big. Then they invited Water again.\n\nWater arrived with fish, crabs, and whales, which swam in through the door. Soon the water was up to their knees. \"Should I keep coming in?\" Water asked. \"Yes, please come in,\" said the Sun.\n\nMore and more water came in. Soon it reached the roof. The Sun and the Moon had to sit on top of the house. Water kept coming, so they climbed higher and higher until they reached the sky.\n\nThey have lived in the sky ever since. That is why the Sun and the Moon, who were once our neighbors, now shine down on us from above.", "speaking": "What is your favorite old story? Give two reasons. (30 seconds)", "speakStarters": ["My favorite old story is … .", "First, … .", "Also, … ."], "prompt": "Make up your own \"why\" story about nature. (Why is the sky blue? Why do cats chase mice?) Write one paragraph of 5–6 sentences.", "starters": ["Long ago, … .", "There was a … who … .", "One day, … .", "Then, … .", "That is why … today."], "cards": [{"word": "husband", "form": "husband", "pos": "n.", "en": "the man a woman is married to", "ko": "남편"}, {"word": "wife", "form": "wife", "pos": "n.", "en": "the woman a man is married to", "ko": "아내"}, {"word": "invite", "form": "invited", "pos": "v.", "en": "to ask someone to come to a place or event", "ko": "초대하다"}, {"word": "crab", "form": "crabs", "pos": "n.", "en": "a sea animal with a hard shell and claws", "ko": "게"}, {"word": "whale", "form": "whales", "pos": "n.", "en": "a very large animal that lives in the sea", "ko": "고래"}, {"word": "knee", "form": "knees", "pos": "n.", "en": "the middle part of your leg where it bends", "ko": "무릎"}, {"word": "reach", "form": "reached", "pos": "v.", "en": "to get to a place", "ko": "~에 이르다, 닿다"}, {"word": "roof", "form": "roof", "pos": "n.", "en": "the top cover of a building", "ko": "지붕"}, {"word": "neighbor", w to build a big house", "why it rains", "why the Sun and the Moon live in the sky"], "answer": 3, "ex": "해와 달이 하늘에 살게 된 유래를 설명하는 이야기예요."}, {"type": "세부 내용", "q": "Who was the Sun and Moon's best friend?", "options": ["Fire was their best friend.", "Water was their best friend.", "Wind was their best friend.", "A whale was their best friend."], "answer": 1, "ex": "1문단: Their best friend was Water."}, {"type": "원인·결과", "q": "Why did the Sun and the Moon go up to the sky?", "options": ["They were angry at Water.", "They wanted to see the stars.", "Their house was too small.", "Water filled their house, so they had to climb higher and higher."], "answer": 3, "ex": "6문단: Water kept coming, so they climbed higher… until they reached the sky."}, {"type": "문맥 속 어휘", "q": "\"Soon it reached the roof.\" What does \"reached\" mean?", "options": ["painted", "broke", "left", "got up to"], "answer": 3, "ex": "reach = ~까지 닿다."}, {"type": "이야기 구조", "q": "Which part is the ENDING of the story?", "options": ["The Sun and the Moon stay in the sky and shine down on us.", "The Sun invites Water to visit.", "Water comes in with fish and crabs.", "The Sun and the Moon build a big house."], "answer": 0, "ex": "결말: They have lived in the sky ever since."}, {"type": "문법 · 관계대명사 who / which", "q": "Water was a friend ______ lived in the sea.", "options": ["what", "where", "which", "who"], "answer": 3, "ex": "사람(처럼 행동하는 인물) friend → who."}, {"type": "문법 · 관계대명사 who / which", "q": "They built a house ______ was very big.", "options": ["when", "what", "who", "which"], "answer": 3, "ex": "사물(house) → which."}, {"type": "문법 · 관계대명사 who / which", "q": "Which sentence is correct?", "options": ["I have a friend who loves stories.", "I have a friend which loves stories.", "I have a friend who she loves stories.", "I have a friend who love stories."], "answer": 0, "ex": "사람 → who + 동사(loves). who 뒤에 주어를 다시 쓰지 않아요."}]}, "8": {"passage": "In Greek myths, Pandora was the first woman on Earth. The gods gave her many gifts. She was clever, beautiful, and very curious.\n\nZeus, the king of the gods, also gave her a large jar with a heavy lid. \"Never open this jar,\" he said. \"Keep it closed forever.\"\n\nPandora tried to forget about the jar. But she was too curious to stop thinking about it. Every day, she walked past it and wondered what was inside. Was it gold? Was it jewels?\n\nOne day, she felt brave enough to lift the lid a little. Whoosh! Dark clouds flew out of the jar. They were all the troubles of the world: sickness, sadness, anger, and fear. Before that day, the world was a happy place.\n\nPandora slammed the lid shut, but it was too late to catch the troubles. She sat down and cried.\n\nThen she heard a tiny voice from inside the jar. \"Let me out,\" it said. Pandora opened the lid again, and a small, bright light flew out. It was Hope.\n\nThe Greeks told this story to explain why life has troubles. But it also teaches that we still have hope in hard times.", "speaking": "Did curiosity ever cause a problem for you? Tell what happened and two things you learned. (30 seconds)", "speakStarters": ["One time, I was too curious about … .", "First, I learned … .", "Also, I learned … ."], "prompt": "Write a letter to Pandora. What do you want to tell her? Write one paragraph of 5–6 sentences.", "starters": ["Dear Pandora,", "I read your story, and … .", "You were too curious to … .", "But you were brave enough to … .", "Don't worry, because … .", "From, …"], "cards": [{"word": "myth", "form": "myths", "pos": "n.", "en": "an old story about gods or heroes", "ko": "신화"}, {"word": "curious", "form": "curious", "pos": "adj.", "en": "wanting to know or learn about something", "ko": "호기심이 많은"}, {"word": "lid", "form": "lid", "pos": "n.", "en": "the top cover of a box, jar, or pot", "ko": "뚜껑"}, {"word": "wonder", "form": "wondered", "pos": "v.", "en": "to think about something and want to know", "ko": "궁금해하다"}, {"word": "jewel", "form": "jewels", "pos": "n.", "en": " to lift the lid.", "options": ["enough", "very", "too", "so"], "answer": 0, "ex": "형용사 + enough to 동사원형 = …할 만큼 충분히 ~한."}, {"type": "문법 · too … to / enough to", "q": "Which sentence is correct?", "options": ["The box is heavy enough too lift.", "The box is too heavy to lift.", "The box is too heavy for lift.", "The box is too heavy lifting."], "answer": 1, "ex": "too + 형용사 + to + 동사원형."}]}, "9": {"passage": "Many cultures around the world tell stories about a great flood. Two famous examples come from ancient Mesopotamia and ancient China.\n\nIn the Mesopotamian story, the gods became angry and sent a huge flood. But one god warned a man named Utnapishtim. He built a giant boat and filled it with his family and many animals. It rained for six days and seven nights. When the rain stopped, he sent out birds to look for dry land.\n\nThe Chinese story is different. A great flood covered the land for many years. A hero named Yu did not escape in a boat. Instead, he worked for thirteen years to dig channels. The channels carried the water away to the sea. Because of his hard work, Yu later became a king.\n\nBoth stories have a terrible flood and a hero who saves people. However, the heroes act in very different ways. Utnapishtim neither fights the flood nor controls it. He escapes it. Yu neither runs away nor waits. He solves the problem.\n\nWhy are there so many flood stories? Many early people lived near big rivers, which flooded often. Floods were both helpful and dangerous.", "speaking": "Why do you think many countries have similar myths? Give two reasons. (30 seconds)", "speakStarters": ["I think many countries have similar myths.", "First, … .", "Second, … ."], "prompt": "Compare the two flood myths. Write one paragraph of 5–6 sentences. Use both … and or neither … nor.", "starters": ["The two flood myths are alike in some ways and different in others.", "Both stories … .", "In the first story, … .", "However, in the second story, … .", "I like … better because … . Utnapishtim escapes the flood, but Yu solves the problem with work."], "answer": 3, "ex": "4문단: Utnapishtim… escapes it. Yu… solves the problem."}, {"type": "문법 · both … and / neither … nor", "q": "______ stories have a terrible flood.", "options": ["Either", "Nor", "Both", "Neither"], "answer": 2, "ex": "두 이야기 모두 → Both."}, {"type": "문법 · both … and / neither … nor", "q": "Yu neither ran away ______ waited.", "options": ["and", "but", "or", "nor"], "answer": 3, "ex": "neither A nor B = A도 B도 아니다."}, {"type": "문법 · both … and / neither … nor", "q": "Which sentence is correct?", "options": ["Both Yu nor Utnapishtim are heroes.", "Neither Yu and Utnapishtim are heroes.", "Both Yu or Utnapishtim are heroes.", "Both Yu and Utnapishtim are heroes."], "answer": 3, "ex": "both A and B 짝을 맞춰요."}]}, "10": {"passage": "Coral reefs look like colorful underwater gardens. But corals are not plants. They are tiny animals called polyps. Each polyp builds a hard skeleton around its soft body. Over thousands of years, millions of these skeletons pile up and form a reef.\n\nScientists say that coral reefs are like busy cities. Reefs cover less than one percent of the ocean floor. Yet about one quarter of all sea creatures live on or near them. Fish hide in the cracks, and sea turtles look for food among the corals.\n\nReefs help people, too. They protect beaches from big waves during storms. Millions of people also catch fish from reefs for food.\n\nSadly, reefs are in danger. When ocean water gets too warm, corals push out the tiny algae that live inside them. The algae give the coral its color and most of its food. Without them, the coral turns white. This is called coral bleaching. Scientists report that the world has lost about half of its coral since the 1950s.\n\nWe can help by saving energy and keeping beaches clean. Many people believe that healthy reefs mean a healthy ocean.", "speaking": "What sea animal do you most want to see? Give two reasons. (30 seconds)", "speakStarte ometers every year. Many female turtles return to the same beach where they hatched. They lay their own eggs there.\"\n\nQ: Could you tell us what the biggest danger to turtles is?\n\"Plastic is a big problem. Turtles often think that a floating plastic bag is a jellyfish, and they eat it.\"\n\nQ: Do you know how kids can help?\n\"Of course! Use less plastic, and never leave trash on the beach. Keep learning, too. Maybe one day you'll be a marine biologist!\"", "speaking": "What kind of scientist do you want to be? Give two reasons. (30 seconds)", "speakStarters": ["I want to be a … .", "First, … .", "Second, … ."], "prompt": "Write five questions you want to ask a marine biologist. Use \"Do you know …?\" or \"Can you tell me …?\" Then write why you chose one question.", "starters": ["1. Do you know what … ?", "2. Can you tell me how … ?", "3. Could you tell me why … ?", "4. Do you know where … ?", "5. …", "I want to ask question … most because … ."], "cards": [{"word": "interview", "form": "interviewed", "pos": "v.", "en": "to ask someone questions to learn about them", "ko": "인터뷰하다"}, {"word": "marine", "form": "marine", "pos": "adj.", "en": "about the sea", "ko": "바다의, 해양의"}, {"word": "biologist", "form": "biologist", "pos": "n.", "en": "a scientist who studies living things", "ko": "생물학자"}, {"word": "track", "form": "track", "pos": "v.", "en": "to follow where someone or something goes", "ko": "추적하다"}, {"word": "satellite", "form": "satellite", "pos": "n.", "en": "a machine that goes around the Earth in space and sends information", "ko": "인공위성"}, {"word": "shell", "form": "shell", "pos": "n.", "en": "the hard outside cover of some animals", "ko": "껍데기, 등딱지"}, {"word": "signal", "form": "signal", "pos": "n.", "en": "a sound, light, or message that gives information", "ko": "신호"}, {"word": "hatch", "form": "hatched", "pos": "v.", "en": "to come out of an egg", "ko": "(알에서) 부화하다"}, {"word": "lay", "form": "lay", "pos": "v.", "en": "to make and leave an egg", "ko":  studies?", "Do you know she studies what?", "Do you know what she study?", "Do you know what does she study?"], "answer": 0, "ex": "Do you know + 의문사 + 주어 + 동사?"}]}, "12": {"passage": "My Plastic-Free Week\nPosted by Sora, age 11\n\nLast month, I watched a video about plastic in the ocean. It showed a whale with forty kilograms of plastic in its stomach. So I decided to try something hard: one whole week without new plastic.\n\nDay 1 was a disaster. I opened the fridge and saw plastic everywhere. There were yogurt cups, juice bottles, and cheese wrappers! I had to stop buying snacks in plastic packages.\n\nBy Day 3, I started to get better. I brought my lunch in a metal box and carried a reusable water bottle. At the store, Mom and I chose fruit without bags.\n\nDay 5 was the hardest. My friends were enjoying candy at a party, and every piece had a plastic wrapper. I said no, but I really wanted to eat one!\n\nOn Day 7, I counted my trash. Usually, our family throws away a full bag of plastic each week. This week, I only had three small pieces.\n\nWas it easy? No. But I think everyone should try to use less plastic. You don't have to be perfect. Just keep trying, because small changes really add up!", "speaking": "Could you live without plastic for a week? Give two reasons. (30 seconds)", "speakStarters": ["Yes, I could. / No, I couldn't.", "First, … .", "Second, … ."], "prompt": "Make your own one-week plan to help the environment. Write one paragraph of 5–6 sentences. Use \"try to\" and \"stop -ing.\"", "starters": ["Next week, I am going to help the environment.", "First, I will try to … .", "Also, I will stop … .", "This will be hard because … .", "But I think … ."], "cards": [{"word": "stomach", "form": "stomach", "pos": "n.", "en": "the part of your body where food goes after you eat", "ko": "위, 배"}, {"word": "decide", "form": "decided", "pos": "v.", "en": "to choose what to do", "ko": "결정하다"}, {"word": "disaster", "form": "disaster", "pos": "n.", "en": "something that goes very, very badly", "ko": "엉망, 재난"}, {"word": "fridge", "form": "fridge", "pos": "n.", "en": "a cold box in the kitchen that keeps food fresh", "ko": "냉장고"}, {"word": "wrapper", "form": "wrappers", "pos": "n.", "en": "the paper or plastic that covers food", "ko": "포장지"}, {"word": "package", "form": "packages", "pos": "n.", "en": "a box or bag that something comes in", "ko": "포장, 꾸러미"}, {"word": "metal", "form": "metal", "pos": "n.", "en": "a hard material like iron or steel", "ko": "금속"}, {"word": "reusable", "form": "reusable", "pos": "adj.", "en": "able to be used again", "ko": "재사용할 수 있는"}, {"word": "trash", "form": "trash", "pos": "n.", "en": "things you throw away", "ko": "쓰레기"}, {"word": "count", "form": "counted", "pos": "v.", "en": "to find the number of things", "ko": "세다"}], "vocab": [["stomach", "My stomach hurts because I ate too fast.", ["the part that helps you hear", "the part that helps you think", "the part of your body where food goes after you eat", "the part that helps you see"], 2, "stomach = 위, 배."], ["decide", "I decided to join the soccer club.", ["to forget what to do", "to be unable to choose", "to ask someone else", "to choose what to do"], 3, "decide = 결정하다."], ["disaster", "The party was a disaster because it rained.", ["a fun game", "a small gift", "something that goes very, very badly", "a great success"], 2, "disaster = 완전 엉망."], ["fridge", "Put the milk back in the fridge.", ["a washing machine", "a cold box in the kitchen that keeps food fresh", "a hot oven", "a kitchen sink"], 1, "fridge = 냉장고 (refrigerator)."], ["wrapper", "Throw the candy wrapper in the bin.", ["the paper or plastic that covers food", "the food inside", "a kind of spoon", "a lunch box"], 0, "wrapper = 포장지."], ["package", "The cookies came in a plastic package.", ["a kind of fruit", "a kitchen table", "a box or bag that something comes in", "a reusable bottle"], 2, "package = 포장."], ["metal", "This spoon is made of metal.", ["plastic", "soft cloth", nly had three small pieces."}, {"type": "문법 · 동명사 vs to부정사 (stop using / try to)", "q": "I had to stop ______ snacks in plastic packages.", "options": ["buys", "bought", "buying", "buy"], "answer": 2, "ex": "stop + 동사-ing = ~하는 것을 멈추다."}, {"type": "문법 · 동명사 vs to부정사 (stop using / try to)", "q": "I decided ______ something hard.", "options": ["tried", "to try", "try", "trying"], "answer": 1, "ex": "decide + to 동사원형."}, {"type": "문법 · 동명사 vs to부정사 (stop using / try to)", "q": "Which sentence is correct?", "options": ["I enjoy reading books.", "I want reading books.", "I decided reading books.", "I enjoy to read books."], "answer": 0, "ex": "enjoy + 동사-ing / want, decide + to 동사원형."}]}}}, "4": {"lexile": "500–599", "titles": {"1": "Ibn Battuta: The Great Traveler", "2": "How Maps Changed the World", "3": "Ice Journal", "4": "Where Does Electricity Come From?", "5": "Sun or Wind?", "6": "The Night the Lights Went Out", "7": "Can You Believe Everything Online?", "8": "How Much Screen Time?", "9": "The Video That Went Too Far", "10": "Wangari Maathai: Planting Trees for Peace", "11": "Kids Who Made a Difference", "12": "Small Steps, Big Change"}, "fields": {}, "units": {"1": {"passage": "Have you ever dreamed of traveling around the world? About 700 years ago, a young man named Ibn Battuta actually did it, long before there were planes, trains, or cars.\n\nIbn Battuta was born in 1304 in Tangier, a city in Morocco. When he was 21, he left home to make a religious journey to Mecca. He planned to return in a year or two. Instead, he traveled for almost 30 years!\n\nHe crossed deserts on camels and sailed across oceans in wooden ships. He visited the Middle East, East Africa, India, and China. In India, he worked as a judge for a powerful sultan. In West Africa, he saw the rich empire of Mali. Along the way, he faced storms, pirates, and illness. Once, robbers took almost everything he owned.\n\nWhy did he keep going? Ibn Battuta loved learning about new people and places. He even tried never to travel the same road twice.\n\nWhen he finally returned to Morocco, the sultan asked him to share his stories, and a writer recorded them in a book called the Rihla. In total, he traveled about 120,000 kilometers. That is about three times around the Earth!\n\nSince then, historians have used his book to learn about life in the 1300s. It is still one of the greatest travel stories ever told.", "speaking": "Where would you like to explore? Give your opinion and one example of what you would do there. (30–40 seconds)", "speakStarters": ["I would like to explore … .", "For example, I would … .", "I think it would be … because … ."], "prompt": "Introduce an explorer from history. Write one paragraph of 6–8 sentences with an opinion, reasons, and an example.", "starters": ["… was a famous explorer.", "He / She was born in … .", "He / She traveled to … .", "For example, … .", "People have learned … from him / her.", "I think … because … ."], "cards": [{"word": "religious", "form": "religious", "pos": "adj.", "en": "connected with religion or faith", "ko": "종교적인"}, {"word": "journey", "form": "journey", "pos": "n.", "en": "a long trip from one place to another", "ko": "여행, 여정"}, {"word": "sail", "form": "sailed", "pos": "v.", "en": "to travel across water in a boat or ship", "ko": "항해하다"}, {"word": "judge", "form": "judge", "pos": "n.", "en": "a person who decides cases in a court of law", "ko": "판사, 재판관"}, {"word": "sultan", "form": "sultan", "pos": "n.", "en": "a ruler in some Muslim countries in the past", "ko": "술탄 (이슬람 국가의 왕)"}, {"word": "empire", "form": "empire", "pos": "n.", "en": "a group of countries or lands ruled by one leader", "ko": "제국"}, {"word": "pirate", "form": "pirates", "pos": "n.", "en": "a person who attacks and robs ships at sea", "ko": "해적"}, {"word": "illness", "form": "illness", "pos": "n.", "en": "a disease or a time of being sick", "ko": "병, 질병"}, {"word": "robber", "form": "robbers", "pos": "n.", "en": "a person who steal inus 30 degrees. We had to break ice off the ropes every hour, or they would snap. My fingers were so stiff that I could barely hold this pencil.\n\nApril 2\nFood is getting low, so we had to hunt seals. I didn't want to watch, but the cook said, \"No seals, no dinner.\" We ate seal stew tonight. It tasted strange, but I was too hungry to complain.\n\nApril 15\nGood news! The dogs pulled our sleds to a pile of supplies left by an earlier team. We didn't have to hunt today, and we even found a box of chocolate. The men cheered so loudly that the dogs started barking.\n\nMay 1\nThe sun has disappeared. Here, winter means months of darkness. To keep our spirits up, the men tell stories and sing songs around the stove every night. I miss my family terribly. Still, I am proud to be part of this crew, and I believe we will all go home one day.", "speaking": "What do you think is the hardest kind of trip? Give your opinion and an example. (30–40 seconds)", "speakStarters": ["I think the hardest trip is … .", "For example, you would have to … .", "That is why … ."], "prompt": "Imagine you are a member of an exploring team. Write a journal entry of 6–8 sentences. Use had to or didn't have to.", "starters": ["(Date) …", "Today was … .", "We had to … .", "Luckily, we didn't have to … .", "I felt … because … .", "Tomorrow, … ."], "cards": [{"word": "stuck", "form": "stuck", "pos": "adj.", "en": "not able to move", "ko": "꼼짝 못 하는, 갇힌"}, {"word": "frozen", "form": "frozen", "pos": "adj.", "en": "turned into ice because it is very cold", "ko": "얼어붙은"}, {"word": "stretch", "form": "stretches", "pos": "v.", "en": "to spread over a large area", "ko": "펼쳐지다, 뻗어 있다"}, {"word": "temperature", "form": "temperature", "pos": "n.", "en": "how hot or cold something is", "ko": "기온, 온도"}, {"word": "rope", "form": "ropes", "pos": "n.", "en": "a thick, strong string", "ko": "밧줄"}, {"word": "snap", "form": "snap", "pos": "v.", "en": "to break suddenly with a sharp sound", "ko": "뚝 부러지다, 끊어지다"}, { ave to", "had to", "had"], "answer": 2, "ex": "과거에 꼭 해야 했던 일 → had to + 동사원형."}, {"type": "문법 · had to / didn't have to", "q": "We found food, so we ______ hunt today.", "options": ["didn't have", "don't had to", "didn't have to", "had to"], "answer": 2, "ex": "할 필요가 없었다 → didn't have to + 동사원형."}, {"type": "문법 · had to / didn't have to", "q": "Which sentence is correct?", "options": ["She has to waited for spring.", "She had to waited for spring.", "She had waiting for spring.", "She had to wait for spring."], "answer": 3, "ex": "had to + 동사원형(wait)."}]}, "4": {"passage": "Flip a switch, and the lights come on. It seems like magic, but the electricity in your home has traveled a long way to reach you. Let's follow its journey step by step.\n\nMost electricity is made in power plants. Many plants burn coal or gas to heat water. Once the water boils, it turns into steam. The steam rushes through pipes and spins a giant wheel with blades, called a turbine. The turbine is connected to a generator. Inside it, magnets spin past coils of copper wire, and this creates an electric current.\n\nAs soon as the electricity is made, it travels along thick wires called power lines. These lines carry it across long distances at a very high voltage. Before it enters your neighborhood, a transformer lowers the voltage so that it is safe to use.\n\nNot all power plants burn fuel. At a dam, falling water spins the turbines, and on a wind farm, the wind turns huge blades. Solar panels are different. They turn sunlight directly into electricity without spinning anything. Each of these sources has its own strengths and weaknesses.\n\nOnce electricity leaves the plant, it reaches your home almost instantly. However, making it can cost the planet a lot, because burning coal and gas pollutes the air. That is why saving electricity matters.", "speaking": "What would you miss most if there were no electricity for a day? Give your opinion and an example. (30–40 seconds)", "speakStarters": ["I Need Limits\nSpending too much time on screens is bad for our bodies and minds. Staring at a phone for hours can hurt your eyes and make it hard to sleep. My eyes often feel tired after a long day of screens. Sitting still all day means less time for running, biking, and playing outside. Scrolling through short videos can also make it hard to focus on one thing for long. Doctors suggest that kids should keep a balance between screen time and other activities. Setting a daily limit, such as two hours for fun, is a smart choice.\n\nBoth writers agree that screens are not all good or all bad. The real question is how to use them.", "speaking": "How many hours of screen time a day is right for kids? Give your opinion and an example. (30–40 seconds)", "speakStarters": ["I think about … hours a day is right.", "For example, … .", "Using screens is … , but … ."], "prompt": "What is your opinion about screen time? Write one paragraph of 6–8 sentences. Start at least one sentence with an -ing word (for example, \"Watching videos is …\").", "starters": ["In my opinion, screen time is … .", "First, … .", "For example, … .", "Watching / Playing … is … .", "However, … .", "So, kids should … ."], "cards": [{"word": "textbook", "form": "textbook", "pos": "n.", "en": "a book used for studying a subject at school", "ko": "교과서"}, {"word": "speed", "form": "speed", "pos": "n.", "en": "how fast something moves or happens", "ko": "속도"}, {"word": "wisely", "form": "wisely", "pos": "adv.", "en": "in a smart and careful way", "ko": "현명하게"}, {"word": "limit", "form": "Limits", "pos": "n.", "en": "the largest amount that is allowed", "ko": "제한, 한도"}, {"word": "stare", "form": "Staring", "pos": "v.", "en": "to look at something for a long time", "ko": "빤히 보다, 응시하다"}, {"word": "scroll", "form": "Scrolling", "pos": "v.", "en": "to move text or pictures up or down on a screen", "ko": "스크롤하다"}, {"word": "focus", "form": "focus", "pos": "v.", "en": "to give all your attention to one thing", "ko":

async function api(url,body){

  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw {code:j.code||("http_"+r.status),message:j.error||""};
  return j;
}
async function dget(p){ if(WC[p]) return cp(WC[p]); try{ const j=await api("/api/db",{op:"get",path:p}); return j.data||null; }catch(e){ console.warn(e); return null; } }

function diff(a,b){
  const A=a.split(/\s+/).filter(Boolean),B=b.split(/\s+/).filter(Boolean),n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const keepA=new Array(n).fill(false),keepB=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){ if(A[i]===B[j]){keepA[i]=keepB[j]=true;i++;j++;} else if(L[i+1][j]>=L[i][j+1])i++; else j++; }
  return { a:A.map((w,k)=>keepA[k]?esc(w):`<span class="del">${esc(w)}</span>`).join(" "),

function unitCard(n,sub,unl){
  const m=unitMeta(n), ready=OPEN_UNITS.includes(n), open=ready&&unl, s=stepState(sub);
  const done=s.quiz+s.comp+s.rec1+s.rec2+s.write;
  const pill=!ready?`<span class="tag t-no">준비 중</span>`:!open?`<span class="tag t-no">🔒 잠김</span>`:(done===5?`<span class="tag t-ok">완료</span>`:done?`<span class="tag t-wait">진행 중 ${done}/5</span>`:`<span class="tag t-no">시작 전</span>`);
  const step=(lab,ok)=>`<div class="st ${ok?"done":""}">${lab}<b>${!open?"잠김":ok?"✓ 완료":"대기"}</b></div>`;
  return `<button class="unit ${open?"":"locked"}" ${open?`data-a="openUnit" data-n="${n}"`:"disabled"}>
   <div class="row" style="justify-content:space-between"><span class="eyebrow">Unit ${String(n).padStart(2,"0")}${m.field?" · "+m.field:""}</span>${pill}</div>
   <span class="ttl">${esc(m.title)}</span><span class="small">${esc(m.ko)}</span>
   ${ready&&!open?`<span class="small">Unit ${String(n-1).padStart(2,"0")}을 끝내면 열려요</span>`:""}
   <div class="steps">${step("단어",s.quiz)}${step("낭독",s.rec1)}${step("말하기",s.rec2)}${step("독해",s.comp)}${step("라이팅",s.write)}</div></button>`;
}

function ltJudge(prov,read){
  const lvl=prov>=600?prov:600, rc=read.filter(Boolean).length, pct=rc/6;
  let final=lvl, move="stay";
  if(pct>=0.85 && prov>=600 && lvl<1000){ final=lvl+100; move="up"; }
  else if(pct<0.5 && lvl>600){ final=lvl-100; move="down"; }
  if(prov===0 && pct<0.5){ final=0; move="down"; }
  return {lvl,rc,pct,final,move};
}
function recommend(f){ if(f>=800&&f<=900) return f===900?"Season 1 (Intermediate) · 후반부(900L대, W13~)도 가능":"Season 1 (Intermediate) · W1부터";
  if(f>=1000) return "Advanced · Season 1 후반 또는 상위 과정"; return "Basic 과정 먼저 (700L대까지 기초)"; }

  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.join(""); }

  if(a==="pickLT"){ S.tLT=el.dataset.id; return render(); }
  if(a==="makeCode"){ const name=$("#tcName").value.trim(); if(!name){ toast("학생 이름을 입력해 주세요"); return; } const code=await genCode();
    if(await save("testers/"+code,{name,grade:$("#tcGrade").value,school:$("#tcSchool").value,contact:$("#tcContact").value.trim(),status:"응시 전",attempts:0,created:Date.now(),createdAt:nowStr()})){ S.tLT=code; toast(`응시 코드 ${code}를 만들었어요`); } return render(); }
  if(a==="copyMsg"){ const t=$("#ltMsgText"); try{ await navigator.clipboard.writeText(t.value); $("#copyNote").textContent="복사했어요. 카톡에 붙여넣으세요."; }catch(e){ t.focus(); t.select(); $("#copyNote").textContent="글이 선택됐어요. Ctrl+C(또는 길게 눌러 복사)로 복사하세요."; } return; }
  if(a==="saveLT"){ const p="testers/"+el.dataset.id, x=await dget(p); x.finalLevel=+$("#finalLv").value; if(x.status!=="등록") x.status="상담 완료";
    if(await save(p,x)){ if(x.studentId){ const sp="students/"+x.studentId, st=await dget(sp); if(st){ st.level=`${LV_NAME[x.finalLevel]}${x.finalLevel?" · "+x.finalLevel+"L대":""}`; await save(sp,st); } } toast("최종 레벨을 저장했어요"); } return render(); }
  if(a==="enrollLT"){ const p="testers/"+el.dataset.id, x=await dget(p); x.finalLevel=+$("#finalLv").value; const id="s_"+Date.now().toString(36), pin=await genPin();
    const ok=await save("students/"+id,{name:x.name,grade:x.grade,level:`${LV_NAME[x.finalLevel]}${x.finalLevel?" · "+x.finalLevel+"L대":""}`,pin,status:"수강 중",joined:nowStr().split(" ")[0],testerCode:el.dataset.id,testRequested:false});
    if(ok){ x.status="등록"; x.studentId=id; await save(p,x); toast(`등록했어요 · PIN ${pin}`); } return render(); }
  if(a==="sendTest"){ const sp="students/"+el.dataset.s, st=await dget(sp); let code=st.testerCode;
    if(!code||!(await dget("testers/"+code))){ code=await genCode(); await save("testers/"+code,{name:st.name,grade:st.grade,school:"",contact:"",status:"응시 전",attempts:0,created:Date.now(),createdAt:nowStr(),studentId:el.dataset.s}); }
    st.testerCode=code; st.testRequested=true; if(await save(sp,st)) toast(`${st.name} 학생 대시보드에 레벨 테스트를 보냈어요`); return render(); }
});
document.addEventListener("keydown",e=>{ if(e.key!=="Enter") return; if(e.target.id==="pin") document.querySelector('[data-a="login"]').click(); if(e.target.id==="ltCode") document.querySelector('[data-a="ltCode"]').click(); });

// ---------- listen (browser speech) ----------
// ---------- read-along: sentence + word highlight ----------
let PASS=null, RUN=0, TTS_ON=false;
function prepPassage(){
  const el=$("#pass"); if(!el||el.dataset.ready) return;
  let txt=""; const words=[];
  const walk=n=>{ for(const c of [...n.childNodes]){
    if(c.nodeType===3){ const frag=document.createDocumentFragment();
      c.nodeValue.split(/(\s+)/).forEach(part=>{ if(!part) return;
        if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); if(!txt.endsWith(" ")) txt+=" "; }
        else { const sp=document.createElement("span"); sp.className="tw"; sp.textContent=part; sp.dataset.w=words.length; words.push({el:sp,start:txt.length,end:txt.length+part.length}); txt+=part; frag.appendChild(sp); } });
      c.replaceWith(frag); }
    else if(c.nodeName==="BR"||(c.classList&&c.classList.contains("pgap"))){ if(!txt.endsWith(" ")) txt+=" "; }
    else walk(c); } };
  walk(el); el.dataset.ready="1";
  const sents=[]; const re=/[^.!?]+[.!?]+["”’)\]]*|[^.!?]+$/g; let m;
  while((m=re.exec(txt))){ const s=m.index+(m[0].length-m[0].trimStart().length), e=m.index+m[0].trimEnd().length; if(e>s) sents.push({start:s,end:e}); }
  PASS={txt,words,sents};
  el.onclick=e=>{ const w=e.target.closest(".tw"); if(!w) return; const wi=+w.dataset.w, st=PASS.words[wi].start; const si=Math.max(0,PASS.sents.findIndex(s=>st>=s.start&&st<s.end)); startRead(si); };
}
function clearMarks(){ if(!PASS) return; PASS.words.forEach(w=>w.el.classList.remove("ts","tc")); }
function wordsIn(a,b){ return PASS.words.filter(w=>w.start<b&&w.end>a); }
function stopTTS(){ RUN++; TTS_ON=false; try{ speechSynthesis.cancel(); }catch(e){} clearMarks(); const b=$("#ttsBtn"); if(b) b.textContent="🔊 지문 듣기"; }
function startRead(si){
  if(!("speechSynthesis" in window)){ toast("이 브라우저에서는 지문 듣기를 쓸 수 없어요"); return; }
  prepPassage(); if(!PASS) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const run=++RUN; TTS_ON=true; const b=$("#ttsBtn"); if(b) b.textContent="■ 멈추기";
  const voice=speechSynthesis.getVoices().find(v=>/en-US/i.test(v.lang));
  const speakOne=i=>{
    if(run!==RUN) return;
    if(i>=PASS.sents.length){ stopTTS(); return; }
    const s=PASS.sents[i], text=PASS.txt.slice(s.start,s.end);
    clearMarks(); const sw=wordsIn(s.start,s.end); sw.forEach(w=>w.el.classList.add("ts"));
    if(sw[0]){ const r=sw[0].el.getBoundingClientRect(); if(r.top<80||r.bottom>innerHeight-40) sw[0].el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=0.9; if(voice) u.voice=voice;
    u.onboundary=e=>{ if(run!==RUN||(e.name&&e.name!=="word")) return; const pos=s.start+e.charIndex;
      const ws=wordsIn(s.start,s.end); const w=ws.find(w=>pos<w.end&&pos>=w.start-1)||ws.find(w=>w.start>=pos);
      if(w){ ws.forEach(x=>{ x.el.classList.add("ts"); if(x!==w) x.el.classList.remove("tc"); }); w.el.classList.add("tc"); } };
    u.onend=()=>{ if(run===RUN) speakOne(i+1); };
    u.onerror=e=>{ if(run===RUN&&e.error!=="interrupted"&&e.error!=="canceled") speakOne(i+1); };
    speechSynthesis.speak(u);
  };
  speakOne(si||0);
}
function sayWord(w,slow){
  try{ if(!("speechSynthesis" in window)) throw 0; stopTTS();
    const u=new SpeechSynthesisUtterance(w); u.lang="en-US"; u.rate=slow?0.6:0.85;
    const v=speechSynthesis.getVoices().find(v=>/en-US/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u);
  }catch(e){ toast("이 브라우저에서는 발음 듣기를 쓸 수 없어요"); }
}
function toggleTTS(){ if(TTS_ON) return stopTTS(); startRead(0); }

// ---------- boot ----------
(async function boot(){
  bar(); render();
  if(!TOKEN) return;
  try{ const j=await api("/api/me",{});
    if(j.role==="teacher"){ S.teacher=true; S.t="check"; S.view="teacher"; }
    else if(j.student){ S.student=j.student; useLevel(stLevel(j.student)); S.view="dash"; }
  }catch(e){ setToken(null); }
  bar(); render();
})();

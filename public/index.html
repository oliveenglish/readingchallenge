": 0, "ex": "It is likely that + 절 = ~일 가능성이 높다."}, {"type": "문법 · 완곡한 표현 (may suggest, it is likely that)", "q": "Which sentence sounds the MOST careful (hedged)?", "options": ["Robots will destroy all jobs.", "Robots definitely take every job.", "Robots never help anyone.", "Robots may change some jobs in the future."], "answer": 3, "ex": "may, some 등으로 단정을 피한 문장이에요."}]}, "6": {"passage": "In the year 2081, the Central Library of New Seoul had forty floors, two million digital books, and exactly one human librarian. Her name was Mrs. Ahn, and she was seventy-three years old.\n\nEvery other job in the library was done by machines. Silver robots glided between the shelves, and a cheerful voice named ARIA answered every question in under a second. Visitors rarely spoke to Mrs. Ahn, and most of them didn't realize she was human.\n\n\"By next spring,\" the city council announced, \"ARIA will have replaced all remaining staff.\" Mrs. Ahn read the message twice, then folded her glasses and looked out over the empty reading room.\n\nOn her last week, a boy of about ten appeared at her desk. He was holding a cracked tablet. \"ARIA says I should read books for my age group,\" he said. \"But I want something that isn't on the list.\"\n\nMrs. Ahn smiled for the first time in days. \"What do you like?\"\n\n\"I don't know yet,\" he said, \"and that's the problem.\"\n\nSo she asked him questions that ARIA never asked: what made him laugh, what scared him, and what he wondered about at night. Then she walked him to the very last shelf, where a few dusty paper books were kept, and handed him one about a girl who sailed alone around the world.\n\nThe boy came back the next day and the day after that, and on Friday, he brought two friends.\n\nWhen Mrs. Ahn finally left the building, she did not know whether the library would remember her. But she knew that, by the time those children grew up, they would have read hundreds of books that no machine had chosen for them.", "speaking": "Which jobs might disappear in the future? Give your opinion, another view, and an example. (60 seconds)", "speakStarters": ["I think … might disappear in the future.", "For example, … .", "On the other hand, some people believe … .", "By 2050, … will have … ."], "prompt": "Continue the story. What happens to the library after Mrs. Ahn leaves? Write three paragraphs (about 180 words). Use will have + past participle at least once.", "starters": ["Paragraph 1: A few months after Mrs. Ahn left, … .", "Paragraph 2: One day, the boy … .", "Paragraph 3: By the end of the year, … will have … ."], "cards": [{"word": "librarian", "form": "librarian", "pos": "n.", "en": "a person who works in a library and helps readers", "ko": "사서"}, {"word": "glide", "form": "glided", "pos": "v.", "en": "to move smoothly and quietly", "ko": "미끄러지듯 움직이다"}, {"word": "cheerful", "form": "cheerful", "pos": "adj.", "en": "happy and positive", "ko": "쾌활한"}, {"word": "realize", "form": "realize", "pos": "v.", "en": "to suddenly understand or become aware of something", "ko": "깨닫다"}, {"word": "announce", "form": "announced", "pos": "v.", "en": "to tell people something officially", "ko": "발표하다"}, {"word": "remaining", "form": "remaining", "pos": "adj.", "en": "still left after others have gone", "ko": "남아 있는"}, {"word": "staff", "form": "staff", "pos": "n.", "en": "the people who work for an organization", "ko": "직원들"}, {"word": "cracked", "form": "cracked", "pos": "adj.", "en": "having a thin break on the surface", "ko": "금이 간"}, {"word": "wonder", "form": "wondered", "pos": "v.", "en": "to think about something and want to know more", "ko": "궁금해하다"}, {"word": "dusty", "form": "dusty", "pos": "adj.", "en": "covered with dust", "ko": "먼지투성이의"}, {"word": "shelf", "form": "shelf", "pos": "n.", "en": "a flat board on a wall or in a cupboard for holding things", "ko": "선반, 책장 칸"}, {"word": "sail", "form": "sailed", "pos": "v.", "en": "to travel by boat", "ko": "항해하다"}, {"word": "hundreds", "form": "hundreds", "pos": "n.", "en": "a very large number; many groups of one hundred", "ko": "수백, 아주 많은 수"}], "vocab": [["librarian", "The librarian helped me find a book.", ["a person who sells tablets", "a person who writes books", "a robot that cleans", "a person who works in a library and helps readers"], 3, "librarian = 사서."], ["glide", "The swan glided across the lake.", ["to fall suddenly", "to stomp loudly", "to move smoothly and quietly", "to stop sharply"], 2, "glide = 미끄러지듯 가다."], ["cheerful", "She gave me a cheerful smile.", ["tired", "happy and positive", "gloomy", "angry"], 1, "cheerful = 쾌활한."], ["realize", "I didn't realize it was so late.", ["to suddenly understand or become aware of something", "to hide", "to forget", "to ignore"], 0, "realize = 깨닫다."], ["announce", "The principal announced the winners.", ["to whisper", "to forget", "to tell people something officially", "to keep secret"], 2, "announce = 발표하다."], ["remaining", "Eat the remaining cookies.", ["still left after others have gone", "brand new", "already gone", "broken"], 0, "remaining = 남은."], ["staff", "The hotel staff were very helpful.", ["the building", "the customers", "the visitors", "the people who work for an organization"], 3, "staff = 직원."], ["cracked", "My phone screen is cracked.", ["having a thin break on the surface", "brand new", "soft", "perfectly smooth"], 0, "cracked = 금이 간."], ["wonder", "I wonder what is at the bottom of the sea.", ["to know already", "to think about something and want to know more", "to be bored", "to stop thinking"], 1, "wonder = 궁금해하다."], ["dusty", "We found a dusty old box in the attic.", ["new", "wet", "covered with dust", "shiny and clean"], 2, "dusty = 먼지 쌓인."], ["shelf", "Put the book back on the shelf.", ["a door", "a flat board on a wall or in a cupboard for holding things", "a window", "a floor"], 1, "shelf = 선반."], ["sail", "They sailed across the Pacific Ocean.", ["to travel by boat", "to fly", "to drive", "to walk"], 0, "sail = 항해하다."], ["hundreds", "Hundreds of people came to the concert.", ["a very large number; many groups of one hundred", "none", "only a few", "exactly ten"], 0, "hundreds of = 수백의."]], "comp": [{"type": "주제", "q": "What is the main theme of the story?", "options": ["Paper books should be thrown away.", "Children should only read books for their age group.", "Human care and curiosity can offer something that machines cannot.", "Robots are better librarians than humans."], "answer": 2, "ex": "기계가 줄 수 없는 사람의 관심과 질문의 가치가 주제예요."}, {"type": "세부 내용", "q": "What did the boy want?", "options": ["a new tablet", "a book that was not on ARIA's list", "a job at the library", "help with homework"], "answer": 1, "ex": "But I want something that isn't on the list."}, {"type": "추론 (상징)", "q": "What do the dusty paper books on the last shelf most likely represent?", "options": ["the future of robots", "ARIA's favorite books", "old human ways of choosing and sharing stories", "things that are broken and useless"], "answer": 2, "ex": "기계가 고르지 않은, 사람이 건네는 책 → 인간적인 방식의 상징."}, {"type": "추론", "q": "Why did Mrs. Ahn smile \"for the first time in days\"?", "options": ["ARIA made a mistake.", "She got a new job.", "The boy's tablet was funny.", "Someone finally needed something only she could give."], "answer": 3, "ex": "기계가 할 수 없는, 사람의 도움이 필요한 순간이 찾아왔어요."}, {"type": "어조·글쓴이의 의도", "q": "What is the tone of the ending?", "options": ["scary and dark", "angry and bitter", "funny and silly", "quietly hopeful"], "answer": 3, "ex": "자신은 떠나지만 아이들이 기계가 고르지 않은 책을 읽을 것이라는 조용한 희망."}, {"type": "문법 · 미래완료 (will have replaced)", "q": "By next spring, ARIA ______ all remaining staff.", "options": ["will have replaced", "has replaced", "will replace", "replaced"], "answer": 0, "ex": "미래 시점(by next spring)까지 완료 → will have + 과거분사."}, {"type": "문법 · 미래완료 (will have replaced)", "q": "By the time they grow up, they ______ hundreds of books.", "options": ["had read", "will read", "will have read", "have read"], "answer": 2, "ex": "by the time + 미래 → will have read."}, {"type": "문법 · 미래완료 (will have replaced)", "q": "Which sentence is correct?", "options": ["By 2030, I will graduated from college.", "By 2030, I will have graduate from college.", "By 2030, I will have graduated from college.", "By 2030, I have graduated from college."], "answer": 2, "ex": "will have + 과거분사(graduated)."}]}, "7": {"passage": "In 1989, world leaders signed an agreement called the United Nations Convention on the Rights of the Child. Today, almost every country in the world has accepted it, making it one of the most widely accepted human rights agreements in history. One of its most important promises is simple: every child has the right to an education.\n\nIt is easy to take school for granted. For many students, school is just a normal part of life, sometimes even a boring one. However, it is shocking that, according to UNESCO, about 250 million children and teenagers around the world are still not in school.\n\nThe reasons are complex. In some regions, the nearest school is hours away on foot. In others, families are so poor that children must work to help pay for food. War can destroy schools or make the journey too dangerous. In certain places, girls are kept at home simply because they are girls.\n\nWhy does this matter so much? It is clear that education changes lives. Children who can read and write are better able to find good jobs, stay healthy, and understand their rights. Educated communities also tend to be more peaceful and more prosperous. In other words, when one child learns, the benefits spread far beyond that child.\n\nProgress is possible. Some countries have built schools in remote villages, offered free meals to encourage attendance, and trained more teachers. Online lessons have also helped students in areas where teachers are scarce.\n\nStill, much more needs to be done. It is essential that people everywhere, including young people like you, remember that learning is not a privilege for a lucky few. It is a right for every child.", "speaking": "Imagine a day with no school at all. Give your opinion, another view, and an example. (60 seconds)", "speakStarters": ["At first, a day without school might seem … .", "However, it is clear that … .", "For example, … .", "So I believe … ."], "prompt": "Write a three-paragraph essay (about 180 words): Why should every child be able to learn? Use \"It is … that …\" at least once.", "starters": ["Paragraph 1: Many children around the world … . It is important that … .", "Paragraph 2: First, … . For example, … . Second, … .", "Paragraph 3: In conclusion, it is essential that … ."], "cards": [{"word": "agreement", "form": "agreement", "pos": "n.", "en": "a promise or arrangement made between people or countries", "ko": "협약, 합의"}, {"word": "convention", "form": "Convention", "pos": "n.", "en": "a formal agreement between countries", "ko": "협약, 국제 조약"}, {"word": "right", "form": "Rights", "pos": "n.", "en": "something that you are allowed to have or do by law", "ko": "권리"}, {"word": "granted", "form": "granted", "pos": "adj.", "en": "accepted as normal without thinking about it", "ko": "당연시하는"}, {"word": "complex", "form": "complex", "pos": "adj.", "en": "having many connected parts; hard to understand", "ko": "복잡한"}, {"word": "region", "form": "regions", "pos": "n.", "en": "a large area of a country or the world", "ko": "지역"}, {"word": "prosperous", "form": "prosperous", "pos": "adj.", "en": "successful and rich", "ko": "번영하는, 부유한"}, {"word": "benefit", "form": "benefits", "pos": "n.", "en": "a good result or advantage", "ko": "혜택, 이익"}, {"word": "remote", "form": "remote", "pos": "adj.", "en": "far away from cities and other people", "ko": "외딴, 멀리 떨어진"}, {"word": "attendance", "form": "attendance", "pos": "n.", "en": "being present at school or an event", "ko": "출석"}, {"word": "scarce", "form": "scarce", "pos": "adj.", "en": "not enough; hard to find", "ko": "부족한, 드문"}, {"word": "essential", "form": "essential", "pos arce = 부족한."], ["essential", "Water is essential for life.", ["extremely important and necessary", "unnecessary", "unimportant", "optional"], 0, "essential = 필수적인."], ["privilege", "Traveling abroad is a privilege for many people.", ["a right for everyone", "a duty", "a punishment", "a special advantage that only some people have"], 3, "privilege = 특권 (모두의 권리가 아닌 일부의 혜택)."]], "comp": [{"type": "주제·요지", "q": "What is the main idea of the passage?", "options": ["School is boring for most students.", "Education is a right for every child, but millions still cannot go to school.", "Only rich countries need schools.", "Online lessons have solved every problem."], "answer": 1, "ex": "교육은 모든 아이의 권리지만 아직 많은 아이가 학교에 못 간다는 요지예요."}, {"type": "세부 내용", "q": "According to UNESCO, about how many children and teenagers are not in school?", "options": ["about 2.5 billion", "about 1989", "about 25 million", "about 250 million"], "answer": 3, "ex": "about 250 million children and teenagers."}, {"type": "추론", "q": "Why might free school meals encourage attendance?", "options": ["Children don't like cooking.", "Poor families can send children to school without worrying about food.", "Meals make the school day shorter.", "Teachers want to eat with students."], "answer": 1, "ex": "가난해서 아이가 일해야 하는 가정의 부담을 덜어 줘요."}, {"type": "추론", "q": "What does the writer mean by \"when one child learns, the benefits spread far beyond that child\"?", "options": ["Children should study alone.", "Education helps families and communities, not just the student.", "Teachers get paid more.", "Only the child benefits from school."], "answer": 1, "ex": "교육받은 공동체가 더 평화롭고 번영한다는 앞 문장과 이어져요."}, {"type": "글쓴이의 목적", "q": "What is the writer's main purpose?", "options": ["to complain about homework", "to sell school supplies", "to describe a single school in detail", "to inform readers and persuade them that education is every child's right"], "answer": 3, "ex": "정보를 주고 '교육은 특권이 아니라 권리'라고 설득해요."}, {"type": "문법 · It is + e shouting at her.\n\nRuby's courage helped open the doors for many other children. In 1964, the artist Norman Rockwell painted her walk to school, and the image became famous around the world. Today, Ruby Bridges visits schools to talk about fairness. She often tells students that hatred is learned, and that it can be unlearned.", "speaking": "Tell about a moment when you needed courage. Give your opinion, another view, and an example. (60 seconds)", "speakStarters": ["I needed courage when … .", "My friend told me to … .", "Some people think courage means … , but … .", "So I believe courage is … ."], "prompt": "Write five interview questions for Ruby Bridges, then write a three-paragraph report (about 180 words) about her, using at least two examples of reported speech (asked if, told … to).", "starters": ["Questions: 1. How did you feel when … ? 2. …", "Paragraph 1: In 1960, Ruby Bridges … .", "Paragraph 2: Her father asked if … . The marshals told her to … .", "Paragraph 3: Ruby's story teaches us that … ."], "cards": [{"word": "segregated", "form": "segregated", "pos": "adj.", "en": "separated by race or another group by law or custom", "ko": "(인종 등으로) 분리된"}, {"word": "attend", "form": "attend", "pos": "v.", "en": "to go to a school, class, or event", "ko": "다니다, 참석하다"}, {"word": "court", "form": "court", "pos": "n.", "en": "a place where legal decisions are made by a judge", "ko": "법원"}, {"word": "rule", "form": "ruled", "pos": "v.", "en": "to make an official legal decision", "ko": "판결하다"}, {"word": "deserve", "form": "deserved", "pos": "v.", "en": "to have earned something because of who you are or what you did", "ko": "~을 받을 자격이 있다"}, {"word": "federal", "form": "federal", "pos": "adj.", "en": "connected to the national government", "ko": "연방의"}, {"word": "marshal", "form": "marshals", "pos": "n.", "en": "an officer who protects people and enforces the law", "ko": "연방 보안관"}, {"word": "crowd", "form": "crowd", "pos": "n.", "en": "a large group of people in one place", "ko": "군중"}, {"word": "parade", "form": "parade", "pos": "n.", "en": "a public celebration with people marching in the street", "ko": "퍼레이드"}, {"word": "entire", "form": "entire", "pos": "adj.", "en": "whole; complete", "ko": "전체의"}, {"word": "pray", "form": "pray", "pos": "v.", "en": "to speak to God or a higher power", "ko": "기도하다"}, {"word": "courage", "form": "courage", "pos": "n.", "en": "the ability to do something brave even when you are afraid", "ko": "용기"}, {"word": "hatred", "form": "hatred", "pos": "n.", "en": "a very strong feeling of dislike", "ko": "증오"}], "vocab": [["segregated", "In the past, buses in some places were segregated.", ["brand new", "very crowded", "separated by race or another group by law or custom", "open to everyone equally"], 2, "segregated = 분리된."], ["attend", "She attends a school near her house.", ["to avoid", "to go to a school, class, or event", "to build", "to close"], 1, "attend = 다니다."], ["court", "The court decided the case.", ["a shop", "a place where legal decisions are made by a judge", "a sports field only", "a classroom"], 1, "court = 법원."], ["rule", "The judge ruled that the law was unfair.", ["to make an official legal decision", "to forget", "to guess", "to ask"], 0, "rule = 판결하다."], ["deserve", "You deserve a rest after working so hard.", ["to steal", "to refuse", "to lose", "to have earned something because of who you are or what you did"], 3, "deserve = ~할 자격이 있다."], ["federal", "Federal laws apply to the whole country.", ["private", "connected to the national government", "foreign", "local only"], 1, "federal = (미국) 연방의."], ["marshal", "The marshals walked beside the girl.", ["a doctor", "a news reporter", "an officer who protects people and enforces the law", "a teacher"], 2, "marshal = 보안관."], ["crowd", "A huge crowd gathered outside.", ["a single person", "a large group of people in one place", "a small family", "an empty street"], 1, "crowd = 군중."], ["parade", "We watched the holiday parade downto d with the crowd."], "answer": 1, "ex": "자신을 미워하는 사람들을 위해 기도한 것은 놀라운 용기와 너그러움이에요."}, {"type": "글쓴이의 의도", "q": "Why does the writer end with Ruby's message that hatred can be unlearned?", "options": ["to describe the painting", "to explain how schools are built", "to show that her story still teaches an important lesson today", "to say that history is boring"], "answer": 2, "ex": "현재까지 이어지는 메시지로 글을 마무리해요."}, {"type": "문법 · 간접화법 (asked if / told … to)", "q": "Her father: \"Is it safe?\" → Her father asked ______ it was safe.", "options": ["if", "to", "that", "what"], "answer": 0, "ex": "Yes/No 의문문의 간접화법 → asked if + 주어 + 동사."}, {"type": "문법 · 간접화법 (asked if / told … to)", "q": "The marshals: \"Keep walking.\" → The marshals told her ______ walking.", "options": ["kept", "keep", "to keep", "keeping"], "answer": 2, "ex": "명령문의 간접화법 → told + 사람 + to 동사원형."}, {"type": "문법 · 간접화법 (asked if / told … to)", "q": "Teacher: \"Don't look back.\" Which is correct?", "options": ["The teacher told her don't look back.", "The teacher told her to not looking back.", "The teacher said her not look back.", "The teacher told her not to look back."], "answer": 3, "ex": "부정 명령 → told + 사람 + not to 동사원형."}]}, "9": {"passage": "CHARACTERS: MS. LEE, a teacher; JUN and SARA, students; DANI, a new student\n\nSCENE: A classroom after school. A poster on the wall reads \"Science Fair: Team Leader Election.\"\n\nMS. LEE: You've all worked hard on the robot project, but only one person can present it at the science fair. The class voted, and it's a tie between Jun and Sara.\n\nJUN: (crossing his arms) I built most of the robot. I stayed after school every day for two weeks.\n\nSARA: (quietly) But I wrote all the code. Without the code, the robot is just a box with wheels.\n\nMS. LEE: You're both right. That's what makes this hard. (She turns.) Dani, you joined the team last. What do you think?\n\nDANI: (nervously) Me? Well… I wish I knew both of you better. Then this would be easier.\n\nJUN: Just pick one of us.\n\nDANI: (pausing) Jun, you made the robot strong. Sara, you made it smart. But when the robot fell apart on Tuesday, you both blamed each other instead of fixing it together. I wish you had seen how worried the rest of us were.\n\n(Silence. JUN and SARA look at each other.)\n\nSARA: (softly) I wish I hadn't said your design was messy, Jun.\n\nJUN: I wish I had asked for your help sooner.\n\nMS. LEE: So what is the fair decision?\n\nDANI: Maybe the fair decision isn't choosing one person. Maybe it's letting both of them present, half each, the way the robot was built.\n\nMS. LEE: (smiling) Fair doesn't always mean equal, but sometimes it does. Jun? Sara?\n\nJUN and SARA: (together) Deal.\n\n(Lights fade.)", "speaking": "What does \"fair\" mean to you? Give your opinion, another view, and an example. (60 seconds)", "speakStarters": ["To me, being fair means … .", "For example, … .", "Some people think fair always means equal, but … .", "I wish … ."], "prompt": "Write one short scene as a script (about 180 words) about a fair or unfair decision. Include at least three characters, stage directions in brackets, and one sentence with \"I wish …\".", "starters": ["CHARACTERS: …", "SCENE: …", "A: (worried) … .", "B: I wish … .", "C: Maybe the fair decision is … ."], "cards": [{"word": "election", "form": "Election", "pos": "n.", "en": "the process of choosing someone by voting", "ko": "선거"}, {"word": "present", "form": "present", "pos": "v.", "en": "to show or explain something to a group of people", "ko": "발표하다"}, {"word": "vote", "form": "voted", "pos": "v.", "en": "to choose someone or something by raising hands or marking a paper", "ko": "투표하다"}, {"word": "tie", "form": "tie", "pos": "n.", "en": "a result where two sides have the same score", "ko": "동점, 무승부"}, {"word": "code", "form": "code", "pos": "n.", "en": "instructions written for a computer", "ko": "코드"}, {"word": "nervously", "form": "nervously", "pos": "adv.", "en": "in a worried and slightly s  "Dani built the robot alone.", "Dani is the teacher.", "Dani wants to present."], "answer": 0, "ex": "새로 들어온 Dani는 어느 편에도 서지 않고 양쪽을 볼 수 있었어요."}, {"type": "어조·글쓴이의 의도", "q": "What does Ms. Lee mean by \"Fair doesn't always mean equal, but sometimes it does\"?", "options": ["Only one person can ever win.", "Equal is always unfair.", "Fairness depends on the situation; here, sharing equally is fair.", "Teachers should never decide."], "answer": 2, "ex": "상황에 따라 공정함의 모습이 달라요. 이번엔 반반이 공정해요."}, {"type": "문법 · I wish + 과거 / 과거완료", "q": "I wish I ______ both of you better. (now)", "options": ["know", "had known", "will know", "knew"], "answer": 3, "ex": "현재 사실의 반대 소망 → wish + 과거."}, {"type": "문법 · I wish + 과거 / 과거완료", "q": "I wish I ______ for your help sooner. (in the past)", "options": ["would ask", "ask", "had asked", "asked"], "answer": 2, "ex": "과거 사실의 반대 소망 → wish + had + 과거분사."}, {"type": "문법 · I wish + 과거 / 과거완료", "q": "Sara regrets what she said yesterday. Which sentence is correct?", "options": ["I wish I hadn't said that.", "I wish I don't say that.", "I wish I didn't say that tomorrow.", "I wish I haven't said that."], "answer": 0, "ex": "과거 일에 대한 후회 → wish + hadn't + 과거분사."}]}, "10": {"passage": "By 2050, about two out of every three people on Earth are expected to live in cities. That means cities will need more homes, more transportation, and more clean energy than ever before, while producing far less pollution. How can they do it? Around the world, planners are already testing some surprising ideas.\n\nIn Seoul, a busy elevated highway once ran above the Cheonggyecheon stream, which had been covered with concrete for decades. The city was going to repair the aging road, but instead, it made a bold decision. In the early 2000s, workers tore down the highway and restored the stream. Today, it is a green walkway where people relax, children play, and the air in summer is noticeably cooler than on nearby streets.\n\nCopenhagen, the capital of Denmark, has focused on bicycles. Wide bike lanes, bridges just for cyclists, and traffic lights timed for bike speed have made cycling the easiest way to get around. Now a large share of residents ride to work or school every day, even in winter.\n\nOther cities are growing upward rather than outward. Vertical farms grow lettuce and herbs on shelves inside tall buildings, using far less water and land than traditional farms. Green roofs, covered with plants, absorb rainwater and keep buildings cooler.\n\nNone of these ideas is perfect. They can be expensive, and what works in one city may not work in another. Still, they show that cities don't have to choose between growth and nature. The city of the future may not be full of flying cars. Instead, it may be full of trees, bicycles, and clean water.", "speaking": "What must every city of the future have? Give your opinion, another view, and an example. (60 seconds)", "speakStarters": ["I believe every future city must have … .", "For example, … .", "Some people think … is more important, but … .", "In the past, I was going to say … , but now I think … ."], "prompt": "Design your own city of the future. Write three paragraphs (about 180 words): your main idea, how it works with examples, and the possible problems and solutions.", "starters": ["Paragraph 1: My city of the future will be … .", "Paragraph 2: First, … . For example, … .", "Paragraph 3: One problem might be … . To solve this, … ."], "cards": [{"word": "transportation", "form": "transportation", "pos": "n.", "en": "ways of moving people or goods from one place to another", "ko": "교통, 운송"}, {"word": "planner", "form": "planners", "pos": "n.", "en": "a person who designs how a city or area will develop", "ko": "(도시) 계획가"}, {"word": "elevated", "form": "elevated", "pos": "adj.", "en": "raised above the ground", "ko": "높이 들어 올린, 고가의"}, {"word": "concrete", "form": "concrete", "pos": "n.", "en": "a hard building material made from cement, sand, and water", "ko": "콘크리트"}, {"word  0, "ex": "콘크리트 대신 물과 녹지가 생겨 주변보다 시원해졌어요."}, {"type": "추론", "q": "What can you infer about why many people in Copenhagen cycle even in winter?", "options": ["The city has made cycling easier than other ways to travel.", "Bikes are cheaper than shoes.", "They are not allowed to drive.", "Buses are free only in summer."], "answer": 0, "ex": "자전거 전용 도로·다리·신호 → 자전거가 가장 편한 이동 수단."}, {"type": "어조·글쓴이의 의도", "q": "What is the writer's attitude toward these ideas?", "options": ["angry at city planners", "hopeful but realistic about their limits", "completely negative", "uninterested"], "answer": 1, "ex": "None of these ideas is perfect… Still, they show that … → 희망적이지만 한계도 인정해요."}, {"type": "문법 · 과거에서 본 미래 (was going to)", "q": "The city ______ repair the old road, but it changed its plan.", "options": ["was going to", "is going to", "will", "goes to"], "answer": 0, "ex": "과거에 계획했던(하지만 하지 않은) 일 → was going to."}, {"type": "문법 · 과거에서 본 미래 (was going to)", "q": "We ______ go to the beach, but it started to rain.", "options": ["are going to", "will", "were going to", "go"], "answer": 2, "ex": "과거의 계획 + 실제로는 못 함 → were going to."}, {"type": "문법 · 과거에서 본 미래 (was going to)", "q": "Which sentence is correct?", "options": ["I am going to call you yesterday, but I forgot.", "I was going call you, but I forgot.", "I was going to call you, but I forgot.", "I was going to called you, but I forgot."], "answer": 2, "ex": "was going to + 동사원형."}]}, "11": {"passage": "A new T-shirt for five dollars sounds like a great deal. But who really pays for it? Despite its low price, fast fashion may carry hidden costs for people and the planet.\n\n\"Fast fashion\" refers to clothing that is designed, produced, and sold very quickly and cheaply. Some brands release new styles every week. This encourages shoppers to buy more and wear each item fewer times. In many countries, people now buy far more clothes than they did twenty years ago. Yet they keep them for a much shorter time.\n\nThe environmental cost begins with production. Growing the cotton for a single T-shirt can require around 2,700 liters of water. That is roughly what one person drinks in two and a half years. Many cheap clothes are made from polyester, a kind of plastic that sheds tiny fibers into rivers and oceans when it is washed. And when clothes are thrown away, most are not recycled. According to one estimate, the equivalent of a garbage truck full of textiles is burned or buried every second.\n\nThere is a human cost as well. In spite of growing awareness, many garment workers, especially in parts of Asia, still work long hours for very low pay. In 2013, a factory building called Rana Plaza collapsed in Bangladesh. More than 1,100 workers were killed. The tragedy shocked the world and led to new safety agreements.\n\nWhat can young shoppers do? Buying fewer but better clothes, swapping with friends, shopping secondhand, and repairing items instead of replacing them can all make a difference. In spite of the temptation of cheap prices, the most sustainable piece of clothing is often the one already in your closet.", "speaking": "What is your rule for buying clothes? Give your opinion, another view, and an example. (60 seconds)", "speakStarters": ["My rule for buying clothes is … .", "For example, … .", "Some people say cheap clothes are fine because … .", "Despite that, I think … ."], "prompt": "Write a three-paragraph campaign article (about 180 words) encouraging students to wear their clothes longer. Use despite or in spite of at least once.", "starters": ["Paragraph 1: Do you know what really happens to your old T-shirt? … .", "Paragraph 2: First, … . Despite … , … .", "Paragraph 3: So, let's … . Together, we can … ."], "cards": [{"word": "deal", "form": "deal", "pos": "n.", "en": "something bought at a good price", "ko": "좋은 거래, 싼 가격"}, {"word": "refer", "form": "refers", "pos": "v.", "en": "to describe or be about something", "ko": "~을 가리키다"}, {"word": "release", "form": "release", "pos": "v.", "en": "to make a new product available to the public", "ko": "출시하다"}, {"word": "production", "form": "production", "pos": "n.", "en": "the process of making or growing things", "ko": "생산"}, {"word": "polyester", "form": "polyester", "pos": "n.", "en": "a type of fabric made from plastic", "ko": "폴리에스테르"}, {"word": "shed", "form": "sheds", "pos": "v.", "en": "to let something fall off", "ko": "떨어뜨리다, 흘리다"}, {"word": "fiber", "form": "fibers", "pos": "n.", "en": "a thin thread of material", "ko": "섬유"}, {"word": "equivalent", "form": "equivalent", "pos": "n.", "en": "something equal in amount or value", "ko": "~에 상당하는 것"}, {"word": "textile", "form": "textiles", "pos": "n.", "en": "cloth or fabric", "ko": "직물, 섬유 제품"}, {"word": "garment", "form": "garment", "pos": "n.", "en": "a piece of clothing", "ko": "의복, 옷"}, {"word": "tragedy", "form": "tragedy", "pos": "n.", "en": "a very sad event, often with deaths", "ko": "비극"}, {"word": "secondhand", "form": "secondhand", "pos": "adv./adj.", "en": "used before by someone else", "ko": "중고로, 중고의"}, {"word": "sustainable", "form": "sustainable", "pos": "adj.", "en": "able to continue without harming the environment", "ko": "지속 가능한"}], "vocab": [["deal", "These shoes were a great deal.", ["a gift", "a broken item", "something bought at a good price", "a very high price"], 2, "a great deal = 아주 싸게 산 것."], ["refer", "\"Teen\" refers to someone aged 13 to 19.", ["to hide", "to ignore", "to forget", "to describe or be about something"], 3, "refer to = ~을 가리키다."], ["release", "The company released a new phone.", ["to stop selling", "to make a new product available to the public", "to hide", "to destroy"], 1, "release = 출시하다."], ["production", "Car production increased this year.", ["the use of things", "the selling of things", "the end of things", "the process of making or growing things"], 3, "production = 생산."], ["polyester", "This jacket is made of polyester.", ["a type of fabric made from plastic", "a natural fabric from sheep", "a type of wood", "a kind of metal"], 0, "polyester = 폴리에스테르 (합성섬유)."], ["shed", "Dogs shed hair in the spring.", ["to collect", "to let something fall off", "to keep", "to grow"], 1, "shed = (털·섬유 등을) 떨어뜨리다."], ["fiber", "Cotton fibers are soft.", ["a thin thread of material", "a stone", "a metal bar", "a thick rope"], 0, "fiber = 섬유."], ["equivalent", "One dollar is the equivalent of about 1,300 won.", ["something completely different", "a smaller copy", "something equal in amount or value", "a mistake"], 2, "equivalent = 같은 양."], ["textile", "The town is famous for its textiles.", ["a type of tool", "a kind of food", "cloth or fabric", "a piece of furniture"], 2, "textile = 직물."], ["garment", "The factory makes garments for many brands.", ["a piece of clothing", "a book", "a kind of fruit", "a pair of glasses"], 0, "garment = 옷 한 벌. garment worker = 의류 노동자."], ["tragedy", "The fire was a terrible tragedy.", ["a happy party", "a very sad event, often with deaths", "a small mistake", "a funny show"], 1, "tragedy = 비극."], ["secondhand", "I bought this bike secondhand.", ["handmade", "brand new", "used before by someone else", "stolen"], 2, "secondhand = 중고."], ["sustainable", "We need more sustainable energy.", ["harmful and wasteful", "very fast", "very cheap", "able to continue without harming the environment"], 3, "sustainable = 지속 가능한."]], "comp": [{"type": "주제·요지", "q": "What is the writer's main point?", "options": ["Cheap fast fashion has hidden environmental and human costs, so we should buy and use clothes more carefully.", "Five-dollar T-shirts are the best deal.", "Polyester is better than cotton.", "Factories in Asia are always safe."], "answer": 0, "ex": "싼 옷 뒤의 환경적·인간적 비용 → 옷을 신중하게 사고 쓰자."}, {"type": "세부 내용", "q": "How much water can it take to grow the cotton for one T-shirt?", "options": ["about 1,100 liters", "about 27 liters", "around 2,700 liters", "about 270,000 liters"], "answer": 2, "ex": "around 2,700 liters of water."}, {"type": "인과 관계와 근거 평가", "q": "Which detail best supports the claim that fast fashion harms people?", "options": ["Most clothes are not recycled.", "Polyester sheds tiny fibers.", "Some brands release new styles every week.", "The Rana Plaza factory collapse killed more than 1,100 workers."], "answer": 3, "ex": "사람에게 미치는 피해(human cost)의 근거는 라나 플라자 사고예요."}, {"type": "추론", "q": "Why might fast fashion brands release new styles every week?", "options": ["to help the environment", "to pay workers more", "to encourage people to keep buying more clothes", "to reduce waste"], "answer": 2, "ex": "encouraging shoppers to buy more and wear each item fewer times."}, {"type": "어조·글쓴이의 의도", "q": "Why does the writer compare 2,700 liters to what one person drinks in two and a half years?", "options": ["to change the topic", "to give advice about drinking water", "to make a large number easier to imagine and more striking", "to prove cotton is healthy"], "answer": 2, "ex": "숫자를 체감하게 만들어 설득력을 높이는 비교예요."}, {"type": "문법 · despite / in spite of", "q": "______ its low price, fast fashion has hidden costs.", "options": ["However", "Because", "Despite", "Although"], "answer": 2, "ex": "뒤에 명사구(its low price) → 전치사 Despite."}, {"type": "문법 · despite / in spite of", "q": "In spite ______ growing awareness, many workers still earn very little.", "options": ["from", "of", "with", "to"], "answer": 1, "ex": "in spite of + 명사."}, {"type": "문법 · despite / in spite of", "q": "Which sentence is correct?", "options": ["Despite it was cheap, I didn't buy it.", "Despite the low price, I didn't buy it.", "In spite of it was cheap, I didn't buy it.", "Despite of the low price, I didn't buy it."], "answer": 1, "ex": "despite + 명사 (despite of는 틀린 표현). 절이 오면 although."}]}, "12": {"passage": "Every day, enormous numbers of plastic bags are used around the world. Many are used for only a few minutes before being thrown away. Countries from Bangladesh to Kenya have already banned or taxed them. Our school newspaper asked two Grade 8 students whether our city should do the same.\n\nYES — Hana\nWhile it is true that plastic bags are cheap and convenient, their real cost appears long after we throw them away. Because they are so light, they easily escape from bins and blow into rivers, eventually reaching the ocean. There, turtles and seabirds often mistake them for food. Unlike paper, plastic does not simply rot; instead, it breaks into tiny pieces that can remain in the environment for hundreds of years. When Bangladesh banned thin plastic bags in 2002, one reason was that discarded bags had blocked drains and worsened flooding. If a country facing such serious challenges could act, our city can act too.\n\nNO — Daniel\nAlthough plastic pollution is a serious issue, a complete ban may not be the most effective solution. Many shoppers would simply switch to paper bags, which require more energy and water to produce. Reusable cotton bags have a similar weakness: they benefit the planet only if people use them many times. Furthermore, many families reuse shopping bags as bin liners, so a ban might lead them to buy thicker plastic bags instead. Rather than banning bags completely, our city could charge a small fee and invest in better recycling.\n\nBoth writers agree that plastic waste is a real problem. What they disagree about is the best way to solve it. Which argument do you find more convincing, and why?", "speaking": "Should your city ban plastic bags? Give your opinion, one point the other side might make, and an example. (60 seconds)", "speakStarters": ["In my opinion, our city should / should not … .", "The main reason is that … .", "For example, … .", "While it is true that … , I still think … ."], "prompt": "Write a three-paragraph opinion essay (about 180 words): Should plastic bags be banned in your city? In your second paragraph, answer the other side using \"While it is true that …\".", "starters": ["Paragraph 1: Many people believe … . In my opinion, … .", "Paragraph 2: 800:{title:"How Honeybees Talk",t:"Honeybees cannot speak, but they have a clever way to share information. When a worker bee finds a field full of flowers, she flies back to the hive and performs a special movement called the waggle dance. First, she walks in a straight line while shaking her body from side to side. Then she circles back and repeats the line again and again. The direction of the straight line tells the other bees which way to fly, using the sun as a guide. The length of the waggle shows how far away the flowers are: the longer she waggles, the farther they must travel. The other bees gather closely around the dancer, feeling her movements in the dark hive. Within minutes, dozens of bees leave to find the flowers. Scientist Karl von Frisch spent many years studying this behavior, and in 1973 he won the Nobel Prize for his discovery. Today, researchers continue to study bee dances to learn how to protect bees, which are essential for growing much of the food we eat.",

async function api(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",...(TOKEN?{Authorization:"Bearer "+TOKEN}:{})},body:JSON.stringify(body||{})});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw {code:j.code||("http_"+r.status),message:j.error||""};
  return j;
}
async function dget(p){ if(WC[p]) return cp(WC[p]); try{ const j=await api("/api/db",{op:"get",path:p}); return j.data||null; }catch(e){ console.warn(e); return null; } }
async function dset(p,data){ const d=cp(data); delete d.id; await api("/api/db",{op:"set",path:p,data:d}); WC[p]=d; }
function mergeWC(col,rows){ const by={}; rows.forEach(r=>by[r.id]=r); Object.keys(WC).forEach(k=>{ const s=k.split("/"); if(s.length===2&&s[0]===col) by[s[1]]={id:s[1],...cp(WC[k])}; }); return Object.values(by); }

// word-level diff (LCS)
function diff(a,b){
  const A=a.split(/\s+/).filter(Boolean),B=b.split(/\s+/).filter(Boolean),n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const keepA=new Array(n).fill(false),keepB=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){ if(A[i]===B[j]){keepA[i]=keepB[j]=true;i++;j++;} else if(L[i+1][j]>=L[i][j+1])i++; else j++; }
  return { a:A.map((w,k)=>keepA[k]?esc(w):`<span class="del">${esc(w)}</span>`).join(" "),
           b:B.map((w,k)=>keepB[k]?esc(w):`<span class="add">${esc(w)}</span>`).join(" ") };
}

function ltJudge(prov,read){
  const lvl=prov>=600?prov:600, rc=read.filter(Boolean).length, pct=rc/6;
  let final=lvl, move="stay";
  if(pct>=0.85 && prov>=600 && lvl<1000){ final=lvl+100; move="up"; }
  else if(pct<0.5 && lvl>600){ final=lvl-100; move="down"; }
  if(prov===0 && pct<0.5){ final=0; move="down"; }
  return {lvl,rc,pct,final,move};
}

   <div class="stat"><div class="k">제출된 유닛</div><div class="v">${doneU} <i>/ ${studs.length*OPEN_UNITS.length}</i></div></div><div class="stat"><div class="k">열린 유닛</div><div class="v">${OPEN_UNITS.length} <i>/ ${TOTAL_UNITS}</i></div></div></div>

let PASS=null, RUN=0, TTS_ON=false;
function prepPassage(){
  const el=$("#pass"); if(!el||el.dataset.ready) return;
  let txt=""; const words=[];
  const walk=n=>{ for(const c of [...n.childNodes]){
    if(c.nodeType===3){ const frag=document.createDocumentFragment();
      c.nodeValue.split(/(\s+)/).forEach(part=>{ if(!part) return;
        if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); if(!txt.endsWith(" ")) txt+=" "; }
        else { const sp=document.createElement("span"); sp.className="tw"; sp.textContent=part; sp.dataset.w=words.length; words.push({el:sp,start:txt.length,end:txt.length+part.length}); txt+=part; frag.appendChild(sp); } });
      c.replaceWith(frag); }
    else if(c.nodeName==="BR"||(c.classList&&c.classList.contains("pgap"))){ if(!txt.endsWith(" ")) txt+=" "; }
    else walk(c); } };
  walk(el); el.dataset.ready="1";
  const sents=[]; const re=/[^.!?]+[.!?]+["”’)\]]*|[^.!?]+$/g; let m;
  while((m=re.exec(txt))){ const s=m.index+(m[0].length-m[0].trimStart().length), e=m.index+m[0].trimEnd().length; if(e>s) sents.push({start:s,end:e}); }
  PASS={txt,words,sents};
  el.onclick=e=>{ const w=e.target.closest(".tw"); if(!w) return; const wi=+w.dataset.w, st=PASS.words[wi].start; const si=Math.max(0,PASS.sents.findIndex(s=>st>=s.start&&st<s.end)); startRead(si); };
}
function clearMarks(){ if(!PASS) return; PASS.words.forEach(w=>w.el.classList.remove("ts","tc")); }
function wordsIn(a,b){ return PASS.words.filter(w=>w.start<b&&w.end>a); }
function stopTTS(){ RUN++; TTS_ON=false; try{ speechSynthesis.cancel(); }catch(e){} clearMarks(); const b=$("#ttsBtn"); if(b) b.textContent="🔊 지문 듣기"; }
function startRead(si){
  if(!("speechSynthesis" in window)){ toast("이 브라우저에서는 지문 듣기를 쓸 수 없어요"); return; }
  prepPassage(); if(!PASS) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  const run=++RUN; TTS_ON=true; const b=$("#ttsBtn"); if(b) b.textContent="■ 멈추기";
  const voice=speechSynthesis.getVoices().find(v=>/en-US/i.test(v.lang));
  const speakOne=i=>{
    if(run!==RUN) return;
    if(i>=PASS.sents.length){ stopTTS(); return; }
    const s=PASS.sents[i], text=PASS.txt.slice(s.start,s.end);
    clearMarks(); const sw=wordsIn(s.start,s.end); sw.forEach(w=>w.el.classList.add("ts"));
    if(sw[0]){ const r=sw[0].el.getBoundingClientRect(); if(r.top<80||r.bottom>innerHeight-40) sw[0].el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=0.9; if(voice) u.voice=voice;
    u.onboundary=e=>{ if(run!==RUN||(e.name&&e.name!=="word")) return; const pos=s.start+e.charIndex;
      const ws=wordsIn(s.start,s.end); const w=ws.find(w=>pos<w.end&&pos>=w.start-1)||ws.find(w=>w.start>=pos);
      if(w){ ws.forEach(x=>{ x.el.classList.add("ts"); if(x!==w) x.el.classList.remove("tc"); }); w.el.classList.add("tc"); } };
    u.onend=()=>{ if(run===RUN) speakOne(i+1); };
    u.onerror=e=>{ if(run===RUN&&e.error!=="interrupted"&&e.error!=="canceled") speakOne(i+1); };
    speechSynthesis.speak(u);
  };
  speakOne(si||0);
}
function sayWord(w,slow){
  try{ if(!("speechSynthesis" in window)) throw 0; stopTTS();
    const u=new SpeechSynthesisUtterance(w); u.lang="en-US"; u.rate=slow?0.6:0.85;
    const v=speechSynthesis.getVoices().find(v=>/en-US/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u);
  }catch(e){ toast("이 브라우저에서는 발음 듣기를 쓸 수 없어요"); }
}
function toggleTTS(){ if(TTS_ON) return stopTTS(); startRead(0); }

// ---------- boot ----------
(async function boot(){
  bar(); render();
  if(!TOKEN) return;
  try{ const j=await api("/api/me",{});
    if(j.role==="teacher"){ S.teacher=true; S.t="check"; S.view="teacher"; }
    else if(j.student){ S.student=j.student; useLevel(stLevel(j.student)); S.view="dash"; }
  }catch(e){ setToken(null); }
  bar(); render();
})();
</script>
